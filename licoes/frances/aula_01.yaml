id: "aula-01"
titulo: "Aula 01 — Conhecer alguém durante uma viagem"
nivel: "A1 → A2"
velocidade: "-10%"
bloco: "1 · Sobrevivência e Chegada (01–05)"
tipo: "aula"
ordem: 1
foco: "Apresentação, perguntas de retorno, être/habiter/venir e contraste depuis vs pendant"
notion_url: "https://app.notion.com/p/42205941420581108f47d82286515477"

cena:
  - "Une rencontre à la gare."
  - "Je m'appelle Victor. J'habite à Cuiabá, au Brésil."
  - "Cette semaine, je suis en vacances en France, pour sept jours."
  - "J'ai étudié le français pendant un an, mais je voudrais parler plus facilement."
  - "Vendredi soir, je suis arrivé à la gare. Il faisait un peu froid."
  - "Près de la sortie, une femme m'a parlé : « Bonjour ! Vous êtes en vacances ici ? »"
  - "J'ai répondu : « Oui, je suis en vacances. Je m'appelle Victor. Et vous ? »"
  - "« Moi, c'est Camille. Vous venez d'où ? »"
  - "« Je viens du Brésil. J'habite à Cuiabá. »"
  - "« C'est loin ! Vous restez combien de temps ? »"
  - "« Une semaine. Et vous, vous habitez ici ? »"
  - "« Oui, j'habite près de la gare. Vous parlez français depuis longtemps ? »"
  - "« Pardon ? Vous pouvez répéter, s'il vous plaît ? Un peu plus lentement. »"
  - "Elle a souri et elle a répété la question, plus lentement."
  - "« J'ai étudié le français pendant un an. Je voudrais parler plus facilement. »"
  - "« Très bien. Vous aimez visiter les musées ? »"
  - "« Oui, mais je préfère me promener dans la ville. Qu'est-ce que vous me conseillez ? »"
  - "« Demain, vous pouvez visiter la vieille ville. Les rues sont jolies, et il y a un très bon café près de l'église. »"
  - "« Merci beaucoup, Camille. À demain, peut-être ! »"
  - "« Avec plaisir. Bon séjour, Victor ! »"

vocabulario:
  - fr: "une rencontre"
