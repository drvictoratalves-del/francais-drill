pronuncia:
  - fr: "Je m'appelle Victor. Et vous ?"
    pt: "Me chamo Victor. E o senhor / a senhora?"
    dica: "Arredonde bem o 'ou' em 'vous' (/vu/) e mantenha o 's' final mudo."
  - fr: "Je viens du Brésil. J'habite à Cuiabá."
    pt: "Venho do Brasil. Moro em Cuiabá."
    dica: "Contraste /y/ em 'du' (lábios projetados de 'u' com língua de 'i'); o 'h' de 'habite' é mudo."
  - fr: "Cette semaine, je suis en vacances en France."
    pt: "Esta semana, estou de férias na França."
    dica: "Liaison suave em 'suis en' (/sɥi.zɑ̃/) e vogal nasal aberta em 'en France'."
  - fr: "J'ai étudié le français pendant un an."
    pt: "Estudei francês durante um ano."
    dica: "Liaison em 'un an' (/œ̃.nɑ̃/); 'pendant' termina sem pronunciar o 't'."
  - fr: "Vous pouvez répéter, s'il vous plaît ? Un peu plus lentement."
    pt: "Pode repetir, por favor? Um pouco mais devagar."
    dica: "Em 'un peu', lábios arredondados (/ø/); 'plus' antes de consoante soa /ply/ sem 's'."
  - fr: "Vous parlez français depuis longtemps ?"
    pt: "O senhor fala francês há muito tempo?"
    dica: "Atenção ao /y/ de 'depuis' e ao 'ps' mudo no fim de 'longtemps' (/lɔ̃.tɑ̃/)."
  - fr: "Je voudrais parler plus facilement."
    pt: "Eu gostaria de falar com mais facilidade."
    dica: "Condicional de cortesia: 'voudrais' termina em /ɛ/, sem pronunciar o 's'."
  - fr: "Je préfère me promener dans la ville."
    pt: "Eu prefiro passear pela cidade."
    dica: "Em 'ville', o 'll' soa /l/ normal (/vil/), não /j/."
  - fr: "Qu'est-ce que vous me conseillez ?"
    pt: "O que você me recomenda?"
    dica: "Fale 'Qu'est-ce que' num bloco só (/kɛs.kə/) e 'conseillez' com som de /j/."
  - fr: "Les rues sont jolies, et il y a un très bon café près de l'église."
    pt: "As ruas são bonitas, e há um café muito bom perto da igreja."
    dica: "Contraste /y/ em 'rues' e liaison natural em 'très bon' sem soar o 's' antes de consoante."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je viens du Brésil. J'habite à Cuiabá."
        pt: "Venho do Brasil. Moro em Cuiabá."
      - fr: "J'ai étudié le français pendant un an."
        pt: "Estudei francês durante um ano."
      - fr: "Vous parlez français depuis longtemps ?"
        pt: "O senhor fala francês há muito tempo?"
      - fr: "Vous pouvez répéter, s'il vous plaît ? Un peu plus lentement."
        pt: "Pode repetir, por favor? Um pouco mais devagar."
      - fr: "Qu'est-ce que vous me conseillez ?"
        pt: "O que você me recomenda?"

  - tipo: semaforo
    itens:
      - errado: "Je viens de Brésil."
        certo: "Je viens du Brésil."
        nota_pt: "Países masculinos levam artigo contraído: de mais le vira du."
      - errado: "J'habite en Cuiabá."
        certo: "J'habite à Cuiabá."
        nota_pt: "Antes de cidades, em francês usa-se sempre à, nunca en."
      - errado: "J'ai étudié le français depuis un an."
        certo: "J'ai étudié le français pendant un an."
        nota_pt: "Para um período já encerrado no passado, usa-se pendant. Depuis serve para o que continua hoje."
      - errado: "J'ai arrivé à la gare."
        certo: "Je suis arrivé à la gare."
        nota_pt: "Arriver faz o passé composé com être, não com avoir."

  - tipo: producao
    itens:
      - pergunta: "Vous venez d'où ?"
        resposta: "Je viens du Brésil. J'habite à Cuiabá."
      - pergunta: "Vous parlez français depuis longtemps ?"
        resposta: "J'ai étudié le français pendant un an."
      - pergunta: "Comment demander de répéter plus lentement ?"
        resposta: "Vous pouvez répéter, s'il vous plaît ? Un peu plus lentement."
      - pergunta: "Comment demander une recommandation en ville ?"
        resposta: "Qu'est-ce que vous me conseillez ?"

fala_livre:
  enunciado: "Você conhece alguém num café durante uma viagem. Apresente-se sem ler o texto, sustente a troca fazendo perguntas de retorno e peça uma recomendação."
  passos:
    - "Diga seu nome, de onde vem, onde mora e quanto tempo vai ficar."
    - "Diga o que prefere fazer na cidade e pergunte se a pessoa mora ali (« Et vous ? »)."
    - "Peça repetição com cortesia (« Vous pouvez répéter, s'il vous plaît ? ») e confirme o que entendeu."
  criterio: "Apresentar-se, sustentar uma troca breve com perguntas de retorno e usar pedido de esclarecimento quando necessário."
  duracao_alvo_s: 60
