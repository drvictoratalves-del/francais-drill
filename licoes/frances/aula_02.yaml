id: "aula-02"
titulo: "Aula 02 — No café — pedir e esclarecer"
nivel: "A1 → A2"
velocidade: "-10%"
bloco: "1 · Sobrevivência e Chegada (01–05)"
tipo: "aula"
ordem: 2
foco: "Pedidos corteses (je voudrais), sur place / à emporter, valores e pagamento por cartão"
notion_url: "https://app.notion.com/p/422059414205815e9c69ef1f3be84268"

cena:
  - "Au café près de l'église."
  - "Le lendemain matin, je suis allé au café près de l'église. C'était le café de Camille. La salle était petite et calme."
  - "Une serveuse m'a dit : « Bonjour ! Vous désirez ? »"
  - "« Bonjour. Je voudrais un café au lait, s'il vous plaît. »"
  - "« Sur place ou à emporter ? »"
  - "« Sur place. Vous avez des croissants ? »"
  - "« Oui, ils sont très bons ce matin. »"
  - "« Parfait. Alors, un café au lait et un croissant. »"
  - "« Très bien. Un café au lait et un croissant, ça fait six euros. »"
  - "« Pardon, six euros en tout ? »"
  - "« Oui, c'est ça. Le café au lait est à trois euros cinquante, et le croissant est à deux euros cinquante. »"
  - "« D'accord, merci. Je paie par carte, c'est possible ? »"
  - "« Oui, bien sûr. »"
  - "J'ai payé et je me suis assis près de la fenêtre."
  - "Le croissant était délicieux, et le café était chaud."
  - "J'ai regardé la rue : il y avait beaucoup de monde."
  - "Après, j'ai remercié la serveuse : « Merci beaucoup. Au revoir ! »"
  - "« Au revoir, bonne journée ! »"

