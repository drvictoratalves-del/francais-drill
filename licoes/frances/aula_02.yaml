pronuncia:
  - fr: "Je voudrais un café au lait, s'il vous plaît."
    pt: "Eu gostaria de um café com leite, por favor."
    dica: "Fale em grupos de sentido: Je voudrais / un café au lait / s'il vous plaît. O 't' de 'lait' é mudo."
  - fr: "Sur place ou à emporter ?"
    pt: "Para tomar aqui ou para levar?"
    dica: "Contraste /y/ em 'sur' e /u/ em 'ou'; 'emporter' termina em /e/ fechado."
  - fr: "Vous avez des croissants ?"
    pt: "Vocês têm croissants?"
    dica: "Faça a liaison em 'Vous avez' (/vu.za.ve/) e mantenha o 'ts' final mudo em 'croissants'."
  - fr: "Un café au lait et un croissant, ça fait six euros."
    pt: "Um café com leite e um croissant, dá seis euros."
    dica: "Liaison obrigatória em 'six euros' (/si.zø.ʁo/): o 'x' soa /z/."
  - fr: "Pardon, six euros en tout ?"
    pt: "Com licença, seis euros no total?"
    dica: "Suba a entonação no final da pergunta; o 't' final de 'tout' é mudo."
  - fr: "Le café au lait est à trois euros cinquante."
    pt: "O café com leite custa três euros e cinquenta."
    dica: "Liaison em 'trois euros' (/tʁwa.zø.ʁo/) e nasal limpa em 'cinquante'."
  - fr: "Je paie par carte, c'est possible ?"
    pt: "Pago com cartão, pode ser?"
    dica: "'Paie' soa /pɛ/ (uma sílaba); 'carte' pronuncia o 't' final seco."
  - fr: "J'ai payé et je me suis assis près de la fenêtre."
    pt: "Paguei e me sentei perto da janela."
    dica: "Em 'assis', o 's' final é mudo (/a.si/)."
  - fr: "Il y avait beaucoup de monde."
    pt: "Havia muita gente."
    dica: "O 'p' final de 'beaucoup' é mudo (/bo.ku/) e 'avait' soa /a.vɛ/."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je voudrais un café au lait, s'il vous plaît."
        pt: "Eu gostaria de um café com leite, por favor."
      - fr: "Sur place ou à emporter ?"
        pt: "Para tomar aqui ou para levar?"
      - fr: "Pardon, six euros en tout ?"
        pt: "Com licença, seis euros no total?"
      - fr: "Je paie par carte, c'est possible ?"
        pt: "Pago com cartão, pode ser?"
      - fr: "J'ai payé et je me suis assis près de la fenêtre."
        pt: "Paguei e me sentei perto da janela."

  - tipo: semaforo
    itens:
      - errado: "Je veux un café au lait."
        certo: "Je voudrais un café au lait, s'il vous plaît."
        nota_pt: "Je veux soa brusco no balcão; o condicional je voudrais é o padrão de cortesia."
      - errado: "Un thé pour emporter."
        certo: "Un thé à emporter."
        nota_pt: "A expressão fixa para levar é sempre à emporter, não pour emporter."
      - errado: "Je paie avec carte."
        certo: "Je paie par carte."
        nota_pt: "Para meio de pagamento com cartão usa-se par carte."
      - errado: "Un café et un croissant, c'est six euros fait."
        certo: "Un café et un croissant, ça fait six euros."
        nota_pt: "Para o total da conta usa-se a estrutura fixa ça fait + valor."

  - tipo: producao
    itens:
      - pergunta: "Bonjour ! Vous désirez ?"
        resposta: "Je voudrais un café au lait, s'il vous plaît."
      - pergunta: "Sur place ou à emporter ?"
        resposta: "Sur place. Vous avez des croissants ?"
      - pergunta: "Ça fait six euros."
        resposta: "Pardon, six euros en tout ? Je paie par carte, c'est possible ?"
      - pergunta: "Comment dire que vous avez payé par carte ?"
        resposta: "J'ai payé par carte."

fala_livre:
  enunciado: "Você está num café: peça uma bebida e um lanche, reaja quando um item acabar, escolha entre consumir ali ou levar, confirme o total e combine o pagamento por cartão."
  passos:
    - "Faça o pedido usando « Je voudrais… » em grupos de sentido claros."
    - "Responda « sur place » ou « à emporter » e peça um item alternativo se o primeiro acabou."
    - "Confirme o preço total (« … euros en tout ? ») e pergunte se pode pagar por cartão."
  criterio: "Pedido compreensível, resposta à alternativa e confirmação do total."
  duracao_alvo_s: 50
