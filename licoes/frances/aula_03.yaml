id: "aula-03"
titulo: "Aula 03 — No hotel — confirmar a reserva"
nivel: "A1 → A2"
velocidade: "-10%"
bloco: "1 · Sobrevivência e Chegada (01–05)"
tipo: "aula"
ordem: 3
foco: "Reserva de hotel, horários completos, pedido de repetição e prolongamento de estadia"
notion_url: "https://app.notion.com/p/42205941420581478bcde002ad87ae78"

cena:
  - "À l'hôtel."
  - "Vendredi soir, après mon arrivée, j'ai pris un taxi pour aller à l'hôtel. L'hôtel était petit mais très joli, près du parc."
  - "À la réception, un monsieur m'a demandé : « Bonjour, vous avez une réservation ? »"
  - "J'ai répondu : « Oui, au nom d'Alves, pour deux nuits. »"
  - "« Une chambre pour une personne, c'est bien ça ? »"
  - "« Oui, c'est ça. Le petit-déjeuner est compris ? »"
  - "« Oui, il est servi de sept heures à dix heures, dans la salle du rez-de-chaussée. »"
  - "« Vous pouvez répéter les horaires, s'il vous plaît ? »"
  - "« Bien sûr. De sept heures à dix heures. »"
  - "« Merci. Je reste une semaine. Je voudrais rester plus longtemps, c'est possible ? »"
  - "« Oui, je peux ajouter cinq nuits. Votre chambre est au deuxième étage. Voici la clé. »"
  - "« Merci beaucoup. Il y a un ascenseur ? »"
  - "« Oui, à gauche. Et le mot de passe du Wi-Fi est sur le papier, dans la chambre. »"
  - "« Parfait. Bonne soirée ! »"
  - "« Bonne soirée, monsieur. Bon séjour ! »"

vocabulario:
  - fr: "une réservation"
    pt: "uma reserva"
  - fr: "au nom de"
    pt: "em nome de"
  - fr: "une chambre"
    pt: "um quarto"
  - fr: "le petit-déjeuner"
    pt: "o café da manhã"
  - fr: "compris(e)"
    pt: "incluído(a)"
  - fr: "le rez-de-chaussée"
    pt: "o térreo"
  - fr: "le deuxième étage"
    pt: "o segundo andar"
  - fr: "la clé"
    pt: "a chave"
  - fr: "l'ascenseur"
    pt: "o elevador"
  - fr: "le mot de passe"
    pt: "a senha"
  - fr: "plus longtemps"
    pt: "mais tempo"
  - fr: "bon séjour"
    pt: "boa estadia"

pronuncia:
  - fr: "Oui, au nom d'Alves, pour deux nuits."
    pt: "Sim, em nome de Alves, para duas noites."
    dica: "Em 'deux' (/dø/), arredonde os lábios; em 'nuits' (/nɥi/), o 'ts' final é mudo."
  - fr: "Le petit-déjeuner est compris ?"
    pt: "O café da manhã está incluído?"
    dica: "O 's' final de 'compris' é mudo (/kɔ̃.pʁi/)."
  - fr: "Il est servi de sept heures à dix heures."
    pt: "É servido das sete às dez."
    dica: "Pronuncie o 't' de 'sept' (/sɛt/) e faça liaison em 'dix heures' (/di.zœʁ/)."
  - fr: "Vous pouvez répéter les horaires, s'il vous plaît ?"
    pt: "Pode repetir os horários, por favor?"
    dica: "Liaison obrigatória em 'les horaires' (/le.zɔ.ʁɛʁ/), pois o 'h' é mudo."
  - fr: "Je voudrais rester plus longtemps, c'est possible ?"
    pt: "Gostaria de ficar mais tempo, é possível?"
    dica: "Em 'longtemps', só duas sílabas nasais (/lɔ̃.tɑ̃/); 'g', 'p' e 's' são mudos."
  - fr: "Votre chambre est au deuxième étage."
    pt: "Seu quarto fica no segundo andar."
    dica: "O 'x' em 'deuxième' soa /z/ (/dø.zjɛm/), seguido de liaison suave."
  - fr: "Il y a un ascenseur ?"
    pt: "Tem elevador?"
    dica: "'Ascenseur' tem nasal /ɑ̃/ e termina em /œʁ/ arredondado."
  - fr: "Le mot de passe du Wi-Fi est sur le papier."
    pt: "A senha do Wi-Fi está no papel."
    dica: "'Mot' tem 't' mudo (/mo/); 'du' e 'sur' usam /y/ bem projetado."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Oui, au nom d'Alves, pour deux nuits."
        pt: "Sim, em nome de Alves, para duas noites."
      - fr: "Le petit-déjeuner est compris ?"
        pt: "O café da manhã está incluído?"
      - fr: "Vous pouvez répéter les horaires, s'il vous plaît ?"
        pt: "Pode repetir os horários, por favor?"
      - fr: "Je voudrais rester plus longtemps, c'est possible ?"
        pt: "Gostaria de ficar mais tempo, é possível?"
      - fr: "Il y a un ascenseur ?"
        pt: "Tem elevador?"

  - tipo: semaforo
    itens:
      - errado: "J'ai une réservation dans le nom d'Alves."
        certo: "J'ai une réservation au nom d'Alves."
        nota_pt: "Em nome de em francês é sempre au nom de, não dans le nom de."
      - errado: "Le petit-déjeuner est servi depuis sept heures jusqu'à dix."
        certo: "Le petit-déjeuner est servi de sept heures à dix heures."
        nota_pt: "Para faixa de horário de funcionamento, o par padrão é de … à …"
      - errado: "Je veux rester plus de temps."
        certo: "Je voudrais rester plus longtemps."
        nota_pt: "Use je voudrais por cortesia e o advérbio fixo plus longtemps para mais tempo."
      - errado: "J'ai prendu un taxi."
        certo: "J'ai pris un taxi."
        nota_pt: "O particípio de prendre é irregular: pris."

  - tipo: producao
    itens:
      - pergunta: "Bonjour, vous avez une réservation ?"
        resposta: "Oui, au nom d'Alves, pour deux nuits."
      - pergunta: "Comment demander si le petit-déjeuner est inclus ?"
        resposta: "Le petit-déjeuner est compris ?"
      - pergunta: "Vous n'avez pas compris les horaires. Que dites-vous ?"
        resposta: "Vous pouvez répéter les horaires, s'il vous plaît ?"
      - pergunta: "Comment demander à prolonger votre séjour ?"
        resposta: "Je voudrais rester plus longtemps, c'est possible ?"

fala_livre:
  enunciado: "Você chega à recepção do hotel e há uma divergência na reserva (só consta uma noite, mas você reservou duas ou quer ficar mais tempo). Resolva a reserva e confirme os detalhes práticos."
  passos:
    - "Informe seu nome e corrija a quantidade de noites da reserva."
    - "Pergunte se o café da manhã está incluído e repita o horário completo para confirmar."
    - "Pergunte pelo elevador, andar do quarto ou senha do Wi-Fi."
  criterio: "Reserva identificada, duração corrigida quando necessário e horário compreendido."
  duracao_alvo_s: 60
