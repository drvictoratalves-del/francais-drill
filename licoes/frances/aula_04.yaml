id: "aula-04"
titulo: "Aula 04 — Na cidade — pedir e confirmar um caminho"
nivel: "A1 → A2"
velocidade: "-10%"
bloco: "1 · Sobrevivência e Chegada (01–05)"
tipo: "aula"
ordem: 4
foco: "Pedir e confirmar direções na cidade, imperativo (allez, tournez, continuez) e imparfait vs passé composé"
notion_url: "https://app.notion.com/p/422059414205811f9e13c8246d82de5e"

cena:
  - "Dans la ville."
  - "Samedi matin, après le petit-déjeuner, je suis sorti de l'hôtel. Je voulais aller à la gare, mais je ne connaissais pas le chemin."
  - "Dans la rue, j'ai demandé à une passante : « Bonjour, excusez-moi. Pour aller à la gare, s'il vous plaît ? »"
  - "« Allez tout droit, puis tournez à gauche au feu. »"
  - "« À gauche au feu ? »"
  - "« Oui. Ensuite, continuez encore deux cents mètres. La gare est à droite, en face de la pharmacie. »"
  - "« C'est loin à pied ? »"
  - "« Non, c'est à environ cinq minutes. »"
  - "« Merci beaucoup. Et pour aller à la vieille ville ? »"
  - "« C'est dans l'autre direction. Du feu, tournez à droite, puis allez tout droit jusqu'à l'église. La vieille ville commence là. »"
  - "« Si j'ai bien compris : tout droit, à gauche au feu pour la gare, et à droite pour la vieille ville. »"
  - "« C'est exact. »"
  - "« Merci encore. Bonne journée ! »"
  - "« Je vous en prie. Bonne visite ! »"
  - "J'ai répété le chemin à voix basse, puis je suis allé à la gare sans problème."

vocabulario:
  - fr: "le chemin"
    pt: "o caminho"
  - fr: "tout droit"
    pt: "sempre em frente"
  - fr: "à gauche"
    pt: "à esquerda"
  - fr: "à droite"
    pt: "à direita"
  - fr: "au feu"
    pt: "no semáforo"
  - fr: "en face de"
    pt: "em frente a"
  - fr: "à pied"
    pt: "a pé"
  - fr: "jusqu'à"
    pt: "até"
  - fr: "l'autre direction"
    pt: "a outra direção"
  - fr: "à voix basse"
    pt: "em voz baixa"
  - fr: "si j'ai bien compris"
    pt: "se entendi bem"
  - fr: "je vous en prie"
    pt: "de nada"

pronuncia:
  - fr: "Excusez-moi. Pour aller à la gare, s'il vous plaît ?"
    pt: "Com licença. Para ir à estação, por favor?"
    dica: "Em 'excusez', marque o /y/ de '-cu-' e o /z/ antes de '-ez'."
  - fr: "Allez tout droit, puis tournez à gauche au feu."
    pt: "Siga em frente e depois vire à esquerda no semáforo."
    dica: "'Tout droit' termina sem 't' (/tu dʁwa/); 'feu' tem /ø/ fechado."
  - fr: "La gare est à droite, en face de la pharmacie."
    pt: "A estação fica à direita, em frente à farmácia."
    dica: "Contraste 'tout droit' (sem /t/ final) com 'à droite' (com /t/ final audível: /dʁwat/)."
  - fr: "C'est loin à pied ?"
    pt: "É longe a pé?"
    dica: "'Loin' usa a nasal /lwɛ̃/ e 'pied' termina em /e/ sem pronunciar o 'd'."
  - fr: "Non, c'est à environ cinq minutes."
    pt: "Não, fica a cerca de cinco minutos."
    dica: "Em 'cinq minutes', o 'q' costuma suavizar antes de consoante (/sɛ̃ mi.nyt/); atenção ao /y/ de 'minutes'."
  - fr: "Du feu, tournez à droite, puis allez tout droit jusqu'à l'église."
    pt: "Do semáforo, vire à direita e depois siga em frente até a igreja."
    dica: "Marque os dois /y/ seguidos em 'du' e 'jusqu'à' sem virar /u/."
  - fr: "Si j'ai bien compris : tout droit, puis à gauche au feu."
    pt: "Se entendi bem: em frente e depois à esquerda no semáforo."
    dica: "'Compris' termina em /i/ (o 's' é mudo)."
  - fr: "Je suis sorti de l'hôtel et je suis allé à la gare."
    pt: "Saí do hotel e fui até a estação."
    dica: "Liaison suave em 'suis allé' (/sɥi.za.le/) e /y/ limpo em 'suis'."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Excusez-moi. Pour aller à la gare, s'il vous plaît ?"
        pt: "Com licença. Para ir à estação, por favor?"
      - fr: "Allez tout droit, puis tournez à gauche au feu."
        pt: "Siga em frente e depois vire à esquerda no semáforo."
      - fr: "La gare est à droite, en face de la pharmacie."
        pt: "A estação fica à direita, em frente à farmácia."
      - fr: "C'est loin à pied ?"
        pt: "É longe a pé?"
      - fr: "Si j'ai bien compris : tout droit, puis à gauche."
        pt: "Se entendi bem: em frente e depois à esquerda."

  - tipo: semaforo
    itens:
      - errado: "Allez tout droite."
        certo: "Allez tout droit."
        nota_pt: "Em frente é sempre tout droit (masculino, sem pronunciar o t). À direita é à droite (com t audível)."
      - errado: "En face la pharmacie."
        certo: "En face de la pharmacie."
        nota_pt: "En face exige sempre a preposição de antes do lugar."
      - errado: "J'ai sorti de l'hôtel."
        certo: "Je suis sorti de l'hôtel."
        nota_pt: "Sortir (sem objeto direto) faz o passé composé com être."
      - errado: "C'est loin en pied ?"
        certo: "C'est loin à pied ?"
        nota_pt: "A pé em francês é sempre à pied, nunca en pied."

  - tipo: producao
    itens:
      - pergunta: "Comment demander le chemin de la gare poliment ?"
        resposta: "Excusez-moi. Pour aller à la gare, s'il vous plaît ?"
      - pergunta: "Comment demander si c'est loin à pied ?"
        resposta: "C'est loin à pied ?"
      - pergunta: "Comment dire : em frente à farmácia ?"
        resposta: "En face de la pharmacie."
      - pergunta: "Comment confirmer un itinéraire que vous venez d'entendre ?"
        resposta: "Si j'ai bien compris : tout droit, puis à gauche au feu."

fala_livre:
  enunciado: "Imagine um mapa simples com hotel, estação, farmácia e café. Peça orientação para chegar a um destino, confirme se é longe a pé e repita as etapas para garantir que entendeu."
  passos:
    - "Aborde alguém com « Excusez-moi, pour aller à…, s'il vous plaît ? »."
    - "Depois inverta o papel e explique um trajeto de 3 etapas usando « Allez tout droit », « Tournez à gauche/droite » e « En face de… »."
    - "Encerre confirmando o caminho com « Si j'ai bien compris… »."
  criterio: "Pedido claro, contraste audível entre « tout droit » e « à droite » e confirmação do destino."
  duracao_alvo_s: 60
