id: "aula-05"
titulo: "Aula 05 — Transportes — destino, horário e bilhete"
nivel: "A1 → A2"
velocidade: "-10%"
bloco: "1 · Sobrevivência e Chegada (01–05)"
tipo: "aula"
ordem: 5
foco: "Bilhete de trem (aller simple / aller-retour), horários, plataformas, devoir e partir"
notion_url: "https://app.notion.com/p/42205941420581dca0cce4f8b2d9a1c2"

cena:
  - "À la gare, un billet pour Lyon."
  - "À la gare, il y avait beaucoup de monde. J'ai fait la queue au guichet."
  - "Après quelques minutes, un agent m'a dit : « Bonjour. Je vous écoute. »"
  - "« Bonjour. Je voudrais un billet pour Lyon, s'il vous plaît. »"
  - "« Un aller simple ou un aller-retour ? »"
  - "« Un aller simple. À quelle heure part le prochain train ? »"
  - "« À quatorze heures vingt, voie six. »"
  - "« Quatorze heures vingt, voie six, c'est bien ça ? »"
  - "« Oui, c'est ça. Vous souhaitez réserver ? »"
  - "« Oui. Combien coûte le billet ? »"
  - "« Trente euros. »"
  - "« D'accord. Est-ce que je dois changer de train ? »"
  - "« Non, c'est un train direct. Le voyage dure deux heures. »"
  - "« Parfait. Je paie par carte. »"
  - "J'ai payé et j'ai pris mon billet. Sur le grand écran, j'ai regardé les horaires : mon train n'avait pas de retard."
  - "J'ai demandé à un employé : « Excusez-moi, la voie six, c'est dans quelle direction ? »"
  - "« Tout droit, puis à droite. »"
  - "« Merci beaucoup. »"

vocabulario:
  - fr: "le billet"
    pt: "o bilhete"
  - fr: "le guichet"
    pt: "o guichê"
  - fr: "faire la queue"
    pt: "pegar fila"
  - fr: "un aller simple"
    pt: "passagem só de ida"
  - fr: "un aller-retour"
    pt: "passagem de ida e volta"
  - fr: "le prochain train"
    pt: "o próximo trem"
  - fr: "la voie six"
    pt: "a plataforma 6"
  - fr: "un train direct"
    pt: "um trem direto"
  - fr: "le grand écran"
    pt: "o painel / telão"
  - fr: "le retard"
    pt: "o atraso"
  - fr: "je vous écoute"
    pt: "pois não / estou ouvindo"
  - fr: "est-ce que je dois… ?"
    pt: "eu preciso…?"

pronuncia:
  - fr: "Je voudrais un billet pour Lyon, s'il vous plaît."
    pt: "Eu gostaria de um bilhete para Lyon, por favor."
    dica: "Em 'billet', o 'll' soa /j/ e o 't' final é mudo (/bi.jɛ/)."
  - fr: "Un aller simple ou un aller-retour ?"
    pt: "Só ida ou ida e volta?"
    dica: "Contraste o /u/ de 'retour' com o /ø/ ou /y/ de outras palavras; 'aller' termina em /e/."
  - fr: "À quelle heure part le prochain train ?"
    pt: "A que horas sai o próximo trem?"
    dica: "'Part' tem 't' mudo (/paʁ/) e 'prochain' termina na nasal /ɛ̃/ sem pronunciar o 'n'."
  - fr: "Quatorze heures vingt, voie six, c'est bien ça ?"
    pt: "14h20, plataforma 6, é isso mesmo?"
    dica: "Em 'vingt', o 'gt' é mudo (/vɛ̃/); em 'six' sozinho no fim, o 'x' soa /s/ (/sis/)."
  - fr: "Combien coûte le billet ? Trente euros."
    pt: "Quanto custa o bilhete? Trinta euros."
    dica: "Atenção ao contraste treize (/tʁɛz/) vs trente (/tʁɑ̃t/); 'coûte' pronuncia o 't' final."
  - fr: "Est-ce que je dois changer de train ?"
    pt: "Eu preciso trocar de trem?"
    dica: "Fale 'Est-ce que' como um bloco curto (/ɛs.kə/); 'dois' termina em /wa/ sem 's'."
  - fr: "Non, c'est un train direct. Le voyage dure deux heures."
    pt: "Não, é um trem direto. A viagem dura duas horas."
    dica: "Marque /y/ em 'dure' (/dyʁ/) e a liaison em 'deux heures' (/dø.zœʁ/)."
  - fr: "Excusez-moi, la voie six, c'est dans quelle direction ?"
    pt: "Com licença, a plataforma 6 fica em qual direção?"
    dica: "'Voie' soa /vwa/ (como 'vois') e 'direction' termina na nasal /sjɔ̃/."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je voudrais un billet pour Lyon, s'il vous plaît."
        pt: "Eu gostaria de um bilhete para Lyon, por favor."
      - fr: "À quelle heure part le prochain train ?"
        pt: "A que horas sai o próximo trem?"
      - fr: "Quatorze heures vingt, voie six, c'est bien ça ?"
        pt: "14h20, plataforma 6, é isso mesmo?"
      - fr: "Est-ce que je dois changer de train ?"
        pt: "Eu preciso trocar de trem?"
      - fr: "Le voyage dure deux heures."
        pt: "A viagem dura duas horas."

  - tipo: semaforo
    itens:
      - errado: "Je voudrais un billet à Lyon."
        certo: "Je voudrais un billet pour Lyon."
        nota_pt: "Para destino de bilhete ou trem, em francês usa-se pour (un billet pour Lyon)."
      - errado: "Est-ce que je dois de changer de train ?"
        certo: "Est-ce que je dois changer de train ?"
        nota_pt: "O verbo devoir liga-se direto ao infinitivo, sem a preposição de."
      - errado: "Je paie trente euro."
        certo: "Le billet coûte trente euros."
        nota_pt: "Use o plural euros (o s é mudo na fala, mas obrigatório na escrita) e o verbo coûter para preço."
      - errado: "J'ai prend mon billet."
        certo: "J'ai pris mon billet."
        nota_pt: "No passé composé, prendre usa o particípio irregular pris."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Je vous écoute."
        resposta: "Je voudrais un billet pour Lyon, s'il vous plaît."
      - pergunta: "Comment demander l'heure du prochain train ?"
        resposta: "À quelle heure part le prochain train ?"
      - pergunta: "Comment demander si vous devez changer de train ?"
        resposta: "Est-ce que je dois changer de train ?"
      - pergunta: "Dites en français : 14h20, plataforma 6, é isso?"
        resposta: "Quatorze heures vingt, voie six, c'est bien ça ?"

fala_livre:
  enunciado: "No guichê da estação, o horário que você queria não está disponível. Escolha uma alternativa (ida e volta para outro destino, ex.: 16h30) e confirme todos os dados essenciais."
  passos:
    - "Peça um « aller-retour » para a cidade escolhida e pergunte o horário do próximo trem."
    - "Repita o horário, a plataforma (« voie ») e o preço com « c'est bien ça ? »."
    - "Pergunte se o trem é direto ou se precisa trocar de trem, e depois pergunte onde fica a plataforma."
  criterio: "Tipo de bilhete adequado e dados essenciais (horário, via, preço) confirmados com clareza."
  duracao_alvo_s: 60
