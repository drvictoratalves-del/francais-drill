pronuncia:
  - fr: "Une table pour une personne, s'il vous plaît."
    pt: "Uma mesa para uma pessoa, por favor."
    dica: "Contraste /y/ em 'une' com /u/ em 'pour'; 'table' termina com /l/ suave sem vogal extra."
  - fr: "Je vais prendre le poulet avec du riz."
    pt: "Vou pedir o frango com arroz."
    dica: "Em 'poulet' o 't' final é mudo (/pu.lɛ/) e em 'riz' o 'z' final também é mudo (/ʁi/)."
  - fr: "De l'eau plate, s'il vous plaît."
    pt: "Água sem gás, por favor."
    dica: "'Eau' é uma vogal só (/o/); pronuncie o 't' final de 'plate' (/plat/)."
  - fr: "C'était de l'eau gazeuse."
    pt: "Era água com gás."
    dica: "Em 'gazeuse', o primeiro 'z' soa /z/ e 'eu' antes de 'se' é fechado (/ga.zøz/)."
  - fr: "Excusez-moi, j'ai demandé de l'eau plate."
    pt: "Com licença, eu pedi água sem gás."
    dica: "Marque o /y/ de 'excusez' e mantenha o grupo 'de l'eau plate' bem conectado."
  - fr: "Pardon, je vous apporte ça tout de suite."
    pt: "Perdão, trago isso agora mesmo."
    dica: "Liaison suave em 'vous apporte' (/vu.za.pɔʁt/); 'tout' perde o 't' antes de 'de'."
  - fr: "La sauce contient du lait ?"
    pt: "O molho tem leite?"
    dica: "'Sauce' soa /sos/, 'contient' termina em nasal /tjɛ̃/ sem 't', e 'lait' termina em /ɛ/."
  - fr: "Je ne peux pas boire de lait."
    pt: "Não posso beber leite."
    dica: "Em 'peux', lábios arredondados (/pø/); após negação, use 'de lait' sem artigo."
  - fr: "À la fin, j'ai demandé l'addition."
    pt: "No fim, pedi a conta."
    dica: "Em 'addition', '-tion' soa /sjɔ̃/ com nasal final."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je vais prendre le poulet avec du riz."
        pt: "Vou pedir o frango com arroz."
      - fr: "De l'eau plate, s'il vous plaît."
        pt: "Água sem gás, por favor."
      - fr: "Excusez-moi, j'ai demandé de l'eau plate."
        pt: "Com licença, eu pedi água sem gás."
      - fr: "La sauce contient du lait ?"
        pt: "O molho tem leite?"
      - fr: "À la fin, j'ai demandé l'addition."
        pt: "No fim, pedi a conta."

  - tipo: semaforo
    itens:
      - errado: "Je veux prendre le poulet."
        certo: "Je vais prendre le poulet avec du riz."
        nota_pt: "No restaurante, o padrão natural para escolher um prato é Je vais prendre… ou Je voudrais…"
      - errado: "Je ne peux pas boire du lait."
        certo: "Je ne peux pas boire de lait."
        nota_pt: "Depois de negação (ne… pas), o partitivo du/de la/des vira simplesmente de."
      - errado: "J'ai rentré à l'hôtel."
        certo: "Je suis rentré à l'hôtel."
        nota_pt: "Rentrer (voltar para casa/hotel, sem objeto direto) faz o passé composé com être."
      - errado: "Excusez-moi, je demande de l'eau plate."
        certo: "Excusez-moi, j'ai demandé de l'eau plate."
        nota_pt: "Para corrigir algo já pedido antes, use o passé composé (j'ai demandé)."

  - tipo: producao
    itens:
      - pergunta: "Vous avez choisi ?"
        resposta: "Oui. Je vais prendre le poulet avec du riz."
      - pergunta: "Et comme boisson ?"
        resposta: "De l'eau plate, s'il vous plaît."
      - pergunta: "Comment corriger poliment si le serveur apporte de l'eau gazeuse ?"
        resposta: "Excusez-moi, j'ai demandé de l'eau plate."
      - pergunta: "Comment demander si la sauce a du lait ?"
        resposta: "La sauce contient du lait ?"

fala_livre:
  enunciado: "No restaurante, peça um prato e água sem gás. O garçom traz água com gás por engano: corrija com cortesia, pergunte sobre um ingrediente do molho e peça a conta."
  passos:
    - "Peça mesa para uma pessoa e escolha o prato com « Je vais prendre… »."
    - "Corrija a bebida com « Excusez-moi, j'ai demandé de l'eau plate »."
    - "Pergunte sobre um ingrediente (« La sauce contient… ? ») e peça a conta no final."
  criterio: "Pedido entendido, ingrediente perguntado e divergência corrigida com cortesia."
  duracao_alvo_s: 60
