id: "aula-06"
titulo: "Aula 06 — Restaurante — pedir e corrigir"
nivel: "A1 → A2"
velocidade: "-10%"
bloco: "2 · Mesa e Cotidiano (06–10)"
tipo: "aula"
ordem: 6
foco: "Pedir refeição, ingredientes, corrigir pedido com cortesia"
notion_url: "https://app.notion.com/p/422059414205814088c5c64054124cf6"

cena:
  - "Au restaurant."
  - "Samedi soir, j'avais très faim. Je suis entré dans un petit restaurant, près de mon hôtel."
  - "Le serveur m'a demandé : « Bonjour. Vous êtes combien ? »"
  - "« Je suis seul. Une table pour une personne, s'il vous plaît. »"
  - "« Bien sûr. Voici la carte. »"
  - "Après quelques minutes, il est revenu : « Vous avez choisi ? »"
  - "« Oui. Je vais prendre le poulet avec du riz. »"
  - "« Très bien. Et comme boisson ? »"
  - "« De l'eau plate, s'il vous plaît. »"
  - "Un moment plus tard, le serveur a apporté une bouteille. J'ai regardé l'étiquette : c'était de l'eau gazeuse."
  - "« Excusez-moi, j'ai demandé de l'eau plate. »"
  - "« Pardon, je vous apporte ça tout de suite. »"
  - "« Merci. Et la sauce contient du lait ? Je ne peux pas boire de lait. »"
  - "« Non, cette sauce n'a pas de lait. »"
  - "« Parfait, merci. »"
  - "Le poulet était très bon. À la fin, j'ai demandé l'addition. J'ai payé par carte et je suis rentré à l'hôtel."

vocabulario:
  - fr: "un serveur"
    pt: "um garçom"
  - fr: "une table pour une personne"
    pt: "uma mesa para uma pessoa"
  - fr: "la carte"
    pt: "o cardápio"
  - fr: "le poulet"
    pt: "o frango"
  - fr: "le riz"
    pt: "o arroz"
  - fr: "comme boisson"
    pt: "de bebida"
  - fr: "l'eau plate"
    pt: "a água sem gás"
  - fr: "l'eau gazeuse"
    pt: "a água com gás"
  - fr: "une bouteille"
    pt: "uma garrafa"
  - fr: "l'étiquette"
    pt: "o rótulo"
  - fr: "la sauce"
    pt: "o molho"
  - fr: "le lait"
    pt: "o leite"
  - fr: "l'addition"
    pt: "a conta"
  - fr: "tout de suite"
