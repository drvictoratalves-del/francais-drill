cena:
  - "Dans un magasin de vêtements."
  - "Dimanche après-midi, je suis entré dans un magasin de vêtements. Je cherchais une chemise."
  - "Une vendeuse m'a dit : « Bonjour. Je peux vous aider ? »"
  - "« Bonjour. Oui, s'il vous plaît. Vous avez cette chemise en taille M ? »"
  - "« Oui. Vous voulez l'essayer ? »"
  - "« Oui, s'il vous plaît. Où sont les cabines ? »"
  - "« Au fond, à gauche. »"
  - "J'ai essayé la chemise. Elle était un peu petite."
  - "« Elle est un peu petite. Vous avez une taille plus grande ? »"
  - "« Oui, voici la taille L. C'est la même couleur. »"
  - "J'ai essayé la deuxième chemise. Cette fois, elle était très bien."
  - "« Elle me va très bien. Combien elle coûte ? »"
  - "« Quarante-cinq euros. »"
  - "« Très bien. Je peux l'échanger si elle ne convient pas ? »"
  - "« Oui, avec le ticket de caisse, pendant quatorze jours. »"
  - "« Parfait. Je la prends. Je paie par carte. »"
  - "« Voici votre sac et votre ticket. Bonne journée ! »"
  - "« Merci, au revoir ! »"

