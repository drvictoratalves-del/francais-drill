pronuncia:
  - fr: "Vous avez cette chemise en taille M ?"
    pt: "Vocês têm esta camisa no tamanho M?"
    dica: "Em 'taille', o 'll' soa /j/ (/taj/); faça liaison em 'Vous avez'."
  - fr: "Où sont les cabines ?"
    pt: "Onde ficam os provadores?"
    dica: "'Où' tem som fechado /u/; 'sont' e 'cabines' não pronunciam 't' nem 's' finais."
  - fr: "Elle est un peu petite."
    pt: "Ela está um pouco pequena."
    dica: "Em 'petite' (feminino), o 't' final é pronunciado (/pə.tit/), ao contrário de 'petit'."
  - fr: "Vous avez une taille plus grande ?"
    pt: "Vocês têm um tamanho maior?"
    dica: "Em 'grande' (feminino), o 'd' final é audível (/gʁɑ̃d/)."
  - fr: "C'est la même couleur."
    pt: "É a mesma cor."
    dica: "'Couleur' combina /u/ inicial com /œʁ/ no fim."
  - fr: "Elle me va très bien. Combien elle coûte ?"
    pt: "Fica muito bem em mim. Quanto ela custa?"
    dica: "Em 'combien', nasal /kɔ̃.bjɛ̃/ sem pronunciar o 'n'."
  - fr: "Quarante-cinq euros."
    pt: "Quarenta e cinco euros."
    dica: "Atenção à liaison em 'cinq euros' (/sɛ̃.kø.ʁo/): o 'q' liga com 'euros'."
  - fr: "Je peux l'échanger si elle ne convient pas ?"
    pt: "Posso trocar se ela não servir?"
    dica: "'Échanger' termina em /e/ fechado; 'convient' termina em /ɛ̃/ sem 't'."
  - fr: "Oui, avec le ticket de caisse, pendant quatorze jours."
    pt: "Sim, com a nota fiscal, durante quatorze dias."
    dica: "'Ticket' soa /ti.kɛ/ (t mudo) e 'quatorze' tem /ɔ/ aberto (/ka.tɔʁz/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Vous avez cette chemise en taille M ?"
        pt: "Vocês têm esta camisa no tamanho M?"
      - fr: "Où sont les cabines ?"
        pt: "Onde ficam os provadores?"
      - fr: "Elle est un peu petite. Vous avez une taille plus grande ?"
        pt: "Ela está um pouco pequena. Têm um tamanho maior?"
      - fr: "Je peux l'échanger si elle ne convient pas ?"
        pt: "Posso trocar se ela não servir?"
      - fr: "Je la prends. Je paie par carte."
        pt: "Eu a levo. Pago com cartão."

  - tipo: semaforo
    itens:
      - errado: "Vous avez cette chemise dans taille M ?"
        certo: "Vous avez cette chemise en taille M ?"
        nota_pt: "Para indicar tamanho ou cor disponível, usa-se a preposição en (en taille M)."
      - errado: "Cette chemise est plus grand."
        certo: "Cette chemise est un peu petite."
        nota_pt: "Chemise é feminino em francês; adjetivos concordam: petite, grande."
      - errado: "J'ai entré dans le magasin."
        certo: "Je suis entré dans un magasin de vêtements."
        nota_pt: "Entrer faz o passé composé com o auxiliar être."
      - errado: "Je prends elle par carte."
        certo: "Je la prends. Je paie par carte."
        nota_pt: "O pronome objeto direto (la para chemise) vem antes do verbo, nunca depois."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Je peux vous aider ?"
        resposta: "Bonjour. Vous avez cette chemise en taille M ?"
      - pergunta: "Vous voulez l'essayer ?"
        resposta: "Oui, s'il vous plaît. Où sont les cabines ?"
      - pergunta: "Comment va la taille M ?"
        resposta: "Elle est un peu petite. Vous avez une taille plus grande ?"
      - pergunta: "Comment demander les conditions d'échange ?"
        resposta: "Je peux l'échanger si elle ne convient pas ?"

fala_livre:
  enunciado: "Numa loja de roupas, peça um tamanho que acabou ou não serviu, compare duas opções e confirme preço e prazo de troca antes de pagar."
  passos:
    - "Peça uma peça no tamanho desejado (« Vous avez… en taille… ? ») e pergunte onde ficam os provadores."
    - "Compare duas opções usando « plus grand(e) », « plus petit(e) » ou « plus cher / moins cher »."
    - "Confirme o preço e pergunte se pode trocar com o comprovante."
  criterio: "Tamanho pedido, comparação compreensível e condições de troca confirmadas."
  duracao_alvo_s: 60
