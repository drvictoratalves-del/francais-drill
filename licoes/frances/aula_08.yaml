id: "aula-08"
titulo: "Aula 08 — Cotidiano — rotina e interesses"
nivel: "A1 → A2"
velocidade: "-10%"
bloco: "2 · Mesa e Cotidiano (06–10)"
tipo: "aula"
ordem: 8
foco: "Rotina, frequência, pronominais (se lever) e continuidade"
notion_url: "https://app.notion.com/p/42205941420581d5a6d6c4086117d947"

cena:
  - "Une conversation sur le quotidien."
  - "Lundi, j'ai retrouvé Camille dans un café, près de la gare. Nous avons parlé de nos journées."
  - "Elle m'a demandé : « Vous commencez à travailler à quelle heure ? »"
  - "« Ça dépend des jours. En général, tôt le matin. Et vous ? »"
  - "« En général, à neuf heures. Qu'est-ce que vous faites pendant votre temps libre ? »"
  - "« J'aime me promener et écouter de la musique. Le week-end, je lis un peu aussi. »"
  - "« Vous sortez souvent le week-end ? »"
  - "« Parfois. À Cuiabá, je marche beaucoup, et je prépare le dîner à la maison. Et vous, qu'est-ce que vous aimez faire ? »"
  - "« J'aime cuisiner. Le dimanche, je prépare un plat pour ma famille. »"
  - "« Vous cuisinez quoi, par exemple ? »"
  - "« Souvent un poulet, ou une tarte. Et le matin, vous faites quoi, d'habitude ? »"
  - "« Je me lève, je prends un café, et je lis les nouvelles. Hier matin, je me suis levé tôt, et j'ai pris le petit-déjeuner à l'hôtel. »"
  - "« C'est une bonne habitude. Moi, le matin, je bois du thé. »"
  - "« On a des journées un peu différentes, mais c'est intéressant ! »"

vocabulario:
  - fr: "le quotidien"
