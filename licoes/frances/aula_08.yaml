pronuncia:
  - fr: "Vous commencez à travailler à quelle heure ?"
    pt: "Você começa a trabalhar a que horas?"
    dica: "Em 'travailler', o 'll' soa /j/ (/tʁa.va.je/) e o 'r' final é mudo."
  - fr: "Ça dépend des jours. En général, tôt le matin."
    pt: "Depende do dia. Em geral, cedo de manhã."
    dica: "'Dépend' termina em nasal /ɑ̃/ sem 'd'; 'tôt' tem /o/ fechado e 't' mudo."
  - fr: "Qu'est-ce que vous faites pendant votre temps libre ?"
    pt: "O que você faz no tempo livre?"
    dica: "'Faites' soa /fɛt/ (uma sílaba); 'temps' soa /tɑ̃/ sem 'ps'."
  - fr: "J'aime me promener et écouter de la musique."
    pt: "Gosto de passear e de escutar música."
    dica: "Contraste /y/ em 'musique' (/my.zik/) com /u/ em 'écouter' (/e.ku.te/)."
  - fr: "Vous sortez souvent le week-end ?"
    pt: "Você sai muitas vezes no fim de semana?"
    dica: "'Souvent' termina em nasal /ɑ̃/ sem pronunciar o 't'."
  - fr: "Je me lève, je prends un café, et je lis les nouvelles."
    pt: "Eu me levanto, tomo um café e leio as notícias."
    dica: "'Prends' e 'lis' terminam em vogal pura (/pʁɑ̃/, /li/), sem 'ds' nem 's'."
  - fr: "Hier matin, je me suis levé tôt."
    pt: "Ontem de manhã, acordei cedo."
    dica: "Pronuncie o 'r' de 'hier' (/jɛʁ/) e o /y/ de 'suis' (/sɥi/)."
  - fr: "Moi, le matin, je bois du thé."
    pt: "Eu, de manhã, bebo chá."
    dica: "'Bois' soa /bwa/ (sem 's') e 'du' usa /y/ projetado."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Ça dépend des jours."
        pt: "Depende do dia."
      - fr: "Qu'est-ce que vous faites pendant votre temps libre ?"
        pt: "O que você faz no tempo livre?"
      - fr: "J'aime me promener et écouter de la musique."
        pt: "Gosto de passear e de escutar música."
      - fr: "Vous sortez souvent le week-end ?"
        pt: "Você sai muitas vezes no fim de semana?"
      - fr: "Vous cuisinez quoi, par exemple ?"
        pt: "Você cozinha o quê, por exemplo?"

  - tipo: semaforo
    itens:
      - errado: "J'aime promener dans la ville."
        certo: "J'aime me promener et écouter de la musique."
        nota_pt: "Se promener é pronominal e o pronome concorda com o sujeito: j'aime me promener."
      - errado: "Hier matin, j'ai me levé tôt."
        certo: "Hier matin, je me suis levé tôt."
        nota_pt: "Todo verbo pronominal (como se lever) usa être no passé composé."
      - errado: "Ça dépend de les jours."
        certo: "Ça dépend des jours."
        nota_pt: "Em francês, de + les contrai obrigatoriamente para des."
      - errado: "J'aime de cuisiner le dimanche."
        certo: "J'aime cuisiner."
        nota_pt: "Aimer liga-se direto ao infinitivo, sem preposição de."

  - tipo: producao
    itens:
      - pergunta: "Vous commencez à travailler à quelle heure ?"
        resposta: "Ça dépend des jours. En général, tôt le matin."
      - pergunta: "Qu'est-ce que vous faites pendant votre temps libre ?"
        resposta: "J'aime me promener et écouter de la musique."
      - pergunta: "Vous sortez souvent le week-end ?"
        resposta: "Parfois. À Cuiabá, je marche beaucoup."
      - pergunta: "Comment dire ce que vous avez fait hier matin ?"
        resposta: "Hier matin, je me suis levé tôt."

fala_livre:
  enunciado: "Converse sobre sua rotina e seus interesses e faça perguntas de continuidade ligadas ao que o interlocutor respondeu, incluindo uma frase sobre ontem de manhã."
  passos:
    - "Descreva sua rotina matinal usando « d'habitude » ou « en général » e um verbo pronominal."
    - "Diga o que gosta de fazer no tempo livre com expressões de frequência (« souvent », « parfois »)."
    - "Faça duas perguntas de retorno ligadas ao assunto (« Vous cuisinez quoi, par exemple ? ») e conte um detalhe de ontem no passé composé."
  criterio: "Rotina compreensível, frequência expressa e pelo menos duas perguntas de continuidade."
  duracao_alvo_s: 60
