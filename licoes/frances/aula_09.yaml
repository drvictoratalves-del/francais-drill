id: "aula-09"
titulo: "Aula 09 — Contar um passeio — passado"
nivel: "A1 → A2"
velocidade: "-10%"
bloco: "2 · Mesa e Cotidiano (06–10)"
tipo: "aula"
ordem: 9
foco: "Narrar passeio: passé composé (avoir/être), imparfait e pronome y"
notion_url: "https://app.notion.com/p/4220594142058125a6a9da7b884db5c4"

cena:
  - "Ce que j'ai fait hier."
  - "Dimanche soir, Camille m'a demandé : « Qu'est-ce que vous avez fait hier ? »"
  - "« J'ai passé une très belle journée. Le matin, je suis allé à la vieille ville. J'ai visité un musée, près de l'église. Le musée n'était pas trop grand, mais il était très intéressant. J'ai regardé les tableaux pendant une heure, et j'ai pris quelques photos. »"
  - "« Vous avez aimé le musée ? »"
  - "« Oui, beaucoup. Ensuite, j'ai déjeuné dans un petit restaurant. J'ai mangé une salade et un morceau de pain. Ce n'était pas cher. »"
  - "« Et l'après-midi ? »"
  - "« L'après-midi, je suis allé au parc. J'y suis allé à pied. Il faisait beau, alors je me suis assis sur un banc, et j'ai lu un peu. Il y avait des enfants et des oiseaux. C'était calme. »"
  - "« C'est joli, ce parc. »"
  - "« Oui. Vers dix-sept heures, je suis rentré à l'hôtel. J'étais un peu fatigué, mais content. Le soir, j'ai écrit un message à ma famille. »"
  - "« Vous avez pris des photos du parc aussi ? »"
  - "« Oui, quelques-unes. Demain, je peux vous les montrer, si vous voulez. »"

vocabulario:
  - fr: "hier"
    pt: "ontem"
  - fr: "puis / ensuite"
    pt: "depois / em seguida"
  - fr: "un musée"
    pt: "um museu"
  - fr: "un tableau"
    pt: "um quadro"
  - fr: "une photo"
    pt: "uma foto"
  - fr: "quelques / quelques-unes"
    pt: "alguns / algumas"
  - fr: "un morceau de pain"
    pt: "um pedaço de pão"
  - fr: "cher / chère"
    pt: "caro / cara"
  - fr: "le parc"
    pt: "o parque"
  - fr: "un banc"
    pt: "um banco (de praça)"
  - fr: "un oiseau"
    pt: "um pássaro"
  - fr: "vers dix-sept heures"
    pt: "por volta das 17h"
  - fr: "fatigué(e)"
    pt: "cansado(a)"
  - fr: "content(e)"
    pt: "contente"

pronuncia:
  - fr: "Qu'est-ce que vous avez fait hier ?"
    pt: "O que você fez ontem?"
    dica: "Liaison em 'vous avez' (/vu.za.ve/); 'fait' termina em /ɛ/ sem 't' e 'hier' pronuncia o 'r' final (/jɛʁ/)."
  - fr: "J'ai passé une très belle journée."
    pt: "Passei um dia muito bonito."
    dica: "Contraste /y/ em 'une'; em 'très belle', o 's' final de 'très' é mudo."
  - fr: "Le matin, je suis allé à la vieille ville."
    pt: "De manhã, fui à cidade velha."
    dica: "Liaison suave em 'suis allé' (/sɥi.za.le/); 'vieille' termina com /j/."
  - fr: "J'ai regardé les tableaux pendant une heure."
    pt: "Olhei os quadros durante uma hora."
    dica: "'Tableaux' termina em /o/ (x mudo); 'pendant une heure' liga 't' mudo não, mas 'n' de 'une' com 'heure'."
  - fr: "Ensuite, j'ai déjeuné dans un petit restaurant."
    pt: "Depois, almocei num restaurante pequeno."
    dica: "'Déjeuné' tem /ø/ em '-jeu-'; 'restaurant' termina em nasal /ɑ̃/ sem 't'."
  - fr: "L'après-midi, je suis allé au parc. J'y suis allé à pied."
    pt: "À tarde, fui ao parque. Fui lá a pé."
    dica: "'J'y' soa /ʒi/ e liga suavemente com 'suis allé'."
  - fr: "Il faisait beau, alors je me suis assis sur un banc."
    pt: "O tempo estava bom, então me sentei num banco."
    dica: "Em 'faisait', 'ai' soa /ə/ (/fə.zɛ/); 'banc' termina em nasal /bɑ̃/ sem 'c'."
  - fr: "Le soir, j'ai écrit un message à ma famille."
    pt: "À noite, escrevi uma mensagem para minha família."
    dica: "'Écrit' termina em /i/ (t mudo) e 'famille' tem 'll' pronunciado /j/ (/fa.mij/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Qu'est-ce que vous avez fait hier ?"
        pt: "O que você fez ontem?"
      - fr: "J'ai visité un musée, près de l'église."
        pt: "Visitei um museu, perto da igreja."
      - fr: "Ensuite, j'ai déjeuné dans un petit restaurant."
        pt: "Depois, almocei num restaurante pequeno."
      - fr: "L'après-midi, je suis allé au parc. J'y suis allé à pied."
        pt: "À tarde, fui ao parque. Fui a pé."
      - fr: "Vers dix-sept heures, je suis rentré à l'hôtel."
        pt: "Por volta das 17h, voltei ao hotel."

  - tipo: semaforo
    itens:
      - errado: "J'ai allé au parc à pied."
        certo: "Je suis allé au parc."
        nota_pt: "Aller usa sempre o auxiliar être no passé composé: je suis allé(e)."
      - errado: "Il a fait beau, alors je me suis assis."
        certo: "Il faisait beau, alors je me suis assis."
        nota_pt: "Para descrever o clima e o cenário de fundo no passado, usa-se o imparfait: il faisait beau."
      - errado: "Je suis passé une très belle journée."
        certo: "J'ai passé une très belle journée."
        nota_pt: "Passer com objeto direto (une journée, du temps) usa avoir; com lugar (passer par), usa être."
      - errado: "J'ai prend quelques photos."
        certo: "J'ai pris quelques photos."
        nota_pt: "O particípio passado de prendre é irregular: pris."

  - tipo: producao
    itens:
      - pergunta: "Qu'est-ce que vous avez fait hier ?"
        resposta: "J'ai visité un musée, près de l'église."
      - pergunta: "Vous avez aimé le musée ?"
        resposta: "Oui, beaucoup. Ensuite, j'ai déjeuné dans un petit restaurant."
      - pergunta: "Comment êtes-vous allé au parc ?"
        resposta: "J'y suis allé à pied."
      - pergunta: "À quelle heure êtes-vous rentré à l'hôtel ?"
        resposta: "Vers dix-sept heures, je suis rentré à l'hôtel."

fala_livre:
  enunciado: "Conte um passeio recente (ou inventado) em sequência cronológica, misturando ações no passé composé e descrições de cenário no imparfait."
  passos:
    - "Comece situando a manhã com pelo menos duas ações no passé composé (ex.: « je suis allé », « j'ai visité »)."
    - "Descreva o clima ou o lugar no imparfait (« Il faisait beau », « C'était calme »)."
    - "Feche dizendo como voltou para casa ou hotel e responda se gostou."
  criterio: "Sequência compreensível, referência clara ao passado e uso natural de passé composé + imparfait."
  duracao_alvo_s: 60
