id: "aula-10"
titulo: "Aula 10 — Combinar um programa — convidar e negociar"
nivel: "A1 → A2"
velocidade: "-10%"
bloco: "2 · Mesa e Cotidiano (06–10)"
tipo: "aula"
ordem: 10
foco: "Convidar, recusar com educação, plano B e futuro próximo"
notion_url: "https://app.notion.com/p/422059414205815eb4e1d40a2107417c"

cena:
  - "Un programme pour demain."
  - "Mercredi après-midi, j'ai revu Camille près de la station de métro. Elle m'a proposé une sortie :"
  - "« Ça vous dit de visiter le marché demain ? »"
  - "« Oui, avec plaisir. À quelle heure ? »"
  - "« À neuf heures ? Le marché ouvre tôt, et il y a beaucoup de choix le matin. »"
  - "« Je ne peux pas à neuf heures. Demain matin, je prends le petit-déjeuner à l'hôtel jusqu'à neuf heures et demie. On peut se retrouver à dix heures ? »"
  - "« D'accord. Dix heures, c'est bien. Devant la station de métro ? »"
  - "« Très bien. Et s'il pleut ? »"
  - "« S'il pleut, on peut aller au café d'en face. Après, si vous voulez, on peut déjeuner ensemble. »"
  - "« Oui, bonne idée. Hier, j'ai visité le musée, mais je n'ai pas encore vu le marché. »"
  - "« Vous allez aimer. Il y a des fruits, du fromage et un très bon pain. »"
  - "« Parfait. Alors, demain, à dix heures, devant la station de métro. Si je suis en retard, je vous envoie un message. »"
  - "« D'accord. À demain, Victor ! »"
  - "« À demain, Camille ! »"

vocabulario:
  - fr: "un programme"
    pt: "um programa / plano"
  - fr: "une sortie"
    pt: "uma saída / um passeio"
  - fr: "le marché"
    pt: "o mercado"
  - fr: "le choix"
    pt: "a escolha / variedade"
  - fr: "neuf heures et demie"
    pt: "nove e meia"
  - fr: "la station de métro"
    pt: "a estação de metrô"
  - fr: "devant"
    pt: "em frente a / diante de"
  - fr: "le café d'en face"
    pt: "o café do outro lado da rua"
  - fr: "ensemble"
    pt: "juntos"
  - fr: "en retard"
    pt: "atrasado"
  - fr: "ça vous dit de… ?"
    pt: "você topa…?"
  - fr: "s'il pleut"
    pt: "se chover"
  - fr: "bonne idée"
    pt: "boa ideia"

pronuncia:
  - fr: "Ça vous dit de visiter le marché demain ?"
    pt: "Você topa visitar o mercado amanhã?"
    dica: "O 't' de 'dit' é mudo (/di/) e 'demain' termina na nasal /mɛ̃/."
  - fr: "À neuf heures ? Le marché ouvre tôt."
    pt: "Às nove horas? O mercado abre cedo."
    dica: "Em 'neuf heures', o 'f' sonoriza para /v/ na liaison (/nœ.vœʁ/)."
  - fr: "Je ne peux pas à neuf heures."
    pt: "Não posso às nove horas."
    dica: "Arredonde o /ø/ de 'peux' e faça a liaison /v/ em 'neuf heures'."
  - fr: "On peut se retrouver à dix heures ?"
    pt: "Podemos nos encontrar às dez horas?"
    dica: "Liaison com /z/ em 'dix heures' (/di.zœʁ/)."
  - fr: "Et s'il pleut ?"
    pt: "E se chover?"
    dica: "Arredonde bem 'pleut' (/plø/) sem soar o 't' final."
  - fr: "S'il pleut, on peut aller au café d'en face."
    pt: "Se chover, podemos ir ao café do outro lado."
    dica: "Liaison opcional suave em 'peut aller' (/pø.ta.le/)."
  - fr: "Hier, j'ai visité le musée, mais je n'ai pas encore vu le marché."
    pt: "Ontem visitei o museu, mas ainda não vi o mercado."
    dica: "Contraste /y/ em 'musée' e 'vu' (/vy/)."
  - fr: "Vous allez aimer."
    pt: "Você vai gostar."
    dica: "Liaison obrigatória em 'Vous allez' (/vu.za.le/) e suave em 'allez aimer'."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Ça vous dit de visiter le marché demain ?"
        pt: "Você topa visitar o mercado amanhã?"
      - fr: "Je ne peux pas à neuf heures. On peut se retrouver à dix heures ?"
        pt: "Não posso às nove. Podemos nos encontrar às dez?"
      - fr: "Et s'il pleut ?"
        pt: "E se chover?"
      - fr: "S'il pleut, on peut aller au café d'en face."
        pt: "Se chover, podemos ir ao café do outro lado."
      - fr: "Si je suis en retard, je vous envoie un message."
        pt: "Se eu me atrasar, mando uma mensagem."

  - tipo: semaforo
    itens:
      - errado: "Ça vous dit visiter le marché ?"
        certo: "Ça vous dit de visiter le marché demain ?"
        nota_pt: "A expressão ça vous dit pede a preposição de antes de verbo no infinitivo."
      - errado: "Je ne peux pas en neuf heures."
        certo: "Je ne peux pas à neuf heures."
        nota_pt: "Em francês, horários exatos usam sempre a preposição à (à neuf heures)."
      - errado: "Je n'ai pas encore voir le marché."
        certo: "Je n'ai pas encore vu le marché."
        nota_pt: "No passé composé, o particípio de voir é vu, nunca o infinitivo."
      - errado: "On peut retrouver à dix heures ?"
        certo: "On peut se retrouver à dix heures ?"
        nota_pt: "Encontrar-se em algum lugar usa o verbo pronominal se retrouver."

  - tipo: producao
    itens:
      - pergunta: "Comment proposer de visiter le marché demain ?"
        resposta: "Ça vous dit de visiter le marché demain ?"
      - pergunta: "Vous ne pouvez pas à neuf heures. Que proposez-vous ?"
        resposta: "Je ne peux pas à neuf heures. On peut se retrouver à dix heures ?"
      - pergunta: "Et s'il pleut demain ?"
        resposta: "S'il pleut, on peut aller au café d'en face."
      - pergunta: "Que faites-vous si vous êtes en retard ?"
        resposta: "Si je suis en retard, je vous envoie un message."

fala_livre:
  enunciado: "Combine um programa com alguém que não pode no primeiro horário sugerido. Negocie novo horário, ponto de encontro e plano B se chover."
  passos:
    - "Faça ou responda ao convite usando « Ça vous dit de… ? » ou « Je ne peux pas à… »."
    - "Proponha novo horário e confirme o ponto de encontro em grupos distintos."
    - "Inclua um plano B (« Et s'il pleut ? ») e confirme os dados combinados."
  criterio: "Convite entendido, alternativa negociada e encontro confirmado."
  duracao_alvo_s: 60
