pronuncia:
  - fr: "J'ai perdu mon sac dans le bus. Pourriez-vous m'aider, s'il vous plaît ?"
    pt: "Perdi minha bolsa no ônibus. Poderia me ajudar, por favor?"
    dica: "Marque o /y/ de 'perdu' (/pɛʁ.dy/); em 'bus', pronuncie o 's' final (/bys/)."
  - fr: "Je l'avais laissé sous le siège."
    pt: "Eu a tinha deixado embaixo do assento."
    dica: "Contraste /u/ em 'sous' com /ɛ/ em 'laissé'; o 's' final de 'avais' é mudo."
  - fr: "J'y suis retourné, mais le bus était déjà parti."
    pt: "Voltei lá, mas o ônibus já tinha partido."
    dica: "Em 'retourné', temos /ə/ seguido de /u/; 'mais' tem 's' mudo."
  - fr: "Il est noir, avec une petite poche rouge."
    pt: "Ele é preto, com um pequeno bolso vermelho."
    dica: "Em 'petite', pronuncie o 't' final (/pə.tit/)."
  - fr: "Vous avez pris quel bus ? À quelle heure, à peu près ?"
    pt: "Qual ônibus o senhor pegou? A que horas, mais ou menos?"
    dica: "Liaison suave em 'Vous avez'; 'à peu près' combina /ø/ fechado em 'peu' e 's' mudo em 'près'."
  - fr: "Vous pouvez remplir ce formulaire ?"
    pt: "Pode preencher este formulário?"
    dica: "Pronuncie o 'r' final em 'remplir' (/ʁɑ̃.pliʁ/) e marque o /y/ de 'formulaire'."
  - fr: "Si quelqu'un le trouve, nous vous enverrons un message."
    pt: "Se alguém o encontrar, mandaremos uma mensagem."
    dica: "'Quelqu'un' termina na nasal /kɛl.kœ̃/; em 'enverrons', o 's' final é mudo."
  - fr: "Vous pourriez aussi m'appeler là-bas, s'il vous plaît ?"
    pt: "Poderia também me ligar lá, por favor?"
    dica: "Em 'pourriez', o final '-iez' soa /je/; 'appeler' soa /a.pə.le/ ou /ap.le/."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "J'ai perdu mon sac dans le bus. Pourriez-vous m'aider, s'il vous plaît ?"
        pt: "Perdi minha bolsa no ônibus. Poderia me ajudar, por favor?"
      - fr: "Il est noir, avec une petite poche rouge."
        pt: "Ele é preto, com um pequeno bolso vermelho."
      - fr: "Vous avez pris quel bus ? À quelle heure, à peu près ?"
        pt: "Qual ônibus o senhor pegou? A que horas, mais ou menos?"
      - fr: "Vous pouvez remplir ce formulaire ?"
        pt: "Pode preencher este formulário?"
      - fr: "Je vais vous laisser le numéro de l'hôtel."
        pt: "Vou deixar o número do hotel."

  - tipo: semaforo
    itens:
      - errado: "J'ai descendu du bus assez vite."
        certo: "Je suis descendu près de la mairie."
        nota_pt: "Descendre sem objeto direto usa o auxiliar être no passé composé."
      - errado: "Le bus a déjà parti."
        certo: "Le bus était déjà parti."
        nota_pt: "Partir vai sempre com être; aqui, como já tinha partido antes da ação, usa-se o plus-que-parfait (était parti)."
      - errado: "Mon sac est dans la couleur noir."
        certo: "Il est noir, avec une petite poche rouge."
        nota_pt: "Para indicar cor, basta être + adjetivo de cor (il est noir) ou de quelle couleur."
      - errado: "Je suis retourné au bureau pour chercher il."
        certo: "J'y suis retourné, mais le bus était déjà parti."
        nota_pt: "Para evitar repetir o lugar já citado antes, use o pronome y antes do verbo."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Je peux vous aider ?"
        resposta: "Bonjour. J'ai perdu mon sac dans le bus. Pourriez-vous m'aider, s'il vous plaît ?"
      - pergunta: "Il est de quelle couleur ?"
        resposta: "Il est noir, avec une petite poche rouge."
      - pergunta: "Vous avez pris quel bus ? À quelle heure ?"
        resposta: "Le bus douze, vers dix heures. Je suis descendu près de la mairie."
      - pergunta: "Vous allez nous laisser un numéro ?"
        resposta: "Oui. Je vais vous laisser le numéro de l'hôtel."

fala_livre:
  enunciado: "No setor de achados e perdidos, explique que perdeu um objeto (use dados fictícios), descreva-o e deixe um contato para retorno."
  passos:
    - "Explique onde e quando perdeu o objeto e peça ajuda com « Pourriez-vous m'aider ? »."
    - "Descreva cor, tamanho e conteúdo em grupos claros."
    - "Aceite preencher o formulário e deixe um contato fictício para avisarem."
  criterio: "Problema identificado, pelo menos duas informações úteis e próximo passo confirmado."
  duracao_alvo_s: 60
