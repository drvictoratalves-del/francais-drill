id: "aula-11"
titulo: "Aula 11 — Imprevistos — explicar e pedir ajuda"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "3 · Imprevistos e Autonomia (11–16)"
tipo: "aula"
ordem: 11
foco: "Objeto perdido, descrição, plus-que-parfait e pourriez-vous"
notion_url: "https://app.notion.com/p/422059414205818680cede1787e74bb6"

cena:
  - "Un sac perdu dans le bus."
  - "Hier matin, j'ai pris le bus numéro douze pour aller au centre-ville. Le bus était plein, et je me suis assis près de la porte. À mon arrêt, je suis descendu assez vite, parce que je ne voulais pas rater le feu."
  - "Deux minutes plus tard, j'ai compris mon erreur : mon sac n'était plus sur mon épaule. Je l'avais laissé sous le siège."
  - "J'y suis retourné, mais le bus était déjà parti. Alors, je suis allé au bureau des objets trouvés, à côté de l'accueil de la gare."
  - "Une agente m'a demandé : « Bonjour. Je peux vous aider ? »"
  - "« Bonjour. J'ai perdu mon sac dans le bus. Pourriez-vous m'aider, s'il vous plaît ? »"
  - "« Bien sûr. Il est de quelle couleur ? »"
  - "« Il est noir, avec une petite poche rouge. Il y a mon passeport et mon téléphone dedans. »"
  - "« Vous avez pris quel bus ? À quelle heure, à peu près ? »"
  - "« Le bus douze, vers dix heures. Je suis descendu près de la mairie. »"
  - "« D'accord. Vous pouvez remplir ce formulaire ? »"
  - "« Oui, je vais le remplir tout de suite. Malheureusement, je n'ai pas de photo : mon téléphone est dans le sac. Mais je peux le décrire. Il n'est pas très grand, et il a une bandoulière. »"
  - "« Très bien. Si quelqu'un le trouve, nous vous enverrons un message. Vous allez nous laisser un numéro ? »"
  - "« Oui. Je vais vous laisser le numéro de l'hôtel. Vous pourriez aussi m'appeler là-bas, s'il vous plaît ? »"
  - "« Bien sûr. Le bureau est ouvert jusqu'à dix-huit heures. »"
  - "« Merci beaucoup. Je vais aussi demander à l'arrêt, au cas où. »"
  - "« C'est une bonne idée. Bon courage ! »"

