id: "aula-12"
titulo: "Aula 12 — Viagem integrada — um dia completo"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "3 · Imprevistos e Autonomia (11–16)"
tipo: "aula"
ordem: 12
foco: "Dia completo integrado: hotel, trajeto, café, trem e comparativos"
notion_url: "https://app.notion.com/p/42205941420581c294bede91eb33d657"

cena:
  - "Une journée complète en ville."
  - "Ce matin, avant de sortir, je suis passé à la réception. Je voulais confirmer trois choses, pour ne pas perdre de temps."
  - "« Bonjour, au nom d'Alves. Le petit-déjeuner est bien compris jusqu'à dix heures, c'est ça ? »"
  - "« Oui, jusqu'à dix heures. Vous souhaitez autre chose ? »"
  - "« Oui. Pourriez-vous m'indiquer le chemin de la gare, à pied ? »"
  - "« Allez tout droit, puis tournez à droite au feu. Ce n'est pas plus long que dix minutes. »"
  - "« À droite au feu, c'est bien ça ? Et vous connaissez un café près de la gare, un peu plus calme que les autres ? »"
  - "« Oui, le Café des Arts, en face de la pharmacie. Il est plus petit, mais le café y est très bon. »"
  - "« Parfait, merci. J'y vais tout de suite. »"
  - "Après le petit-déjeuner, je suis allé à ce café. J'y ai pris un thé, et j'ai relu mon plan de la journée. Ensuite, je suis entré à la gare pour prendre un billet."
  - "J'ai demandé un aller simple, et j'ai confirmé la voie. Le train partait à quatorze heures vingt ; je n'avais donc pas besoin de courir."
  - "L'après-midi, après mon retour, j'ai retrouvé Camille devant la station de métro, comme nous l'avions décidé. Nous avons marché jusqu'à un petit restaurant. J'y ai commandé un plat plus léger que la veille, et nous avons parlé de la journée."
  - "« Qu'est-ce que vous avez fait ce matin ? »"
  - "« J'ai confirmé le petit-déjeuner, j'ai demandé le chemin, et j'ai pris mon billet. Pour demain, on pourrait visiter le marché, si vous êtes libre. »"
  - "« Avec plaisir. On va s'y retrouver à dix heures ? »"
  - "« Oui. Si je suis en retard, je vous envoie un message. »"

vocabulario:
  - fr: "une journée complète"
    pt: "um dia completo"
  - fr: "la réception"
    pt: "a recepção"
  - fr: "compris(e)"
    pt: "incluído(a)"
  - fr: "un aller simple"
    pt: "uma passagem só de ida"
  - fr: "la voie"
    pt: "a plataforma / a via"
  - fr: "la veille"
    pt: "a véspera"
  - fr: "plus long que"
    pt: "mais longo que"
  - fr: "plus calme que"
    pt: "mais calmo que"
  - fr: "plus léger que"
    pt: "mais leve que"
  - fr: "en face de"
    pt: "em frente a"
  - fr: "y"
    pt: "lá / a isso (pronome)"
  - fr: "en retard"
    pt: "atrasado"

pronuncia:
  - fr: "Le petit-déjeuner est bien compris jusqu'à dix heures, c'est ça ?"
    pt: "O café da manhã está mesmo incluído até as dez, é isso?"
    dica: "Liaison obrigatória em 'dix heures' (/di.zœʁ/); marque o /y/ de 'jusqu'à'."
  - fr: "Pourriez-vous m'indiquer le chemin de la gare, à pied ?"
    pt: "Poderia me indicar o caminho da estação, a pé?"
    dica: "'Chemin' termina em nasal /ʃə.mɛ̃/; 'pied' termina em /e/ sem 'd'."
  - fr: "Ce n'est pas plus long que dix minutes."
    pt: "Não leva mais que dez minutos."
    dica: "Em 'plus long', 'plus' antes de consoante soa /ply/ sem 's'; 'long' termina na nasal /lɔ̃/ sem 'g'."
  - fr: "Un peu plus calme que les autres."
    pt: "Um pouco mais calmo que os outros."
    dica: "Liaison obrigatória em 'les autres' (/le.zotʁ/)."
  - fr: "J'y ai pris un thé, et j'ai relu mon plan."
    pt: "Tomei um chá lá e reli o meu mapa."
    dica: "Marque o /y/ de 'relu' (/ʁə.ly/) e o 's' mudo de 'pris'."
  - fr: "Le train partait à quatorze heures vingt."
    pt: "O trem partia às 14h20."
    dica: "'Quatorze' tem /ɔ/ aberto e 'vingt' termina na nasal /vɛ̃/ com 'gt' mudos."
  - fr: "J'y ai commandé un plat plus léger que la veille."
    pt: "Pedi lá um prato mais leve que na véspera."
    dica: "'Plat' tem 't' mudo (/pla/) e 'veille' termina em /j/ (/vɛj/)."
  - fr: "On va s'y retrouver à dix heures ?"
    pt: "Vamos nos encontrar lá às dez?"
    dica: "'S'y' liga direto ao infinitivo 'retrouver' (/si.ʁə.tʁu.ve/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Le petit-déjeuner est bien compris jusqu'à dix heures, c'est ça ?"
        pt: "O café da manhã está mesmo incluído até as dez, é isso?"
      - fr: "Pourriez-vous m'indiquer le chemin de la gare, à pied ?"
        pt: "Poderia me indicar o caminho da estação, a pé?"
      - fr: "À droite au feu, c'est bien ça ?"
        pt: "À direita no semáforo, é isso?"
      - fr: "J'y ai pris un thé, et j'ai relu mon plan."
        pt: "Lá tomei um chá e reli o meu plano."
      - fr: "On va s'y retrouver à dix heures ?"
        pt: "Vamos nos encontrar lá às dez?"

  - tipo: semaforo
    itens:
      - errado: "J'ai passé à la réception avant de sortir."
        certo: "Je suis passé à la réception."
        nota_pt: "Passer por ou em um lugar (passer à / par) vai com être no passé composé."
      - errado: "J'ai besoin de courir pas."
        certo: "Je n'avais pas besoin de courir."
        nota_pt: "A negação envolve o verbo conjugado: ne… pas antes do complemento (n'avais pas besoin)."
      - errado: "Un café plus petit de les autres."
        certo: "Un café près de la gare, un peu plus calme que les autres."
        nota_pt: "Em comparações (mais… que), o termo comparativo usa que, nunca de."
      - errado: "On va retrouver là à dix heures ?"
        certo: "On va s'y retrouver à dix heures ?"
        nota_pt: "Se retrouver com y evita repetir o lugar e mantém a forma pronominal correta."

  - tipo: producao
    itens:
      - pergunta: "Comment confirmer si le petit-déjeuner est inclus jusqu'à dix heures ?"
        resposta: "Le petit-déjeuner est bien compris jusqu'à dix heures, c'est ça ?"
      - pergunta: "Comment demander le chemin de la gare poliment ?"
        resposta: "Pourriez-vous m'indiquer le chemin de la gare, à pied ?"
      - pergunta: "Qu'est-ce que vous avez fait au Café des Arts ?"
        resposta: "J'y ai pris un thé, et j'ai relu mon plan."
      - pergunta: "À quelle heure allez-vous retrouver Camille demain ?"
        resposta: "On va s'y retrouver à dix heures ?"

fala_livre:
  enunciado: "Encene um dia completo integrado em 3 etapas: confirmar dados no hotel, pedir/confirmar trajeto até um café ou estação e combinar um encontro para amanhã usando comparativo."
  passos:
    - "Confirme uma informação prática no hotel e peça um caminho com « Pourriez-vous… ? »."
    - "Descreva o que fez no café ou na estação usando o pronome « y » e uma comparação (« plus calme que… »)."
    - "Combine um programa para amanhã usando « on pourrait… » ou futuro próximo."
  criterio: "Necessidades comunicadas, informações essenciais confirmadas e ajuda solicitada quando necessária."
  duracao_alvo_s: 70
