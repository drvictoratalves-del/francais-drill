id: "aula-13"
titulo: "Aula 13 — No aeroporto — mudança de portão"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "3 · Imprevistos e Autonomia (11–16)"
tipo: "aula"
ordem: 13
foco: "Aeroporto: mudança de portão, 15h14 vs 15h40, embarque vs decolagem"
notion_url: "https://app.notion.com/p/42205941420581d78e9aeebb8c4ca404"

cena:
  - "Une porte d'embarquement qui change."
  - "Aujourd'hui, j'ai pris l'avion pour un court voyage. L'aéroport était plus grand que la gare, et il y avait beaucoup plus de monde."
  - "J'ai regardé mon billet : mon vol partait de la porte B12, et l'embarquement commençait à quinze heures quarante. Je suis donc allé vers les portes B, avec un peu d'avance."
  - "Devant l'écran, j'ai vu une information nouvelle : la porte avait changé. Je ne l'ai pas tout de suite comprise, alors je suis allé à un comptoir."
  - "Un agent m'a dit : « Bonjour. Je peux vous aider ? »"
  - "« Bonjour. Je cherche la porte B12 pour mon vol. Pourriez-vous confirmer, s'il vous plaît ? »"
  - "« La porte a changé. C'est maintenant la porte B18. »"
  - "« B18, c'est bien ça ? Et l'embarquement commence toujours à quinze heures quarante ? »"
  - "« Oui, à quinze heures quarante. Ce n'est pas l'heure du décollage : l'avion va partir un peu plus tard. »"
  - "« Pardon, à quinze heures quatorze ou à quinze heures quarante ? Je voudrais être sûr. »"
  - "« À quinze heures quarante. Vous avez encore le temps, mais pas beaucoup. »"
  - "« Merci. Comment aller à la porte B18 ? Est-ce plus loin que la B12 ? »"
  - "« Un peu plus loin, oui. Continuez tout droit, puis tournez à droite après le café. Vous y serez en cinq minutes. »"
  - "« Tout droit, puis à droite après le café. Merci beaucoup. »"
  - "Je suis parti tout de suite. Pendant un moment, je n'ai pas trouvé le café, alors j'ai demandé à une employée un autre repère."
  - "Elle m'a indiqué un magasin de journaux, juste avant le tournant. J'y suis arrivé à quinze heures trente. Cette fois, j'avais bien vérifié l'heure et le numéro."

