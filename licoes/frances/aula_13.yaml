pronuncia:
  - fr: "Je cherche la porte B12 pour mon vol. Pourriez-vous confirmer, s'il vous plaît ?"
    pt: "Estou procurando o portão B12 para o meu voo. Poderia confirmar, por favor?"
    dica: "'Porte' pronuncia o 't' final (/pɔʁt/); 'vol' pronuncia o 'l' (/vɔl/)."
  - fr: "La porte a changé. C'est maintenant la porte B18."
    pt: "O portão mudou. Agora é o portão B18."
    dica: "'Maintenant' tem nasal /ɛ̃/ inicial e nasal /ɑ̃/ final com 't' mudo (/mɛ̃.tə.nɑ̃/)."
  - fr: "Pardon, à quinze heures quatorze ou à quinze heures quarante ?"
    pt: "Com licença, às 15h14 ou às 15h40?"
    dica: "Contraste bem o final: 'quatorze' termina em /ɔʁz/, e 'quarante' termina em /ɑ̃t/."
  - fr: "Ce n'est pas l'heure du décollage : l'avion va partir un peu plus tard."
    pt: "Não é a hora da decolagem: o avião vai partir um pouco mais tarde."
    dica: "Em 'plus tard', o 's' de 'plus' e o 'd' de 'tard' são mudos (/ply taʁ/)."
  - fr: "Est-ce plus loin que la B12 ?"
    pt: "É mais longe que o B12?"
    dica: "'Est-ce' soa /ɛs/ numa sílaba só; 'loin' é a nasal /lwɛ̃/."
  - fr: "Continuez tout droit, puis tournez à droite après le café."
    pt: "Siga em frente e depois vire à direita depois do café."
    dica: "Contraste /y/ de 'continuez' com o contraste 'tout droit' (sem t) / 'à droite' (com t)."
  - fr: "Vous y serez en cinq minutes."
    pt: "Você chegará lá em cinco minutos."
    dica: "Liaison /z/ em 'Vous y' (/vu.zi/) e pronúncia clara de /y/ em 'minutes'."
  - fr: "Je ne l'ai pas tout de suite comprise."
    pt: "Não a entendi de imediato."
    dica: "No feminino ('comprise'), o 's' intervocálico soa /z/ audível (/kɔ̃.pʁiz/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je cherche la porte B12 pour mon vol. Pourriez-vous confirmer, s'il vous plaît ?"
        pt: "Estou procurando o portão B12 para o meu voo. Poderia confirmar, por favor?"
      - fr: "La porte a changé. C'est maintenant la porte B18."
        pt: "O portão mudou. Agora é o portão B18."
      - fr: "L'embarquement commence à quinze heures quarante."
        pt: "O embarque começa às 15h40."
      - fr: "Pardon, à quinze heures quatorze ou à quinze heures quarante ?"
        pt: "Com licença, às 15h14 ou às 15h40?"
      - fr: "Continuez tout droit, puis tournez à droite après le café."
        pt: "Siga em frente e depois vire à direita depois do café."

  - tipo: semaforo
    itens:
      - errado: "Je ne l'ai pas tout de suite compris l'information."
        certo: "Je ne l'ai pas tout de suite comprise."
        nota_pt: "Quando o objeto direto feminino (l' = l'information) vem antes do verbo com avoir, o particípio concorda: comprise."
      - errado: "J'ai parti tout de suite."
        certo: "Je suis parti tout de suite."
        nota_pt: "Partir usa sempre o auxiliar être no passé composé."
      - errado: "Comment pour aller à la porte B18 ?"
        certo: "Comment aller à la porte B18 ?"
        nota_pt: "Após comment no sentido de 'como fazer para', usa-se direto o infinitivo sem pour."
      - errado: "Vous serez là en cinq minutes."
        certo: "Vous y serez en cinq minutes."
        nota_pt: "No lugar mencionado antes (o portão), o pronome y antes do verbo é a forma natural."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Je peux vous aider ?"
        resposta: "Bonjour. Je cherche la porte B12 pour mon vol. Pourriez-vous confirmer, s'il vous plaît ?"
      - pergunta: "La porte a changé. C'est maintenant la porte B18."
        resposta: "Pardon, à quinze heures quatorze ou à quinze heures quarante ?"
      - pergunta: "Est-ce plus loin que la B12 ?"
        resposta: "Un peu plus loin, oui. Continuez tout droit, puis tournez à droite après le café."
      - pergunta: "Vous ne trouvez pas le café. Que demandez-vous ?"
        resposta: "Je ne trouve pas le café. Vous pouvez m'indiquer un autre repère ?"

fala_livre:
  enunciado: "No aeroporto, o portão e o horário do seu voo mudaram. Confirme o novo portão, esclareça um número parecido (15h14 vs 15h40), diferencie embarque de decolagem e peça outro ponto de referência."
  passos:
    - "Pergunte pelo portão original e peça confirmação com « Pourriez-vous confirmer… ? »."
    - "Repita o novo portão e contraste o horário (« quinze heures quatorze ou quarante ? »)."
    - "Peça o caminho até o novo portão e pergunte por outro ponto de referência caso não encontre o primeiro."
  criterio: "Comunicar a dúvida e confirmar portão, horário e trajeto, mesmo pedindo repetição."
  duracao_alvo_s: 60
