id: "aula-14"
titulo: "Aula 14 — Na padaria — um produto esgotado"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "3 · Imprevistos e Autonomia (11–16)"
tipo: "aula"
ordem: 14
foco: "Padaria: item esgotado, il n'y a plus de, pronome en e preço"
notion_url: "https://app.notion.com/p/42205941420581b5841ed467616a36b5"

cena:
  - "À la boulangerie, il n'y a plus de croissants."
  - "Le lendemain matin, je suis descendu plus tôt que d'habitude. Il faisait frais, et la rue était encore calme. J'avais faim, et je voulais rapporter quelque chose à l'hôtel."
  - "Je suis donc entré dans une petite boulangerie, près de mon arrêt de bus. L'odeur du pain était très bonne."
  - "Une vendeuse m'a demandé : « Bonjour, vous désirez ? »"
  - "« Bonjour. Je voudrais une baguette et deux croissants, s'il vous plaît. »"
  - "« Je suis désolée, il n'y a plus de croissants. Il reste des pains au chocolat. »"
  - "« D'accord. Les pains au chocolat, ils sont aussi bons que les croissants ? »"
  - "« Oui, et ils sont un peu plus grands. Beaucoup de clients en prennent le matin. »"
  - "« Très bien. Je vais en prendre deux, alors, et la baguette. Pourriez-vous aussi me donner un petit sac, s'il vous plaît ? »"
  - "« Bien sûr. Et avec ceci ? »"
  - "« Ce sera tout, merci. Combien ça fait ? »"
  - "« Ça fait cinq euros cinquante. La baguette est à un euro vingt, et les deux pains au chocolat font quatre euros trente. »"
  - "« Cinq euros cinquante, c'est bien ça ? Je peux payer par carte ? »"
  - "« Oui, bien sûr. Voici le ticket. »"
  - "« Merci. Si je reviens demain, vous allez avoir des croissants plus tôt ? »"
  - "« Oui, dès sept heures. Il vaut mieux venir un peu plus tôt qu'aujourd'hui. »"
  - "« Parfait. Alors, demain, je vais passer vers sept heures et demie. Merci, bonne journée ! »"
  - "« À demain ! »"
  - "J'ai repris le chemin de l'hôtel avec mon sac. Le pain était encore chaud. C'était simple, et c'était exactement ce que je voulais."

vocabulario:
  - fr: "une boulangerie"
    pt: "uma padaria"
  - fr: "une baguette"
    pt: "uma baguete"
  - fr: "un pain au chocolat"
    pt: "um folhado de chocolate"
  - fr: "il n'y a plus de…"
    pt: "não há mais…"
  - fr: "il reste…"
    pt: "ainda há / resta…"
  - fr: "dès sept heures"
    pt: "a partir das sete"
  - fr: "plus tôt que"
    pt: "mais cedo que"
  - fr: "aussi bon que"
    pt: "tão bom quanto"
  - fr: "je suis désolée"
    pt: "sinto muito"
  - fr: "et avec ceci ?"
    pt: "mais alguma coisa?"
  - fr: "ce sera tout"
    pt: "é só / só isso"
  - fr: "combien ça fait ?"
    pt: "quanto dá?"

pronuncia:
  - fr: "Je voudrais une baguette et deux croissants, s'il vous plaît."
    pt: "Eu gostaria de uma baguete e dois croissants, por favor."
    dica: "'Baguette' pronuncia o 't' final (/ba.gɛt/); 'deux' tem /ø/ fechado."
  - fr: "Je suis désolée, il n'y a plus de croissants."
    pt: "Sinto muito, não há mais croissants."
    dica: "Em 'il n'y a plus de', o 's' de 'plus' costuma soar mudo antes de consoante (/ply də/)."
  - fr: "Les pains au chocolat, ils sont aussi bons que les croissants ?"
    pt: "Os folhados de chocolate são tão bons quanto os croissants?"
    dica: "Liaison suave em 'pains au' e 'sont aussi' (/sɔ̃.to.si/); 'chocolat' termina em /a/ sem 't'."
  - fr: "Beaucoup de clients en prennent le matin."
    pt: "Muitos clientes levam (disso) de manhã."
    dica: "Em 'prennent', não pronuncie '-ent' (/pʁɛn/)."
  - fr: "Je vais en prendre deux, alors, et la baguette."
    pt: "Então vou levar dois (disso) e a baguete."
    dica: "Liaison em 'en' + verbo ou 'deux, alors' com pausa curta; marque a vogal nasal de 'en' (/ɑ̃/)."
  - fr: "Et avec ceci ? Ce sera tout, merci."
    pt: "Mais alguma coisa? É só, obrigado."
    dica: "'Ceci' soa /sə.si/; 'tout' termina em /tu/ sem 't'."
  - fr: "Ça fait cinq euros cinquante."
    pt: "Dá cinco euros e cinquenta."
    dica: "Liaison obrigatória em 'cinq euros' (/sɛ̃.kø.ʁo/)."
  - fr: "Il vaut mieux venir un peu plus tôt qu'aujourd'hui."
    pt: "É melhor vir um pouco mais cedo do que hoje."
    dica: "'Mieux' soa /mjø/ arredondado; 'tôt' fecha em /o/ sem 't'."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je voudrais une baguette et deux croissants, s'il vous plaît."
        pt: "Eu gostaria de uma baguete e dois croissants, por favor."
      - fr: "Je suis désolée, il n'y a plus de croissants."
        pt: "Sinto muito, não há mais croissants."
      - fr: "Je vais en prendre deux, alors."
        pt: "Então vou levar dois (disso)."
      - fr: "Et avec ceci ? Ce sera tout, merci."
        pt: "Mais alguma coisa? É só, obrigado."
      - fr: "Cinq euros cinquante, c'est bien ça ?"
        pt: "Cinco euros e cinquenta, é isso?"

  - tipo: semaforo
    itens:
      - errado: "Il n'y a plus des croissants."
        certo: "Je suis désolée, il n'y a plus de croissants."
        nota_pt: "Após il n'y a plus (negação de quantidade), usa-se sempre de, nunca des."
      - errado: "Je vais prendre deux, alors."
        certo: "Je vais en prendre deux, alors."
        nota_pt: "Quando o número fica sem o substantivo depois, o pronome en é obrigatório antes do verbo."
      - errado: "Il vaut mieux de venir plus tôt."
        certo: "Il vaut mieux venir un peu plus tôt qu'aujourd'hui."
        nota_pt: "Il vaut mieux liga-se direto ao infinitivo, sem a preposição de."
      - errado: "J'ai descendu plus tôt que d'habitude."
        certo: "Je suis descendu plus tôt que d'habitude."
        nota_pt: "Descendre sem objeto direto faz o passé composé com être."

  - tipo: producao
    itens:
      - pergunta: "Bonjour, vous désirez ?"
        resposta: "Bonjour. Je voudrais une baguette et deux croissants, s'il vous plaît."
      - pergunta: "Il n'y a plus de croissants. Il reste des pains au chocolat."
        resposta: "Je vais en prendre deux, alors."
      - pergunta: "Et avec ceci ?"
        resposta: "Ce sera tout, merci. Combien ça fait ?"
      - pergunta: "Il vaut mieux venir plus tôt demain."
        resposta: "Parfait. Alors, demain, je vais passer vers sept heures et demie."

fala_livre:
  enunciado: "Na padaria, peça dois produtos com quantidades. Um deles acabou: pergunte o que há no lugar e o preço, use « Je vais en prendre… » (ou recuse com educação ficando só com o disponível) e confirme o total."
  passos:
    - "Peça dois itens com quantidade definida (« une baguette et deux croissants »)."
    - "Diante do item esgotado, pergunte alternativa/preço e decida usando « en » (« Je vais en prendre… ») ou recusando educadamente."
    - "Encerre com « Ce sera tout, merci », confirme o valor total e o pagamento por cartão."
  criterio: "Adaptar o pedido à resposta recebida, expressar quantidade e confirmar o total."
  duracao_alvo_s: 60
