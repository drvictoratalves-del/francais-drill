id: "aula-15"
titulo: "Aula 15 — Na farmácia — pedir um conselho simples"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "3 · Imprevistos e Autonomia (11–16)"
tipo: "aula"
ordem: 15
foco: "Farmácia: mal-estar cotidiano, conselhos simples, pronomes en/les/lui"
notion_url: "https://app.notion.com/p/4220594142058157935ccb9253a3af94"

cena:
  - "À la pharmacie, près de l'hôtel."
  - "Depuis hier soir, j'ai mal à la gorge, et je tousse un peu. Ce n'est pas grave, mais je dors moins bien qu'avant. Ce matin, après le petit-déjeuner, je suis allé à la pharmacie, en face du Café des Arts."
  - "Une pharmacienne m'a accueilli : « Bonjour. Je peux vous aider ? »"
  - "« Bonjour. Oui, s'il vous plaît. J'ai mal à la gorge depuis hier, et je tousse. Pourriez-vous me conseiller quelque chose de simple ? Je n'ai pas d'ordonnance. »"
  - "« Vous avez de la fièvre ? Et vous êtes allergique à quelque chose ? »"
  - "« Non, pas de fièvre. Et non, pas d'allergie, je crois. Je bois déjà beaucoup d'eau. »"
  - "« Très bien. Pour la gorge, vous pouvez prendre des pastilles. Et pour la toux, il y a un sirop, sans ordonnance. Les deux vont ensemble, si vous voulez. »"
  - "« Je vais en prendre une boîte de pastilles, et le sirop. Vous pourriez m'expliquer comment les utiliser, s'il vous plaît ? Un peu plus lentement. »"
  - "Elle me l'a expliqué clairement, et elle a écrit l'essentiel sur le sac. Je lui ai demandé le prix."
  - "« Ça fait douze euros quatre-vingts. Vous les payez comment ? »"
  - "« Par carte, s'il vous plaît. Et si ça continue après deux ou trois jours, je fais quoi ? »"
  - "« Alors, vous allez voir un médecin. Aujourd'hui, ce n'est pas nécessaire, si vous vous sentez seulement un peu fatigué. Reposez-vous, et buvez encore de l'eau. »"
  - "« D'accord, merci beaucoup. Je vais rentrer à l'hôtel et me reposer. »"
  - "« Je vous en prie. Bon rétablissement ! »"
  - "Je suis ressorti avec mon sac. En rentrant, j'ai envoyé un court message à Camille : aujourd'hui, je vais rester au calme."

