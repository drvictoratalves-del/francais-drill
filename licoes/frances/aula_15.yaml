pronuncia:
  - fr: "J'ai mal à la gorge depuis hier, et je tousse."
    pt: "Estou com dor de garganta desde ontem e estou tossindo."
    dica: "'Tousser' em 'tousse' soa /tus/ (com /u/ fechado e /s/ final audível)."
  - fr: "Pourriez-vous me conseiller quelque chose de simple ?"
    pt: "Poderia me aconselhar alguma coisa simples?"
    dica: "Depois de 'quelque chose', use sempre 'de' antes do adjetivo ('de simple')."
  - fr: "Je n'ai pas d'ordonnance."
    pt: "Não tenho receita."
    dica: "'Ordonnance' termina em /ɑ̃s/ suave sem vogal extra depois do 'c'."
  - fr: "Je vais en prendre une boîte de pastilles, et le sirop."
    pt: "Vou levar uma caixa de pastilhas e o xarope."
    dica: "Em 'sirop', o 'p' final é mudo (/si.ʁo/)."
  - fr: "Vous pourriez m'expliquer comment les utiliser, s'il vous plaît ?"
    pt: "Poderia me explicar como usá-los, por favor?"
    dica: "Liaison obrigatória em 'les utiliser' (/le.zy.ti.li.ze/) e atenção ao /y/."
  - fr: "Ça fait douze euros quatre-vingts."
    pt: "Dá doze euros e oitenta."
    dica: "Liaison em 'douze euros' (/du.zø.ʁo/); em 'quatre-vingts', o 'ts' final é mudo (/katʁ.vɛ̃/)."
  - fr: "Reposez-vous, et buvez encore de l'eau."
    pt: "Descanse e beba mais água."
    dica: "Liaison suave em 'buvez encore' (/by.ve.zɑ̃.kɔʁ/) e /y/ bem marcado em 'buvez'."
  - fr: "Je dors moins bien qu'avant."
    pt: "Durmo menos bem do que antes."
    dica: "Em 'dors', o 's' final é mudo (/dɔʁ/); 'moins' tem nasal /mwɛ̃/ sem 's'."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "J'ai mal à la gorge depuis hier, et je tousse."
        pt: "Estou com dor de garganta desde ontem, e estou tossindo."
      - fr: "Pourriez-vous me conseiller quelque chose de simple ?"
        pt: "Poderia me aconselhar alguma coisa simples?"
      - fr: "Je n'ai pas d'ordonnance."
        pt: "Não tenho receita."
      - fr: "Je vais en prendre une boîte de pastilles, et le sirop."
        pt: "Vou levar uma caixa de pastilhas e o xarope."
      - fr: "Si ça continue, vous allez voir un médecin."
        pt: "Se continuar, o senhor vai procurar um médico."

  - tipo: semaforo
    itens:
      - errado: "J'ai une douleur à gorge depuis hier."
        certo: "J'ai mal à la gorge depuis hier, et je tousse."
        nota_pt: "Em francês cotidiano, dor em uma parte do corpo usa avoir mal à + artigo (mal à la gorge)."
      - errado: "Je vais prendre une boîte de pastilles."
        certo: "Je vais en prendre une boîte de pastilles, et le sirop."
        nota_pt: "Com quantidade/unidade de algo já citado (une boîte), o pronome en retoma o item antes do verbo."
      - errado: "J'ai demandé le prix à elle."
        certo: "Je lui ai demandé le prix."
        nota_pt: "Objeto indireto singular (para ela/ele) usa o pronome lui antes do auxiliar."
      - errado: "Quelque chose simple."
        certo: "Pourriez-vous me conseiller quelque chose de simple ?"
        nota_pt: "Depois de quelque chose, o adjetivo exige de na frente (quelque chose de simple)."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Je peux vous aider ?"
        resposta: "J'ai mal à la gorge depuis hier, et je tousse. Pourriez-vous me conseiller quelque chose de simple ?"
      - pergunta: "Vous avez une ordonnance ?"
        resposta: "Je n'ai pas d'ordonnance."
      - pergunta: "Les deux vont ensemble, si vous voulez."
        resposta: "Je vais en prendre une boîte de pastilles, et le sirop."
      - pergunta: "Comment demander comment utiliser les produits plus lentement ?"
        resposta: "Vous pourriez m'expliquer comment les utiliser, s'il vous plaît ? Un peu plus lentement."

fala_livre:
  enunciado: "Na farmácia, explique um mal-estar cotidiano simples (garganta, tosse ou cansaço), diga desde quando e se tem febre ou receita, peça um conselho com cortesia e pergunte como usar."
  passos:
    - "Descreva o mal-estar com « J'ai mal à… depuis… » e diga se tem receita ou alergia."
    - "Peça um conselho com « Pourriez-vous me conseiller quelque chose de simple ? »."
    - "Peça que expliquem devagar como usar e pergunte o preço e quando procurar atendimento."
  criterio: "Situação descrita com clareza, pedido educado de conselho e confirmação das instruções."
  duracao_alvo_s: 60
