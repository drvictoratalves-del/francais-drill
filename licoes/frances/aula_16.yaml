pronuncia:
  - fr: "J'ai un billet pour neuf heures, mais je vois qu'il y a une grève."
    pt: "Tenho um bilhete para as nove, mas vejo que há uma greve."
    dica: "Liaison /v/ em 'neuf heures' (/nœ.vœʁ/) e som aberto /ɛ/ em 'grève'."
  - fr: "Pourriez-vous me dire ce que je peux faire ?"
    pt: "Poderia me dizer o que eu posso fazer?"
    dica: "'Ce que je peux' encadeia vogais fechadas suaves (/sə.kə.ʒə.pø/)."
  - fr: "Votre train est annulé. Il y a un bus de remplacement."
    pt: "Seu trem está cancelado. Há um ônibus substituto."
    dica: "Marque o /y/ de 'annulé' e o 's' final audível em 'bus' (/bys/)."
  - fr: "Il n'y en a pas un plus tôt ?"
    pt: "Não há um mais cedo?"
    dica: "'Plus tôt' tem /y/ em 'plus' (s mudo) e /o/ fechado em 'tôt' (/ply.to/)."
  - fr: "Mon billet, je peux l'utiliser dans le bus ?"
    pt: "Meu bilhete, posso usá-lo no ônibus?"
    dica: "Mantenha /y/ bem articulado em 'l'utiliser' (/ly.ti.li.ze/)."
  - fr: "Je vais vous le tamponner."
    pt: "Vou carimbar para o senhor."
    dica: "'Tamponner' tem duas nasais seguidas (/tɑ̃.pɔ.ne/) com final /e/."
  - fr: "Vous reviendrez ici, et nous vous proposerons un remboursement."
    pt: "O senhor voltará aqui e proporemos um reembolso."
    dica: "Futuro simples termina em '-ez' (/e/) e '-ons' (/ɔ̃/ sem 's')."
  - fr: "C'est moins pratique, mais c'est mieux que d'attendre sans savoir."
    pt: "É menos prático, mas é melhor do que esperar sem saber."
    dica: "'Mieux' (/mjø/) arredondado; 'sans' tem 's' final mudo (/sɑ̃/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "J'ai un billet pour neuf heures, mais je vois qu'il y a une grève."
        pt: "Tenho um bilhete para as nove, mas vejo que há uma greve."
      - fr: "Pourriez-vous me dire ce que je peux faire ?"
        pt: "Poderia me dizer o que eu posso fazer?"
      - fr: "Il n'y en a pas un plus tôt ?"
        pt: "Não há um mais cedo?"
      - fr: "Mon billet, je peux l'utiliser dans le bus ?"
        pt: "O meu bilhete, eu posso usá-lo no ônibus?"
      - fr: "Oui, je vais le prendre."
        pt: "Sim, vou pegá-lo."

  - tipo: semaforo
    itens:
      - errado: "Il n'y a pas un plus tôt ?"
        certo: "Il n'y en a pas un plus tôt ?"
        nota_pt: "Quando um número (un) substitui o substantivo (un train), o pronome en é obrigatório: il n'y en a pas un."
      - errado: "Le voyage est plus long de le train."
        certo: "Le voyage est un peu plus long que le train, mais au moins, il part."
        nota_pt: "Comparações com adjetivo (plus long) usam que, nunca de."
      - errado: "Je peux utiliser lui dans le bus ?"
        certo: "Mon billet, je peux l'utiliser dans le bus ?"
        nota_pt: "O objeto direto (mon billet) é retomado por l' antes do infinitivo (l'utiliser)."
      - errado: "J'ai me mis dans la file du bus."
        certo: "Je me suis mis dans la file du bus."
        nota_pt: "Se mettre é pronominal, então usa être no passé composé: je me suis mis(e)."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Je vous écoute."
        resposta: "J'ai un billet pour neuf heures, mais je vois qu'il y a une grève. Pourriez-vous me dire ce que je peux faire ?"
      - pergunta: "Le prochain train partira vers treize heures trente."
        resposta: "Treize heures trente, c'est bien ça ? Il n'y en a pas un plus tôt ?"
      - pergunta: "Il y a un bus de remplacement à dix heures quinze."
        resposta: "Mon billet, je peux l'utiliser dans le bus ?"
      - pergunta: "Vous allez prendre le bus, finalement ?"
        resposta: "Oui, je vais le prendre."

fala_livre:
  enunciado: "Chegue à estação com um bilhete já comprado e descubra que houve greve. Peça alternativas, pergunte se há opção mais cedo, confirme se o bilhete vale no ônibus substituto e o que acontece se lotar."
  passos:
    - "Explique o cancelamento e pergunte o que pode fazer com « Pourriez-vous me dire… ? »."
    - "Pergunte por horário mais cedo usando « Il n'y en a pas un plus tôt ? »."
    - "Confirme validade do bilhete no ônibus e opção de reembolso caso falte lugar."
  criterio: "Alternativa negociada, validade do bilhete confirmada e próximo passo entendido."
  duracao_alvo_s: 60
