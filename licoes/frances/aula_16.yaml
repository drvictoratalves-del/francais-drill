id: "aula-16"
titulo: "Aula 16 — Na estação — greve dos trens"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "3 · Imprevistos e Autonomia (11–16)"
tipo: "aula"
ordem: 16
foco: "Estação: greve/cancelamento de trem e confirmação de alternativa"
notion_url: "https://app.notion.com/p/422059414205811480d6f61f49703823"

cena:
  - "À la gare, il y a une grève."
  - "Ce matin, je suis allé à la gare plus tôt que prévu. Je voulais prendre le train de neuf heures pour une petite ville. Mais, sur le grand écran, presque tous les trains étaient annulés, ou en retard. Il y avait beaucoup plus de monde que d'habitude."
  - "J'ai fait la queue au guichet. Un agent m'a dit : « Bonjour. Je vous écoute. »"
  - "« Bonjour. J'ai un billet pour neuf heures, mais je vois qu'il y a une grève. Pourriez-vous me dire ce que je peux faire ? »"
  - "« Oui, aujourd'hui, il y a une grève. Votre train est annulé, je suis désolé. Le prochain, s'il circule, partira vers treize heures trente. »"
  - "« Treize heures trente, c'est bien ça ? Il n'y en a pas un plus tôt ? »"
  - "« Non, pas sur cette ligne. Vous pouvez aussi prendre un bus de remplacement, devant la gare. Il y en a un à dix heures quinze. Le voyage est un peu plus long que le train, mais au moins, il part. »"
  - "« D'accord. Mon billet, je peux l'utiliser dans le bus, ou je dois en prendre un autre ? »"
  - "« Vous pouvez l'utiliser. Je vais vous le tamponner. Gardez-le : on vous le demandera à la montée. »"
  - "« Merci. Et s'il n'y a plus de places ? »"
  - "« Alors, vous reviendrez ici, et nous vous proposerons un remboursement, ou un autre jour. Vous allez prendre le bus, finalement ? »"
  - "« Oui, je vais le prendre. C'est moins pratique, mais c'est mieux que d'attendre sans savoir. »"
  - "« Très bien. Le départ est juste devant, à gauche de l'entrée. »"
  - "Je suis sorti et je me suis mis dans la file du bus. J'ai envoyé un message à Camille : mon programme allait changer. Au moins, j'avais une solution."

