cena:
  - "Louer une voiture pour la journée."
  - "Après la grève, j'ai décidé de louer une voiture, pour un jour seulement. Je voulais visiter une petite ville. L'agence se trouvait à dix minutes de l'hôtel, plus près que la gare."
  - "Ce matin, j'y suis entré. Un employé m'a accueilli : « Bonjour. Vous avez une réservation ? »"
  - "« Bonjour. Non, pas encore. Je voudrais une petite voiture, pour aujourd'hui seulement. Pourriez-vous me proposer quelque chose de simple ? »"
  - "« Oui. Nous avons une citadine, automatique, plus facile en ville qu'une grande voiture. Elle est à quarante-huit euros la journée, assurance comprise. Il y en a une de libre. »"
  - "« Quarante-huit euros, c'est bien ça ? Il y a un kilomètre limité, ou je peux en faire autant que je veux ? »"
  - "« Vous pouvez en faire jusqu'à deux cents. Après, c'est un petit supplément. Vous avez votre permis, et une carte ? »"
  - "« Oui, je les ai tous les deux. Voici mon permis. Je vais aussi prendre l'assurance. »"
  - "« Très bien. Je vais vous les photocopier, et vous allez signer ici. Le réservoir est plein : vous le ramènerez plein aussi, s'il vous plaît. La voiture se trouve au fond, à droite. »"
  - "« D'accord. Vous pourriez me montrer ça sur le plan, s'il vous plaît ? Et à quelle heure je dois la ramener ? »"
  - "« Avant dix-neuf heures. Si vous êtes en retard, appelez-nous. Voici les clés, et le numéro de l'agence. »"
  - "« Parfait. Je vais d'abord aller à l'office de tourisme, puis je prendrai la route. Merci beaucoup. »"
  - "J'ai trouvé la voiture sans problème. Elle était plus petite que je ne l'imaginais, mais très pratique. Avant de partir, j'ai réglé le siège et j'ai regardé le GPS. Ensuite, je suis sorti de la ville plus tranquillement qu'en train."

