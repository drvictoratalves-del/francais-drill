pronuncia:
  - fr: "Je voudrais une petite voiture, pour aujourd'hui seulement."
    pt: "Eu gostaria de um carro pequeno, só para hoje."
    dica: "Em 'voiture', o 'u' tem som /y/ (/vwa.tyʁ/)."
  - fr: "Elle est à quarante-huit euros la journée, assurance comprise."
    pt: "Custa 48 euros o dia, com seguro incluído."
    dica: "Liaison suave em 'quarante-huit euros' (/ka.ʁɑ̃.tɥi.tø.ʁo/); 'comprise' termina em /z/."
  - fr: "Vous pouvez en faire jusqu'à deux cents."
    pt: "Pode fazer até duzentos."
    dica: "Em 'deux cents', o 'x' e o 'ts' finais são mudos (/dø.sɑ̃/)."
  - fr: "Je vais vous les photocopier, et vous allez signer ici."
    pt: "Vou fotocopiá-los e o senhor vai assinar aqui."
    dica: "Em 'signer', 'gn' soa como 'nh' (/si.ɲe/)."
  - fr: "Le réservoir est plein : vous le ramènerez plein aussi."
    pt: "O tanque está cheio: o senhor o devolverá cheio também."
    dica: "'Plein' termina na nasal /plɛ̃/ sem pronunciar o 'n'."
  - fr: "Vous pourriez me montrer ça sur le plan, s'il vous plaît ?"
    pt: "Poderia me mostrar isso no mapa, por favor?"
    dica: "'Sur' usa /y/ projetado (/syʁ/), e 'plan' fecha em nasal /plɑ̃/."
  - fr: "À quelle heure je dois la ramener ?"
    pt: "A que horas devo devolvê-lo?"
    dica: "'Dois' termina em /wa/ sem 's'; 'ramener' termina em /e/."
  - fr: "Je prendrai la route."
    pt: "Vou pegar a estrada."
    dica: "Futuro simples 'prendrai' termina em /e/ fechado (/pʁɑ̃.dʁe/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je voudrais une petite voiture, pour aujourd'hui seulement."
        pt: "Eu gostaria de um carro pequeno, só para hoje."
      - fr: "Pourriez-vous me proposer quelque chose de simple ?"
        pt: "Poderia me propor alguma coisa simples?"
      - fr: "Elle est à quarante-huit euros la journée, assurance comprise."
        pt: "Custa 48 euros o dia, com seguro incluído."
      - fr: "Vous pourriez me montrer ça sur le plan, s'il vous plaît ?"
        pt: "Poderia me mostrar isso no mapa, por favor?"
      - fr: "À quelle heure je dois la ramener ?"
        pt: "A que horas devo devolvê-la?"

  - tipo: semaforo
    itens:
      - errado: "J'ai entré dans l'agence ce matin."
        certo: "J'y suis entré."
        nota_pt: "Entrer usa être no passé composé e o pronome y retoma o lugar (l'agence)."
      - errado: "Il y a une de libre."
        certo: "Il y en a une de libre."
        nota_pt: "Quando une (uma) substitui o substantivo (une voiture), o pronome en é obrigatório: il y en a une."
      - errado: "J'ai eux tous les deux."
        certo: "Oui, je les ai tous les deux."
        nota_pt: "Para retomar dois itens no plural (le permis et une carte), usa-se o pronome les antes do verbo."
      - errado: "Je dois ramener elle avant dix-neuf heures."
        certo: "À quelle heure je dois la ramener ?"
        nota_pt: "O pronome objeto direto (la para la voiture) posiciona-se antes do infinitivo: la ramener."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Vous avez une réservation ?"
        resposta: "Bonjour. Non, pas encore. Je voudrais une petite voiture, pour aujourd'hui seulement."
      - pergunta: "Vous avez votre permis, et une carte ?"
        resposta: "Oui, je les ai tous les deux."
      - pergunta: "La voiture se trouve au fond, à droite."
        resposta: "Vous pourriez me montrer ça sur le plan, s'il vous plaît ? Et à quelle heure je dois la ramener ?"
      - pergunta: "Si vous êtes en retard, appelez-nous."
        resposta: "Parfait. Je vais d'abord aller à l'office de tourisme, puis je prendrai la route."

fala_livre:
  enunciado: "Na locadora, peça um carro para um dia, confirme preço, seguro, limite de quilômetros, horário de devolução e condição do tanque, pedindo para mostrar no mapa."
  passos:
    - "Peça o tipo de carro e duração, perguntando opções com « Pourriez-vous me proposer… ? »."
    - "Confirme valor, seguro e limite de quilômetros usando « en »."
    - "Confirme horário de devolução, tanque cheio e peça para ver a vaga no mapa."
  criterio: "Condições do aluguel compreendidas e confirmadas com clareza."
  duracao_alvo_s: 60
