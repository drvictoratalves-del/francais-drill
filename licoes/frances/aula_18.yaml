pronuncia:
  - fr: "Je voudrais en acheter un, s'il vous plaît."
    pt: "Eu gostaria de comprar um, por favor."
    dica: "Liaison suave em 'en acheter' (/ɑ̃.naʃ.te/) e atenção ao 's' mudo em 'voudrais'."
  - fr: "C'est plus cher le week-end, ou c'est le même prix ?"
    pt: "É mais caro no fim de semana, ou é o mesmo preço?"
    dica: "Em 'plus cher', o 's' de 'plus' é mudo; em 'cher', pronuncia-se o 'r' final (/ʃɛʁ/)."
  - fr: "Vous en voulez un ? Oui, je vais en prendre un, en français."
    pt: "Quer um? Sim, vou pegar um, em francês."
    dica: "Liaison em 'vous en' (/vu.zɑ̃/) e nasal clara em 'en' e 'un'."
  - fr: "Pourriez-vous me dire quelle salle visiter en premier ?"
    pt: "Poderia me dizer qual sala visitar primeiro?"
    dica: "'Premier' termina em /e/ fechado sem pronunciar o 'r' final."
  - fr: "Descendez au rez-de-chaussée, pour les sculptures."
    pt: "Desça ao térreo, para as esculturas."
    dica: "Em 'sculptures', o 'p' é mudo (/skyl.tyʁ/); marque os dois /y/."
  - fr: "J'ai encore eu le temps de voir deux sculptures."
    pt: "Ainda tive tempo de ver duas esculturas."
    dica: "O particípio 'eu' soa simplesmente /y/ (uma vogal só)."
  - fr: "Une salle était plus sombre que les autres."
    pt: "Uma sala era mais escura que as outras."
    dica: "Liaison obrigatória em 'les autres' (/le.zotʁ/)."
  - fr: "J'ai acheté une petite carte postale."
    pt: "Comprei um pequeno cartão-postal."
    dica: "Em 'acheté', a segunda sílaba costuma reduzir no oral (/aʃ.te/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je voudrais en acheter un, s'il vous plaît."
        pt: "Eu gostaria de comprar um, por favor."
      - fr: "C'est plus cher le week-end, ou c'est le même prix ?"
        pt: "É mais caro no fim de semana, ou é o mesmo preço?"
      - fr: "Oui, je vais en prendre un, en français."
        pt: "Sim, vou pegar um, em francês."
      - fr: "Pourriez-vous me dire quelle salle visiter en premier ?"
        pt: "Poderia me dizer qual sala visitar primeiro?"
      - fr: "Je peux prendre des photos ?"
        pt: "Posso tirar fotos?"

  - tipo: semaforo
    itens:
      - errado: "Je voudrais acheter un billet un."
        certo: "Je voudrais en acheter un, s'il vous plaît."
        nota_pt: "Quando un substitui un billet sem repeti-lo, o pronome en vem antes do verbo/infinitivo: en acheter un."
      - errado: "Si vous voulez laisser votre sac là."
        certo: "Le vestiaire est à gauche, si vous voulez y laisser votre sac."
        nota_pt: "Para retomar um lugar já mencionado (le vestiaire), usa-se o pronome y antes do infinitivo."
      - errado: "J'ai monté au premier étage."
        certo: "J'y ai laissé mon manteau, puis je suis monté."
        nota_pt: "Monter sem objeto direto faz o passé composé com être: je suis monté(e)."
      - errado: "J'ai encore avoir le temps."
        certo: "J'ai encore eu le temps de voir deux sculptures."
        nota_pt: "O particípio de avoir é eu (pronuncia-se /y/)."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Vous avez déjà un billet ?"
        resposta: "Bonjour. Non, je voudrais en acheter un, s'il vous plaît."
      - pergunta: "Vous en voulez un (audioguide) ?"
        resposta: "Oui, je vais en prendre un, en français."
      - pergunta: "Comment demander quelle salle visiter en premier ?"
        resposta: "Pourriez-vous me dire quelle salle visiter en premier ?"
      - pergunta: "Comment demander l'autorisation de photographier ?"
        resposta: "Je peux prendre des photos ?"

fala_livre:
  enunciado: "No museu, compre ingresso, escolha audioguia, peça sugestão de roteiro para uma hora e meia e pergunte sobre fotos e guarda-volumes. Depois compare duas salas no passado."
  passos:
    - "Compre o ingresso e o audioguia usando o pronome « en »."
    - "Peça sugestão de salas para o tempo que você tem e confirme regras de fotos e guarda-volumes."
    - "Compare duas salas ou obras no imparfait e passé composé (« plus sombre que », « plus calme »)."
  criterio: "Compra, roteiro e comparação de salas comunicados com clareza."
  duracao_alvo_s: 60
