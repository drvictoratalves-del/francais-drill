cena:
  - "Une visite au musée des Beaux-Arts."
  - "Cet après-midi, je suis allé au musée des Beaux-Arts, au centre-ville. Le bâtiment était plus ancien que celui de dimanche, et beaucoup plus grand. Sur la place, il y avait une file, mais elle n'était pas trop longue."
  - "À l'entrée, une hôtesse m'a demandé : « Bonjour. Vous avez déjà un billet ? »"
  - "« Bonjour. Non, je voudrais en acheter un, s'il vous plaît. C'est plus cher le week-end, ou c'est le même prix ? »"
  - "« C'est le même prix : douze euros. L'audioguide est en plus, à trois euros. Vous en voulez un ? »"
  - "« Oui, je vais en prendre un, en français. Pourriez-vous me dire quelle salle visiter en premier, si j'ai seulement une heure et demie ? »"
  - "« Alors, commencez par le premier étage : les tableaux du dix-neuvième siècle y sont très beaux. Ensuite, si vous avez le temps, descendez au rez-de-chaussée, pour les sculptures. C'est un peu plus calme, là-bas. »"
  - "« Merci. Et je peux prendre des photos ? »"
  - "« Oui, sans flash. Le vestiaire est à gauche, si vous voulez y laisser votre sac. »"
  - "J'y ai laissé mon manteau, puis je suis monté. J'ai écouté l'audioguide devant trois tableaux, et j'en ai regardé beaucoup d'autres. Une salle était plus sombre que les autres ; une autre, au contraire, était pleine de lumière. Je me suis arrêté plus longtemps devant un portrait : le visage était simple, mais très vivant."
  - "Vers dix-sept heures, je suis redescendu. J'ai encore eu le temps de voir deux sculptures, puis j'ai rendu l'audioguide. À la sortie, j'ai acheté une petite carte postale. Je vais l'envoyer à ma famille, demain, si je trouve un bureau de poste. C'était une belle visite, plus riche que je ne le pensais."

