id: "aula-19"
titulo: "Aula 19 — No mercado — escolher e comparar"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "4 · Serviços e Cidade (17–23)"
tipo: "aula"
ordem: 19
foco: "Mercado: comparar produtos, quantidades e pedir conselho"
notion_url: "https://app.notion.com/p/42205941420581a98a8fe8f94f723564"

cena:
  - "Au marché, avec Camille."
  - "Samedi matin, comme nous l'avions décidé, j'ai retrouvé Camille devant la station de métro, à dix heures. Il faisait beau, un peu plus doux que la veille. Nous sommes allés au marché à pied : ce n'était pas plus loin que dix minutes. Dès l'entrée, il y avait beaucoup de monde."
  - "Camille m'a dit : « On pourrait commencer par les fruits, puis aller voir le fromager. Je le connais un peu. »"
  - "« Très bien. Je vais en profiter pour acheter quelque chose à emporter, pour ce soir. »"
  - "Devant un étal, un marchand nous a demandé : « Bonjour. Vous désirez ? »"
  - "« Bonjour. Je voudrais des pommes, s'il vous plaît. Celles-ci, elles sont plus sucrées que celles-là ? »"
  - "« Oui, un peu plus. Elles sont très bonnes à manger maintenant. Vous en voulez combien ? »"
  - "« Un kilo, s'il vous plaît. Et ces tomates, elles viennent d'où ? »"
  - "« De la région, comme presque tout ici. Ça fait trois euros vingt, pour les pommes. »"
  - "Ensuite, nous sommes allés au fromager. Camille a choisi un morceau de comté, et je lui ai demandé conseil."
  - "« Je n'y connais pas grand-chose. Vous pourriez m'en proposer un, pas trop fort ? »"
  - "« Celui-ci, alors. Il est plus doux que le comté, et il va très bien avec du pain. »"
  - "« Parfait. Je vais en prendre un morceau. »"
  - "Nous avons encore acheté une baguette, puis nous nous sommes arrêtés pour boire un café. Le marché était plus vivant que les magasins du centre, et les prix n'étaient pas plus élevés."
  - "En rentrant, Camille m'a dit : « Si vous voulez, ce soir, on peut préparer quelque chose de simple, avec tout ça. »"
  - "« Oui, avec plaisir. Je vais apporter le fromage et le pain. »"

vocabulario:
  - fr: "un étal"
    pt: "uma banca"
  - fr: "un marchand"
    pt: "um feirante"
  - fr: "un fromager"
    pt: "um queijeiro"
  - fr: "des pommes"
    pt: "maçãs"
  - fr: "un kilo"
    pt: "um quilo"
  - fr: "un morceau"
    pt: "um pedaço"
  - fr: "le comté"
    pt: "o comté (queijo)"
  - fr: "plus doux que"
    pt: "mais suave que"
  - fr: "plus sucré(e) que"
    pt: "mais doce que"
  - fr: "plus vivant que"
    pt: "mais movimentado que"
  - fr: "plus élevé(e)"
    pt: "mais alto(a) (preço)"
  - fr: "celles-ci / celles-là"
    pt: "estas / aquelas"
  - fr: "je n'y connais pas grand-chose"
    pt: "não entendo muito do assunto"

pronuncia:
  - fr: "Celles-ci, elles sont plus sucrées que celles-là ?"
    pt: "Estas são mais doces do que aquelas?"
    dica: "'Sucrées' tem /y/ na primeira sílaba (/sy.kʁe/) e 's' mudo no plural."
  - fr: "Vous en voulez combien ? Un kilo, s'il vous plaît."
    pt: "Quantas o senhor quer? Um quilo, por favor."
    dica: "Liaison /z/ em 'Vous en' (/vu.zɑ̃/); 'combien' fecha em nasal /bjɛ̃/."
  - fr: "Et ces tomates, elles viennent d'où ?"
    pt: "E esses tomates, vêm de onde?"
    dica: "Em 'viennent', não pronuncie o '-ent' final (/vjɛn/)."
  - fr: "Ça fait trois euros vingt, pour les pommes."
    pt: "Dá três euros e vinte pelas maçãs."
    dica: "Liaison /z/ em 'trois euros' (/tʁwa.zø.ʁo/) e 'gt' mudos em 'vingt' (/vɛ̃/)."
  - fr: "Je n'y connais pas grand-chose."
    pt: "Não entendo muito do assunto."
    dica: "'Grand-chose' não pronuncia o 'd' (/gʁɑ̃.ʃoz/)."
  - fr: "Vous pourriez m'en proposer un, pas trop fort ?"
    pt: "Poderia me propor um, não muito forte?"
    dica: "'Trop' termina em /o/ sem 'p' (/tʁo/), e 'fort' termina em /ʁ/ sem 't' (/fɔʁ/)."
  - fr: "Il est plus doux que le comté."
    pt: "Ele é mais suave que o comté."
    dica: "'Doux' tem 'x' mudo (/du/); 'comté' tem 'm' nasal e 'p' mudo (/kɔ̃.te/)."
  - fr: "Nous nous sommes arrêtés pour boire un café."
    pt: "Paramos para tomar um café."
    dica: "Liaison suave em 'sommes arrêtés' (/sɔm.za.ʁɛ.te/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Celles-ci, elles sont plus sucrées que celles-là ?"
        pt: "Estas são mais doces do que aquelas?"
      - fr: "Vous en voulez combien ? Un kilo, s'il vous plaît."
        pt: "Quantas o senhor quer? Um quilo, por favor."
      - fr: "Je n'y connais pas grand-chose. Vous pourriez m'en proposer un, pas trop fort ?"
        pt: "Não entendo muito do assunto. Poderia me propor um, não muito forte?"
      - fr: "Je vais en prendre un morceau."
        pt: "Vou levar um pedaço."
      - fr: "Le marché était plus vivant que les magasins du centre."
        pt: "O mercado era mais movimentado do que as lojas do centro."

  - tipo: semaforo
    itens:
      - errado: "Je ne connais pas grand-chose de ça."
        certo: "Je n'y connais pas grand-chose."
        nota_pt: "A expressão idiomática para 'não entendo muito disso' usa o pronome y: je n'y connais pas grand-chose."
      - errado: "Vous voulez combien de pommes ?"
        certo: "Vous en voulez combien ?"
        nota_pt: "Quando o item já está no contexto, o pronome en antes do verbo evita repetir o substantivo."
      - errado: "Nous avons arrêté pour boire un café."
        certo: "Nous nous sommes arrêtés pour boire un café."
        nota_pt: "S'arrêter (parar) é pronominal e pede être + concordância no plural."
      - errado: "Je vais prendre un morceau."
        certo: "Je vais en prendre un morceau."
        nota_pt: "Com quantidade/parte (un morceau) sem o nome do produto depois, en é obrigatório antes do verbo."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Vous désirez ?"
        resposta: "Bonjour. Je voudrais des pommes, s'il vous plaît. Celles-ci, elles sont plus sucrées que celles-là ?"
      - pergunta: "Vous en voulez combien ?"
        resposta: "Un kilo, s'il vous plaît."
      - pergunta: "Comment demander conseil au fromager ?"
        resposta: "Je n'y connais pas grand-chose. Vous pourriez m'en proposer un, pas trop fort ?"
      - pergunta: "Celui-ci est plus doux que le comté."
        resposta: "Parfait. Je vais en prendre un morceau."

fala_livre:
  enunciado: "No mercado de rua, compare dois produtos, peça uma quantidade e peça conselho ao vendedor sobre algo que você conhece pouco antes de decidir o que levar."
  passos:
    - "Compare duas frutas ou produtos usando « celles-ci / celles-là » e « plus… que »."
    - "Peça um quilo ou um pedaço respondendo com « en »."
    - "Use « Je n'y connais pas grand-chose » + « Vous pourriez m'en proposer un… ? » e diga o que vai levar."
  criterio: "Comparação, quantidade e pedido de recomendação expressos com pronomes adequados."
  duracao_alvo_s: 60
