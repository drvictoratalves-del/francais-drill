id: "aula-20"
titulo: "Aula 20 — Uma ligação para reservar"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "4 · Serviços e Cidade (17–23)"
tipo: "aula"
ordem: 20
foco: "Reserva por telefone: pessoas, horário, nome e endereço"
notion_url: "https://app.notion.com/p/42205941420581409a53ec43dd4d9575"

cena:
  - "Un coup de fil pour réserver une table."
  - "Mardi après-midi, je voulais inviter Camille et un ami à elle, Thomas, au restaurant. Le soir, les salles se remplissent vite, alors j'ai décidé d'appeler avant. J'ai cherché le numéro, puis je me suis assis près de la fenêtre, avec un papier."
  - "Une femme a décroché : « Restaurant du Marché, bonjour. »"
  - "« Bonjour, madame. Je voudrais réserver une table pour ce soir, s'il vous plaît. Pourriez-vous me dire si vous avez encore de la place ? »"
  - "« Pour combien de personnes, et à quelle heure ? »"
  - "« Pour trois personnes, vers vingt heures. Si vingt heures n'est pas possible, on pourrait venir un peu plus tard. »"
  - "« À vingt heures, je n'ai plus de table près de la fenêtre. J'en ai une au fond, ou une autre à vingt heures trente, plus près de l'entrée. »"
  - "« La table de vingt heures trente me va mieux. Elle est aussi calme que l'autre ? »"
  - "« Un peu moins calme, mais tout à fait bien pour trois. Je vous la réserve au nom de… ? »"
  - "« Alves, A-L-V-E-S. Vous pourriez me confirmer l'adresse, s'il vous plaît ? »"
  - "« Bien sûr : 14, rue des Halles, en face du petit square. Vous y allez à pied, depuis le métro ? »"
  - "« Oui, je vais y aller à pied. Et si l'un de nous est en retard, je vous préviens ? »"
  - "« Oui, un petit appel suffit. Nous vous attendons à vingt heures trente. »"
  - "« Parfait, merci beaucoup. À ce soir ! »"
  - "« À ce soir, monsieur. »"
  - "J'ai raccroché et j'ai envoyé un message à Camille. Je lui ai donné l'heure et l'adresse, et je lui ai demandé de les transmettre à Thomas. Pour une fois, tout était clair avant de sortir."

