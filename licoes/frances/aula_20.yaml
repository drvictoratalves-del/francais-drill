pronuncia:
  - fr: "Je voudrais réserver une table pour ce soir, s'il vous plaît."
    pt: "Eu gostaria de reservar uma mesa para esta noite, por favor."
    dica: "Mantenha 'soir' em uma sílaba (/swaʁ/) e 'pour' com /u/ fechado."
  - fr: "Pourriez-vous me dire si vous avez encore de la place ?"
    pt: "Poderia me dizer se ainda tem lugar?"
    dica: "Liaison suave em 'vous avez encore' (/vu.za.ve.zɑ̃.kɔʁ/)."
  - fr: "Pour trois personnes, vers vingt heures."
    pt: "Para três pessoas, por volta das 20h."
    dica: "Em 'vingt heures', pronuncia-se o 't' na liaison (/vɛ̃.tœʁ/)."
  - fr: "J'en ai une au fond, ou une autre à vingt heures trente."
    pt: "Tenho uma no fundo, ou outra às 20h30."
    dica: "Liaison em 'J'en ai' (/ʒɑ̃.ne/); em 'fond', o 'd' é mudo (/fɔ̃/)."
  - fr: "La table de vingt heures trente me va mieux."
    pt: "A mesa das 20h30 fica melhor para mim."
    dica: "'Mieux' arredonda em /mjø/ sem 'x'."
  - fr: "Je vous la réserve au nom d'Alves."
    pt: "Reservo-a em nome de Alves."
    dica: "Pronuncie 'Alves' com clareza e soletre devagar se o atendente pedir."
  - fr: "Vous pourriez me confirmer l'adresse, s'il vous plaît ?"
    pt: "Poderia me confirmar o endereço, por favor?"
    dica: "'Adresse' termina com /s/ audível (/a.dʁɛs/)."
  - fr: "Si l'un de nous est en retard, je vous préviens."
    pt: "Se um de nós se atrasar, eu aviso."
    dica: "Em 'préviens', termina em nasal /vjɛ̃/ sem 's'."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je voudrais réserver une table pour ce soir, s'il vous plaît."
        pt: "Eu gostaria de reservar uma mesa para esta noite, por favor."
      - fr: "Pourriez-vous me dire si vous avez encore de la place ?"
        pt: "Poderia me dizer se ainda tem lugar?"
      - fr: "Si vingt heures n'est pas possible, on pourrait venir un peu plus tard."
        pt: "Se às vinte horas não for possível, poderíamos chegar um pouco mais tarde."
      - fr: "Je vous la réserve au nom d'Alves."
        pt: "Vou reservá-la em nome de Alves."
      - fr: "Si l'un de nous est en retard, je vous préviens."
        pt: "Se um de nós se atrasar, eu aviso."

  - tipo: semaforo
    itens:
      - errado: "À vingt heures, je n'ai plus de la table."
        certo: "À vingt heures, je n'ai plus de table près de la fenêtre."
        nota_pt: "Depois de ne… plus, usa-se apenas de sem artigo definido."
      - errado: "J'ai une au fond."
        certo: "J'en ai une au fond, ou une autre à vingt heures trente."
        nota_pt: "Para evitar repetir une table, o pronome en é obrigatório antes do verbo (j'en ai une)."
      - errado: "Je réserve elle au nom d'Alves."
        certo: "Je vous la réserve au nom d'Alves."
        nota_pt: "O objeto direto (la table) vai para antes do verbo como la (e não elle depois)."
      - errado: "J'ai donné à elle l'heure et l'adresse."
        certo: "Je lui ai donné l'heure et l'adresse."
        nota_pt: "Para 'a ela / a ele' (COI), use lui antes do auxiliar avoir."

  - tipo: producao
    itens:
      - pergunta: "Restaurant du Marché, bonjour."
        resposta: "Bonjour, madame. Je voudrais réserver une table pour ce soir, s'il vous plaît."
      - pergunta: "Pour combien de personnes, et à quelle heure ?"
        resposta: "Pour trois personnes, vers vingt heures."
      - pergunta: "Je vous la réserve au nom de… ?"
        resposta: "Alves. Vous pourriez me confirmer l'adresse, s'il vous plaît ?"
      - pergunta: "Vous y allez à pied, depuis le métro ?"
        resposta: "Oui, je vais y aller à pied."

fala_livre:
  enunciado: "Ligue para um restaurante para reservar mesa: informe número de pessoas e horário, negocie outro horário quando o primeiro não estiver disponível, confirme nome e endereço e pergunte sobre atraso."
  passos:
    - "Peça reserva dizendo para quantas pessoas e horário desejado."
    - "Aceite ou negocie alternativa usando « on pourrait venir… » ou « … me va mieux »."
    - "Confirme nome (soletrando), endereço e avise como fará em caso de atraso."
  criterio: "Reserva negociada ao telefone com nome, horário e endereço confirmados."
  duracao_alvo_s: 60
