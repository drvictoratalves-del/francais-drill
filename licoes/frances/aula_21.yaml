pronuncia:
  - fr: "C'était une très belle ville, plus grande que je ne le pensais."
    pt: "Era uma cidade muito bonita, maior do que eu pensava."
    dica: "Liaison em 'C'était une' (/se.tɛ.tyn/); 'ville' pronuncia /l/ claro (/vil/)."
  - fr: "Quand je suis arrivé, il faisait gris."
    pt: "Quando cheguei, estava cinzento."
    dica: "Em 'gris', o 's' final é mudo (/gʁi/)."
  - fr: "Les rues y étaient étroites, et les immeubles étaient plus anciens."
    pt: "As ruas lá eram estreitas, e os prédios eram mais antigos."
    dica: "Liaison /z/ em 'les immeubles' e /t/ em 'étaient étroites'."
  - fr: "En haut, la vue était magnifique."
    pt: "Lá em cima, a vista era magnífica."
    dica: "Em 'en haut', o 'h' é aspirado (sem liaison com o 'n'); 'vue' termina em /y/."
  - fr: "J'en ai trouvé un, et j'y ai mangé une salade."
    pt: "Encontrei um, e lá comi uma salada."
    dica: "Contraste rápido entre 'j'en ai' (/ʒɑ̃.ne/) e 'j'y ai' (/ʒi.e/)."
  - fr: "La prochaine fois, je voudrais y passer une journée entière."
    pt: "Da próxima vez, eu gostaria de passar lá um dia inteiro."
    dica: "'Fois' termina em /wa/ sem 's'; 'entière' termina com /ʁ/ audível."
  - fr: "On pourrait même y aller ensemble."
    pt: "Poderíamos até ir lá juntos."
    dica: "'Ensemble' termina em /ɑ̃bl/ suave sem vogal extra."
  - fr: "J'y étais allé en train."
    pt: "Eu tinha ido lá de trem."
    dica: "Liaison em 'étais allé' (/e.tɛ.za.le/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "C'était une très belle ville, plus grande que je ne le pensais."
        pt: "Era uma cidade muito bonita, maior do que eu pensava."
      - fr: "Quand je suis arrivé, il faisait gris, et il y avait un peu de vent."
        pt: "Quando cheguei, estava cinzento, e havia um pouco de vento."
      - fr: "Les rues y étaient étroites, et les immeubles étaient plus anciens."
        pt: "As ruas lá eram estreitas, e os prédios eram mais antigos."
      - fr: "J'en ai trouvé un, et j'y ai mangé une salade."
        pt: "Encontrei um, e lá comi uma salada."
      - fr: "La prochaine fois, je voudrais y passer une journée entière."
        pt: "Da próxima vez, eu gostaria de passar lá um dia inteiro."

  - tipo: semaforo
    itens:
      - errado: "Quand je suis arrivé, il a fait gris."
        certo: "Quand je suis arrivé, il faisait gris, et il y avait un peu de vent."
        nota_pt: "O tempo e o cenário no momento da chegada vão sempre no imparfait (il faisait gris)."
      - errado: "Telle que je l'ai vu, la ville était belle."
        certo: "Lyon, telle que je l'ai vue."
        nota_pt: "Quando o COD feminino (l' = la ville) antecede o verbo com avoir, o particípio concorda: vue."
      - errado: "J'ai trouvé un restaurant et j'ai mangé là."
        certo: "J'en ai trouvé un, et j'y ai mangé une salade."
        nota_pt: "Use en para retomar o restaurante indefinido (encontrei um) e y para o lugar (comi lá)."
      - errado: "Je suis allé là avant."
        certo: "J'y étais allé en train."
        nota_pt: "Para uma visita anterior ao momento da conversa, o plus-que-parfait (étais allé) marca o passado antes do passado."

  - tipo: producao
    itens:
      - pergunta: "Alors, Lyon, c'était comment ?"
        resposta: "C'était une très belle ville, plus grande que je ne le pensais."
      - pergunta: "Il faisait quel temps quand vous êtes arrivé ?"
        resposta: "Quand je suis arrivé, il faisait gris, et il y avait un peu de vent."
      - pergunta: "Vous avez trouvé un restaurant typique ?"
        resposta: "J'en ai trouvé un, et j'y ai mangé une salade."
      - pergunta: "Vous y retournerez ?"
        resposta: "La prochaine fois, je voudrais y passer une journée entière."

fala_livre:
  enunciado: "Descreva uma cidade que visitou (real ou fictícia): combine o cenário no imparfait, o que fez no passé composé e o que gostaria de rever usando y/en e pelo menos duas comparações."
  passos:
    - "Descreva clima, ruas e prédios no imparfait (« Il faisait… », « Les rues étaient… »)."
    - "Conte 2 ou 3 ações da visita no passé composé usando « y » ou « en »."
    - "Faça duas comparações (« plus grand que », « meilleur que ») e diga o que gostaria de fazer na próxima vez."
  criterio: "Alternância clara entre imparfait e passé composé, com comparações e pronomes y/en."
  duracao_alvo_s: 70
