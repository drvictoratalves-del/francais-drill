id: "aula-21"
titulo: "Aula 21 — Descrever uma cidade no passado"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "4 · Serviços e Cidade (17–23)"
tipo: "aula"
ordem: 21
foco: "Descrever cidade no passado: imparfait, passé composé e planos"
notion_url: "https://app.notion.com/p/42205941420581788da9dbd171e5ecbe"

cena:
  - "Lyon, telle que je l'ai vue."
  - "L'autre jour, Camille m'a demandé ce que j'avais vu à Lyon. J'y étais allé en train, un après-midi, et je m'en souvenais très bien. Je lui ai raconté ça un peu plus lentement que d'habitude."
  - "« Alors, Lyon, c'était comment ? »"
  - "« C'était une très belle ville, plus grande que je ne le pensais, mais pas trop difficile à visiter à pied. Quand je suis arrivé, il faisait gris, et il y avait un peu de vent. J'ai d'abord marché dans la vieille ville. Les rues y étaient étroites, et les immeubles étaient plus anciens que dans le centre de Paris. J'y ai pris beaucoup de photos. »"
  - "« Vous y êtes resté longtemps ? »"
  - "« Environ trois heures, là-bas. Ensuite, je suis monté sur la colline. En haut, la vue était magnifique : on voyait le fleuve, les toits, et au loin les collines. Je m'y suis arrêté un long moment. Après, j'ai cherché un petit restaurant typique. J'en ai trouvé un, pas cher, et j'y ai mangé une salade. Elle était meilleure que celle de la veille. »"
  - "« Et les gens, ils étaient comment ? »"
  - "« Très gentils. À la gare, un employé m'a indiqué le chemin, et au restaurant, le serveur m'a expliqué un plat que je ne connaissais pas. Je lui ai demandé de répéter, et il l'a fait avec le sourire. »"
  - "« Vous y retournerez ? »"
  - "« Oui, je pense. La prochaine fois, je voudrais y passer une journée entière, et voir aussi un musée. Si le temps est meilleur, on pourrait même y aller ensemble. »"
  - "« Pourquoi pas ? Vous m'en parlez si bien que j'ai envie d'y retourner, moi aussi. »"
  - "En racontant, j'ai compris que je pouvais déjà décrire une ville au passé : ce que je voyais, ce que j'ai fait, et ce que je voudrais revoir."

