pronuncia:
  - fr: "C'est plus froid que hier, et il pleut déjà."
    pt: "Está mais frio do que ontem, e já está chovendo."
    dica: "'Froid' termina em /wa/ sem 'd' (/fʁwa/); 'pleut' fecha em /ø/ sem 't'."
  - fr: "On pourrait changer de programme, non ?"
    pt: "Poderíamos mudar de programa, não?"
    dica: "'Pourrait' termina em /ɛ/ fechado sem 't' (/pu.ʁɛ/)."
  - fr: "Pourriez-vous passer me prendre à l'hôtel à onze heures ?"
    pt: "Poderia passar para me buscar no hotel às onze?"
    dica: "Em 'à onze heures', não há elisão antes de 'onze' (/a.ɔ̃.zœʁ/)."
  - fr: "N'oubliez pas un parapluie. Le mien est trop petit pour deux."
    pt: "Não esqueça um guarda-chuva. O meu é pequeno demais para dois."
    dica: "Em 'parapluie', destaque o /y/ + /i/ (/pa.ʁa.plɥi/)."
  - fr: "J'en ai un, dans mon sac."
    pt: "Eu tenho um, na minha bolsa."
    dica: "Liaison /n/ em 'J'en ai' (/ʒɑ̃.ne/)."
  - fr: "À tout à l'heure !"
    pt: "Até daqui a pouco!"
    dica: "Fale ligado e fluido: /a.tu.ta.lœʁ/."
  - fr: "Quand nous sommes sortis, il ne pleuvait plus."
    pt: "Quando saímos, não chovia mais."
    dica: "Em 'sortis', o 's' é mudo; em 'il ne pleuvait plus', 'plus' no fim de frase negativa costuma soar /ply/."
  - fr: "Si ça recommence, on se réfugie dans un café."
    pt: "Se recomeçar, a gente se abriga num café."
    dica: "'Réfugie' tem /y/ na segunda sílaba (/ʁe.fy.ʒi/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "C'est plus froid que hier, et il pleut déjà."
        pt: "Está mais frio do que ontem, e já está chovendo."
      - fr: "On pourrait changer de programme, non ?"
        pt: "Poderíamos mudar de programa, não?"
      - fr: "Pourriez-vous passer me prendre à l'hôtel à onze heures ?"
        pt: "Poderia passar para me buscar no hotel às onze?"
      - fr: "J'en ai un, dans mon sac."
        pt: "Eu tenho um, na minha bolsa."
      - fr: "Si ça recommence, on se réfugie dans un café."
        pt: "Se recomeçar, a gente se abriga num café."

  - tipo: semaforo
    itens:
      - errado: "J'ai un dans mon sac."
        certo: "J'en ai un, dans mon sac."
        nota_pt: "Quando un está sem substantivo depois (um guarda-chuva), o pronome en é obrigatório antes do verbo."
      - errado: "Nous avons restés presque deux heures."
        certo: "Nous y sommes restés presque deux heures."
        nota_pt: "Rester faz o passé composé com être + concordância no plural (restés) + y para o lugar."
      - errado: "Quand nous sommes sortis, il n'a pas pleuvait plus."
        certo: "Quand nous sommes sortis, il ne pleuvait plus."
        nota_pt: "Para ação contínua de clima no passado em andamento, usa-se o imparfait simples: il ne pleuvait plus."
      - errado: "Il y avait moins que monde qu'un jour de soleil."
        certo: "Il y avait moins de monde qu'un jour de soleil."
        nota_pt: "Para comparar quantidades com substantivo (menos gente), usa-se moins de + substantivo + que."

  - tipo: producao
    itens:
      - pergunta: "Vous avez vu le temps ?"
        resposta: "Oui, je l'ai vu. C'est plus froid que hier, et il pleut déjà."
      - pergunta: "On pourrait changer de programme, non ?"
        resposta: "On va au musée ? Il sera plus intéressant s'il pleut toute la journée."
      - pergunta: "N'oubliez pas un parapluie."
        resposta: "J'en ai un, dans mon sac."
      - pergunta: "On va rentrer, ou on tente une petite tour dans le parc ?"
        resposta: "Une petite tour, seulement. Si ça recommence, on se réfugie dans un café."

fala_livre:
  enunciado: "Um passeio ao ar livre é cancelado pela chuva. Ligue para a outra pessoa, descreva o clima com comparação, proponha um plano B e combine horário, ponto de encontro e alternativa se o tempo abrir."
  passos:
    - "Descreva a mudança de clima comparando com ontem (« plus froid que », « il pleut »)."
    - "Proponha um plano B coberto com « on pourrait… » e combine horário."
    - "Acrescente uma alternativa caso o tempo melhore (« Si le temps s'améliore… »)."
  criterio: "Clima descrito, plano B negociado e combinação clara de horário e alternativa."
  duracao_alvo_s: 60
