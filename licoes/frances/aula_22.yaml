id: "aula-22"
titulo: "Aula 22 — O tempo e os planos"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "4 · Serviços e Cidade (17–23)"
tipo: "aula"
ordem: 22
foco: "Clima e mudança de programa: negociar plano B"
notion_url: "https://app.notion.com/p/422059414205814ca63bc99a2b63734b"

cena:
  - "Le temps change, les plans aussi."
  - "Hier soir, Camille et moi, nous avions un plan pour aujourd'hui : une longue promenade le long de la rivière, puis un pique-nique dans le parc. Le temps était beau depuis trois jours, plus doux que la semaine dernière, et nous pensions qu'il allait rester comme ça."
  - "Mais ce matin, en ouvrant la fenêtre, j'ai vu le ciel. Il était gris, et le vent était plus fort qu'hier. Il a même commencé à pleuvoir, juste après le petit-déjeuner."
  - "Camille m'a appelé : « Vous avez vu le temps ? On ne va pas pouvoir pique-niquer, je crois. »"
  - "« Oui, je l'ai vu. C'est plus froid que hier, et il pleut déjà. On pourrait changer de programme, non ? »"
  - "« Oui. On va au musée ? Il sera plus intéressant s'il pleut toute la journée. »"
  - "« D'accord. Pourriez-vous passer me prendre à l'hôtel à onze heures ? »"
  - "« Oui, je vais passer vous prendre. N'oubliez pas un parapluie. Le mien est trop petit pour deux. »"
  - "« J'en ai un, dans mon sac. Et si le temps s'améliore cet après-midi, on pourra encore marcher un peu. »"
  - "« D'accord. On verra ça à la sortie. À tout à l'heure ! »"
  - "À onze heures, elle était en bas, avec un manteau plus chaud que le mien. Nous sommes allés au musée à pied, sous la pluie. À l'intérieur, il faisait bon, et il y avait moins de monde qu'un jour de soleil. Nous y sommes restés presque deux heures. Quand nous sommes sortis, il ne pleuvait plus."
  - "« On va rentrer, ou on tente une petite tour dans le parc ? »"
  - "« Une petite tour, seulement. Si ça recommence, on se réfugie dans un café. »"
  - "Nous l'avons fait, et le parc, après la pluie, sentait l'herbe. Le pique-nique, lui, attendrait un jour meilleur."

