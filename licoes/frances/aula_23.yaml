id: "aula-23"
titulo: "Aula 23 — Uma reclamação no hotel"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "4 · Serviços e Cidade (17–23)"
tipo: "aula"
ordem: 23
foco: "Reclamação no hotel: explicar problema com calma e confirmar solução"
notion_url: "https://app.notion.com/p/42205941420581f3b6dedc8e90c233bf"

cena:
  - "Une réclamation à la réception."
  - "La deuxième nuit, je n'ai presque pas dormi. Le chauffage de ma chambre ne fonctionnait pas bien : il faisait plus froid que dans le couloir, et le radiateur faisait un bruit assez fort. En plus, le Wi-Fi se coupait toutes les dix minutes. Ce n'était pas ce que j'avais réservé."
  - "Le lendemain matin, je suis descendu à la réception. Je voulais expliquer le problème calmement. Un monsieur m'a demandé : « Bonjour. Je peux vous aider ? »"
  - "« Bonjour. Oui, s'il vous plaît. Je suis M. Alves, chambre 214. Je voudrais vous signaler un problème. Pourriez-vous m'écouter un moment ? »"
  - "« Bien sûr. Qu'est-ce qui ne va pas ? »"
  - "« Le chauffage ne marche pas très bien, et le radiateur fait du bruit depuis hier soir. Il fait plus froid dans ma chambre que dans le couloir. En plus, le Wi-Fi se coupe souvent. J'ai essayé de le relancer, mais ça recommence. »"
  - "« Je suis désolé. Vous voulez que nous envoyions quelqu'un, ou vous préférez changer de chambre ? Nous en avons une au troisième étage, un peu plus grande, et plus calme. »"
  - "« Je vais plutôt changer, si c'est possible. Vous pourriez me donner la clé tout de suite ? »"
  - "« Oui. Je vais aussi faire une remise sur la nuit d'hier. Vous n'aurez qu'à descendre vos affaires. L'ascenseur est toujours à gauche. »"
  - "« Merci beaucoup. Et le Wi-Fi, dans cette chambre-là, il fonctionne mieux ? »"
  - "« Oui, on l'a vérifié ce matin. Si ce n'est pas le cas, vous revenez me voir, et nous trouverons autre chose. »"
  - "« Parfait. Je vais y monter tout de suite. Merci beaucoup. »"
  - "J'ai remonté mon sac et j'ai ouvert la nouvelle chambre. Elle était plus claire, plus chaude, et tout à fait silencieuse. Le soir, j'ai enfin bien dormi."

vocabulario:
  - fr: "une réclamation"
    pt: "uma reclamação"
  - fr: "le chauffage"
    pt: "o aquecimento"
  - fr: "le radiateur"
    pt: "o aquecedor / radiador"
  - fr: "le couloir"
    pt: "o corredor"
  - fr: "un bruit"
    pt: "um barulho"
  - fr: "se couper"
    pt: "cair / desconectar-se"
  - fr: "signaler un problème"
    pt: "relatar um problema"
  - fr: "relancer"
    pt: "reiniciar"
  - fr: "changer de chambre"
    pt: "trocar de quarto"
  - fr: "une remise"
    pt: "um desconto"
  - fr: "vos affaires"
    pt: "suas coisas"
  - fr: "silencieuse"
    pt: "silenciosa"

pronuncia:
  - fr: "Je voudrais vous signaler un problème."
    pt: "Eu gostaria de relatar um problema."
    dica: "Em 'signaler', o 'gn' soa como 'nh' (/si.ɲa.le/)."
  - fr: "Pourriez-vous m'écouter un moment ?"
    pt: "O senhor poderia me ouvir um momento?"
    dica: "'Pourriez' fecha com /e/ sem 'z' (/pu.ʁje/); ligue 'm'écouter un' suavemente."
  - fr: "Qu'est-ce qui ne va pas ?"
    pt: "O que há de errado?"
    dica: "Fale 'qu'est-ce qui' como /kɛs.ki/ bem rápido e natural."
  - fr: "Le chauffage ne marche pas très bien."
    pt: "O aquecimento não está funcionando muito bem."
    dica: "'Chauffage' tem /o/ fechado e /ʒ/ suave no fim (/ʃo.faʒ/)."
  - fr: "J'ai essayé de le relancer, mais ça recommence."
    pt: "Tentei reiniciar, mas recomeça."
    dica: "Em 'essayé', os dois 'y' viram /j/ (/e.sɛ.je/)."
  - fr: "Vous préférez changer de chambre ?"
    pt: "O senhor prefere trocar de quarto?"
    dica: "'Chambre' tem nasal /ɑ̃/ e 'r' suave antes do 'e' mudo (/ʃɑ̃bʁ/)."
  - fr: "Je vais plutôt changer, si c'est possible."
    pt: "Vou preferir trocar, se for possível."
    dica: "'Plutôt' combina /y/ na primeira sílaba e /o/ fechado na segunda (/ply.to/)."
  - fr: "Je vais aussi faire une remise sur la nuit d'hier."
    pt: "Também vou dar um desconto na diária de ontem."
    dica: "Em 'nuit d'hier', 'nuit' tem /ɥi/ (/nɥi/) sem 't', e 'hier' pronuncia o 'r' final (/jɛʁ/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je voudrais vous signaler un problème."
        pt: "Eu gostaria de relatar um problema."
      - fr: "Le chauffage ne marche pas très bien, et le radiateur fait du bruit."
        pt: "O aquecimento não funciona muito bem, e o aquecedor faz barulho."
      - fr: "En plus, le Wi-Fi se coupe souvent."
        pt: "Além disso, o Wi-Fi cai com frequência."
      - fr: "Je vais plutôt changer, si c'est possible."
        pt: "Vou preferir trocar, se for possível."
      - fr: "Et le Wi-Fi, dans cette chambre-là, il fonctionne mieux ?"
        pt: "E o Wi-Fi, naquele quarto lá, funciona melhor?"

  - tipo: semaforo
    itens:
      - errado: "Je veux changer la chambre."
        certo: "Je voudrais changer de chambre."
        nota_pt: "Trocar de algo usa changer de + substantivo sem artigo; je voudrais é mais polido na recepção."
      - errado: "Il fait plus froid que dans le couloir hier."
        certo: "Il faisait plus froid que dans le couloir."
        nota_pt: "Para descrever condição contínua de ambiente no passado, usa-se o imparfait (il faisait)."
      - errado: "Le Wi-Fi a coupé toutes les dix minutes."
        certo: "Le Wi-Fi se coupait toutes les dix minutes."
        nota_pt: "Ação repetida ou habitual no passado pede imparfait e o verbo pronominal se couper."
      - errado: "Je vais monter tout de suite."
        certo: "Je vais y monter tout de suite."
        nota_pt: "Quando o lugar já foi citado (o novo quarto), o pronome y é necessário antes do infinitivo: je vais y monter."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Je peux vous aider ?"
        resposta: "Bonjour. Je voudrais vous signaler un problème dans ma chambre."
      - pergunta: "Qu'est-ce qui ne va pas ?"
        resposta: "Le chauffage ne marche pas très bien et le Wi-Fi se coupe souvent."
      - pergunta: "Vous voulez que nous envoyions quelqu'un, ou vous préférez changer de chambre ?"
        resposta: "Je vais plutôt changer, si c'est possible. Vous pourriez me donner la clé tout de suite ?"
      - pergunta: "Si ce n'est pas le cas, vous revenez me voir."
        resposta: "Parfait. Je vais y monter tout de suite. Merci beaucoup."

fala_livre:
  enunciado: "Você dormiu mal no hotel porque o aquecimento não funcionava e o Wi-Fi caía. Vá até a recepção, explique o problema com calma, peça para trocar de quarto e confirme se tudo funciona no novo quarto."
  passos:
    - "Cumprimente com educação, diga seu quarto e anuncie o problema (« Je voudrais vous signaler un problème »)."
    - "Descreva os dois defeitos com calma (aquecimento/frio e Wi-Fi caindo)."
    - "Aceite a troca de quarto, pergunte sobre o Wi-Fi no novo quarto e agradeça."
  criterio: "Reclamação polida, descrição clara dos problemas e confirmação da solução."
  duracao_alvo_s: 60
