id: "aula-24"
titulo: "Aula 24 — Um jantar com amigos"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "5 · Situações Complexas e Balanço (24–30)"
tipo: "aula"
ordem: 24
foco: "Jantar com amigos: escolher pratos, conversar e dividir conta"
notion_url: "https://app.notion.com/p/4220594142058198bd95d07502b00cd2"

cena:
  - "Un dîner avec Camille et Thomas."
  - "Le soir de la réservation, je suis arrivé un peu plus tôt que vingt heures trente. Le restaurant était déjà bien rempli, mais moins bruyant que je ne le craignais. On m'a conduit à notre table, près de l'entrée. Quelques minutes plus tard, Camille est arrivée, et Thomas un peu après elle. Je me suis levé pour les saluer."
  - "« Bonsoir ! Vous avez trouvé facilement ? »"
  - "« Oui, grâce à votre message. C'est plus simple que l'autre restaurant, près de la gare », a dit Camille."
  - "Thomas a souri : « Moi, je connais un peu le quartier. J'y viens souvent. »"
  - "Nous avons regardé la carte. Il y avait plus de choix que dans un bistrot, mais les prix n'étaient pas trop élevés. J'ai demandé : « Vous savez ce que vous allez prendre ? Moi, je voudrais un poisson. Et vous, Camille, vous en prenez un aussi ? »"
  - "« Non, je vais plutôt prendre les pâtes. Et comme entrée, on pourrait partager une salade. »"
  - "« Très bien. Thomas, vous en voulez aussi ? »"
  - "« Oui, avec plaisir. Et pour boire, une carafe d'eau et un verre de vin rouge, ça vous va ? »"
  - "Nous avons commandé, puis nous avons parlé de la semaine. Le serveur nous a apporté les plats assez vite. Le mien était un peu meilleur que celui de l'autre jour. Thomas m'a demandé si je m'habituais à la ville."
  - "« Oui, de plus en plus. Au début, je demandais mon chemin tout le temps. Maintenant, j'y vais plus souvent tout seul. »"
  - "« C'est normal. La prochaine fois, on pourrait se revoir, même sans grande occasion. »"
  - "À la fin, j'ai demandé l'addition, et nous l'avons partagée. Dehors, il faisait frais, mais le ciel était clair. Nous avons marché jusqu'au métro ensemble. C'était un très bon soir, plus simple que je ne l'avais imaginé."

vocabulario:
  - fr: "bien rempli"
    pt: "bem cheio"
  - fr: "bruyant"
