pronuncia:
  - fr: "Bonsoir ! Vous avez trouvé facilement ?"
    pt: "Boa noite! Vocês encontraram facilmente?"
    dica: "Liaison /z/ em 'Vous avez' (/vu.za.ve/); 'facilement' fecha em /mɑ̃/."
  - fr: "C'est plus simple que l'autre restaurant, près de la gare."
    pt: "É mais simples que o outro restaurante, perto da estação."
    dica: "Antes de consoante, 'plus' comparativo costuma perder o 's' (/ply sɛ̃pl/)."
  - fr: "Moi, je connais un peu le quartier. J'y viens souvent."
    pt: "Eu conheço um pouco o bairro. Venho aqui com frequência."
    dica: "Em 'souvent', o 't' final é mudo (/su.vɑ̃/)."
  - fr: "Et vous, Camille, vous en prenez un aussi ?"
    pt: "E você, Camille, vai pedir um também?"
    dica: "Liaison /z/ em 'vous en' (/vu.zɑ̃/) e 'un aussi' (/œ̃.no.si/)."
  - fr: "Et comme entrée, on pourrait partager une salade."
    pt: "E de entrada, poderíamos dividir uma salada."
    dica: "Liaison em 'on pourrait' não existe, mas faça 'comme entrée' ligado (/kɔ.mɑ̃.tʁe/)."
  - fr: "Le mien était un peu meilleur que celui de l'autre jour."
    pt: "O meu estava um pouco melhor do que o do outro dia."
    dica: "'Meilleur' termina com /jœʁ/ suave (/mɛ.jœʁ/)."
  - fr: "Oui, de plus en plus."
    pt: "Sim, cada vez mais."
    dica: "No primeiro 'plus', o 's' é mudo; no segundo, pronuncia-se (/də.ply.zɑ̃.plys/)."
  - fr: "À la fin, j'ai demandé l'addition, et nous l'avons partagée."
    pt: "No fim, pedi a conta, e nós a dividimos."
    dica: "'Addition' soa /a.di.sjɔ̃/; em 'l'avons', faça o /v/ bem nítido."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Vous savez ce que vous allez prendre ?"
        pt: "Vocês sabem o que vão pedir?"
      - fr: "Et comme entrée, on pourrait partager une salade."
        pt: "E de entrada, poderíamos dividir uma salada."
      - fr: "Une carafe d'eau et un verre de vin rouge, ça vous va ?"
        pt: "Uma jarra de água e uma taça de vinho tinto, está bom para vocês?"
      - fr: "Le mien était un peu meilleur que celui de l'autre jour."
        pt: "O meu estava um pouco melhor do que o do outro dia."
      - fr: "La prochaine fois, on pourrait se revoir, même sans grande occasion."
        pt: "Da próxima vez, poderíamos nos ver de novo, mesmo sem grande ocasião."

  - tipo: semaforo
    itens:
      - errado: "Vous prenez un poisson aussi ?"
        certo: "Vous en prenez un aussi ?"
        nota_pt: "Com quantidade numérica (un) retomando um substantivo já citado (un poisson), usa-se en antes do verbo."
      - errado: "Le mien était plus bon que celui de l'autre jour."
        certo: "Le mien était meilleur que celui de l'autre jour."
        nota_pt: "O comparativo de bon é sempre meilleur (nunca plus bon)."
      - errado: "À la fin, j'ai demandé la compte."
        certo: "À la fin, j'ai demandé l'addition."
        nota_pt: "Em restaurante, a conta é l'addition (feminino)."
      - errado: "Nous avons partagé elle."
        certo: "Nous l'avons partagée."
        nota_pt: "O pronome objeto direto l' (la) vem antes do auxiliar avoir, e o particípio concorda no feminino (partagée)."

  - tipo: producao
    itens:
      - pergunta: "Bonsoir ! Vous avez trouvé facilement ?"
        resposta: "Oui, grâce à votre message. C'est plus simple que l'autre restaurant."
      - pergunta: "Vous savez ce que vous allez prendre ?"
        resposta: "Moi, je voudrais un poisson. Et comme entrée, on pourrait partager une salade."
      - pergunta: "Une carafe d'eau et un verre de vin rouge, ça vous va ?"
        resposta: "Oui, avec plaisir. Ça me va très bien."
      - pergunta: "Vous vous habituez à la ville ?"
        resposta: "Oui, de plus en plus. Maintenant, j'y vais plus souvent tout seul."

fala_livre:
  enunciado: "Você está jantando com dois amigos num restaurante. Cumprimente-os, proponha dividir uma entrada, escolha seu prato principal e a bebida, comente como está se adaptando à cidade e combine de se verem de novo."
  passos:
    - "Pergunte se encontraram o restaurante fácil e olhem o cardápio juntos."
    - "Sugira compartilhar uma entrada (« on pourrait partager… ») e escolha seu prato e bebida."
    - "Comente que está se acostumando à cidade (« de plus en plus ») e sugira um próximo encontro."
  criterio: "Interação natural à mesa, escolhas de pedido completas e plano de reencontro."
  duracao_alvo_s: 60
