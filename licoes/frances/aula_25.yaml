pronuncia:
  - fr: "Je voudrais envoyer cette carte, et aussi ce colis, au Brésil."
    pt: "Eu gostaria de enviar este cartão, e também este pacote, para o Brasil."
    dica: "'Colis' termina em /i/ sem 's' (/kɔ.li/)."
  - fr: "Pour la carte, il vous faut un timbre international."
    pt: "Para o cartão, o senhor precisa de um selo internacional."
    dica: "'Timbre' tem vogal nasal /ɛ̃/ (/tɛ̃bʁ/)."
  - fr: "Vous l'avez déjà fermé ?"
    pt: "O senhor já o fechou?"
    dica: "Liaison /z/ em 'l'avez' → mantenha o 'l' e o /v/ ligados (/la.ve/)."
  - fr: "Voilà : quatre cent vingt grammes."
    pt: "Aqui está: quatrocentos e vinte gramas."
    dica: "Em 'vingt grammes', o 'gt' final de 'vingt' não soa (/vɛ̃ gʁam/)."
  - fr: "Vous voulez l'envoyer en suivi, ou en envoi simple ?"
    pt: "Quer enviar com rastreio ou envio simples?"
    dica: "'Suivi' começa com /sɥi/ suave (/sɥi.vi/)."
  - fr: "Ça fait vingt euros soixante."
    pt: "Dá vinte euros e sessenta."
    dica: "'Soixante' se pronuncia com /s/, nunca com /z/ (/swa.sɑ̃t/)."
  - fr: "Et le délai, c'est à peu près combien de jours ?"
    pt: "E o prazo, são mais ou menos quantos dias?"
    dica: "'À peu près' tem /ø/ em 'peu' e /ɛ/ aberto em 'près' (/a.pø.pʁɛ/)."
  - fr: "Voici le reçu, et le numéro de suivi."
    pt: "Aqui está o recibo e o número de rastreio."
    dica: "'Reçu' termina com /y/ claro (/ʁə.sy/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je voudrais envoyer cette carte, et aussi ce colis, au Brésil."
        pt: "Eu gostaria de enviar este cartão, e também este pacote, para o Brasil."
      - fr: "Pourriez-vous me dire comment faire, et combien ça coûte ?"
        pt: "A senhora poderia me dizer como fazer e quanto custa?"
      - fr: "Je vais prendre le suivi, alors. C'est plus sûr."
        pt: "Vou escolher o com rastreio, então. É mais seguro."
      - fr: "Et le délai, c'est à peu près combien de jours ?"
        pt: "E o prazo, são mais ou menos quantos dias?"
      - fr: "Le numéro est bien écrit ici ?"
        pt: "O número está bem visível/escrito aqui?"

  - tipo: semaforo
    itens:
      - errado: "Je voudrais envoyer ce colis pour le Brésil."
        certo: "Je voudrais envoyer ce colis au Brésil."
        nota_pt: "Para país masculino ao enviar algo ou ir, usa-se au (au Brésil), não pour."
      - errado: "Je veux l'envoi suivi parce que c'est plus sécurisé."
        certo: "Je vais prendre le suivi, alors. C'est plus sûr."
        nota_pt: "Para 'mais seguro / confiável', o adjetivo natural em francês é sûr."
      - errado: "Ça coûte combien en total ?"
        certo: "Ça fait combien, en tout ?"
        nota_pt: "Para perguntar o valor somado no balcão, usa-se Ça fait combien, en tout ?."
      - errado: "Le délai est entre huit et douze jours."
        certo: "En général, entre huit et douze jours."
        nota_pt: "Forma natural e idiomática no atendimento."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Je peux vous aider ?"
        resposta: "Bonjour, madame. Je voudrais envoyer cette carte et ce colis au Brésil."
      - pergunta: "Vous voulez l'envoyer en suivi, ou en envoi simple ?"
        resposta: "Je vais prendre le suivi, alors. C'est plus sûr. Ça fait combien, en tout ?"
      - pergunta: "Ça fait vingt euros soixante. Vous payez comment ?"
        resposta: "Par carte, s'il vous plaît. Et le délai, c'est à peu près combien de jours ?"
      - pergunta: "Voici le reçu, et le numéro de suivi."
        resposta: "Merci beaucoup. Le numéro est bien écrit ici ?"

fala_livre:
  enunciado: "Você foi aos correios enviar um cartão-postal e um pequeno pacote para o Brasil. Explique o que quer enviar, escolha o envio com rastreio, pergunte o preço total e o prazo em dias, pague e confirme onde está o número de rastreio."
  passos:
    - "Diga o que quer enviar e para qual país (« au Brésil »)."
    - "Escolha o envio com rastreio (« en suivi ») e pergunte o total."
    - "Pergunte o prazo em dias e confirme o número de rastreio no recibo."
  criterio: "Uso correto de au Brésil, choix de suivi, pergunta de total e prazo."
  duracao_alvo_s: 60
