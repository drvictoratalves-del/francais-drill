notion_url: "https://app.notion.com/p/4220594142058133b6dbfffe4b63de9f"

cena:
  - "Au bureau de poste, pour envoyer un colis."
  - "Depuis le musée, j'avais une carte postale, et aussi un petit colis pour ma famille. Ce matin, je suis allé au bureau de poste, un peu plus loin que la pharmacie. Il y avait une petite file, et j'ai attendu mon tour."
  - "Une employée m'a appelé : « Bonjour. Je peux vous aider ? »"
  - "« Bonjour, madame. Je voudrais envoyer cette carte, et aussi ce colis, au Brésil. Pourriez-vous me dire comment faire, et combien ça coûte ? »"
  - "« Bien sûr. Pour la carte, il vous faut un timbre international. Pour le colis, je dois d'abord le peser. Vous l'avez déjà fermé ? »"
  - "« Pas encore tout à fait. Je peux le fermer ici ? Il y a un livre et deux petites boîtes. »"
  - "« Oui, après le contrôle. Posez-le ici… Voilà : quatre cent vingt grammes. Vous voulez l'envoyer en suivi, ou en envoi simple ? Le suivi est un peu plus cher, mais vous pourrez le suivre en ligne. »"
  - "« Je vais prendre le suivi, alors. C'est plus sûr. Ça fait combien, en tout ? »"
  - "« La carte, deux euros vingt. Le colis, dix-huit euros quarante. Ça fait vingt euros soixante. Vous payez comment ? »"
  - "« Par carte, s'il vous plaît. Et le délai, c'est à peu près combien de jours ? »"
  - "« En général, entre huit et douze jours. Voici le reçu, et le numéro de suivi. Vous allez le garder. »"
  - "« Merci beaucoup. Le numéro est bien écrit ici ? »"
  - "« Oui, tout en bas. Si vous perdez le papier, vous pouvez aussi le retrouver avec la carte. »"
  - "« Parfait. Merci, bonne journée ! »"
  - "Dehors, j'ai glissé le reçu dans mon carnet. Pour une fois, une démarche administrative était plus simple que je ne le craignais."

