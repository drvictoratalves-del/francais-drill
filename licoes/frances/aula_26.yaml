pronuncia:
  - fr: "Je voudrais retirer de l'argent, s'il vous plaît."
    pt: "Eu gostaria de sacar dinheiro, por favor."
    dica: "Em 'retirer', o 'e' inicial é schwa (/ʁə.ti.ʁe/) e o 'r' final é mudo."
  - fr: "Le distributeur de dehors ne fonctionne pas."
    pt: "O caixa eletrônico lá de fora não está funcionando."
    dica: "'Dehors' soa /də.ɔʁ/ (o 's' final é mudo e o 'h' separa as vogais)."
  - fr: "Il y a des frais, dans mon cas ?"
    pt: "Há taxas, no meu caso?"
    dica: "'Frais' e 'cas' perdem a consoante final (/fʁɛ/, /ka/)."
  - fr: "Et je peux aussi changer un peu d'argent ?"
    pt: "E eu também posso trocar um pouco de dinheiro?"
    dica: "Liaison opcional em 'peux aussi'; mantenha o /ø/ fechado em 'peux' e 'peu'."
  - fr: "Pour le change, il faudrait aller à l'agence du centre."
    pt: "Para o câmbio, seria preciso ir à agência do centro."
    dica: "'Faudrait' termina em /ɛ/ sem 't' (/fo.dʁɛ/)."
  - fr: "Voici ma carte et mon passeport."
    pt: "Aqui estão meu cartão e meu passaporte."
    dica: "Em 'passeport', o 'e' medial cai e o 't' final é mudo (/pas.pɔʁ/)."
  - fr: "Et gardez le reçu, au cas où."
    pt: "E guarde o recibo, por via das dúvidas."
    dica: "'Au cas où' tem liaison suave ou separação clara /o.ka.u/."
  - fr: "Vous pourrez y revenir, si vous en avez encore besoin."
    pt: "O senhor poderá voltar aqui, se ainda precisar."
    dica: "Liaison /z/ em 'vous en avez' (/vu.zɑ̃.na.ve/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je voudrais retirer de l'argent, s'il vous plaît."
        pt: "Eu gostaria de sacar dinheiro, por favor."
      - fr: "Le distributeur de dehors ne fonctionne pas."
        pt: "O caixa eletrônico lá de fora não está funcionando."
      - fr: "Il y a des frais, dans mon cas ?"
        pt: "Há taxas, no meu caso?"
      - fr: "Et je peux aussi changer un peu d'argent, ou seulement retirer ?"
        pt: "E eu também posso trocar um pouco de dinheiro, ou só sacar?"
      - fr: "D'accord, je vais seulement retirer, alors. Voici ma carte et mon passeport."
        pt: "Tudo bem, vou apenas sacar, então. Aqui estão meu cartão e meu passaporte."

  - tipo: semaforo
    itens:
      - errado: "Je voudrais prendre d'argent."
        certo: "Je voudrais retirer de l'argent."
        nota_pt: "Sacar dinheiro em banco ou caixa é retirer de l'argent (com partitivo de l')."
      - errado: "Le distributeur dehors ne fonctionne pas."
        certo: "Le distributeur de dehors ne fonctionne pas."
        nota_pt: "Para especificar 'o caixa de fora', usa-se a preposição de: le distributeur de dehors."
      - errado: "Il y a des frais pour mon cas ?"
        certo: "Il y a des frais, dans mon cas ?"
        nota_pt: "Em francês diz-se dans mon cas ('no meu caso')."
      - errado: "Le distributeur devrait marcher encore cet après-midi."
        certo: "Le distributeur devrait marcher de nouveau cet après-midi."
        nota_pt: "Para 'voltar a funcionar / novamente', usa-se de nouveau (encore aqui significaria 'ainda')."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Qu'est-ce que je peux faire pour vous ?"
        resposta: "Bonjour. Je voudrais retirer de l'argent, s'il vous plaît. Le distributeur de dehors ne fonctionne pas."
      - pergunta: "Vous voulez retirer combien ?"
        resposta: "Deux cents euros, s'il vous plaît. Il y a des frais, dans mon cas ?"
      - pergunta: "Ça fait trois euros. Ça vous va ?"
        resposta: "Oui, ça me va. Et je peux aussi changer un peu d'argent, ou seulement retirer ?"
      - pergunta: "Comptez-les, s'il vous plaît. Et gardez le reçu, au cas où."
        resposta: "Merci beaucoup. Je vais les compter… Oui, c'est bon. Bonne journée !"

fala_livre:
  enunciado: "O caixa eletrônico da rua deu erro e você entrou no banco para sacar dinheiro no guichê. Explique o problema, informe o valor, pergunte se há taxa e se é possível fazer câmbio ali, apresente documento e finalize contando as notas."
  passos:
    - "Explique que quer sacar dinheiro no guichê porque o caixa de fora não funciona."
    - "Diga o valor e pergunte sobre taxas (« Il y a des frais, dans mon cas ? ») e câmbio."
    - "Entregue o cartão e o passaporte, confira as notas e agradeça."
  criterio: "Uso de retirer de l'argent, pergunta sobre taxas/câmbio e fechamento polido."
  duracao_alvo_s: 60
