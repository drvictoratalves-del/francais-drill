id: "aula-26"
titulo: "Aula 26 — No banco"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "5 · Situações Complexas e Balanço (24–30)"
tipo: "aula"
ordem: 26
foco: "Banco: atendimento no guichê quando o caixa não funciona"
notion_url: "https://app.notion.com/p/422059414205811e93e2c6d9bbe497c0"

cena:
  - "À la banque, pour retirer de l'argent."
  - "Après quelques jours, j'avais moins d'espèces que je ne le pensais. Plusieurs petits commerces préféraient les pièces et les billets, surtout au marché. Ce matin, je suis donc allé à une banque, près de la place. Devant, il y avait un distributeur, mais il affichait un message d'erreur. Je suis entré, et j'ai pris un ticket."
  - "Un conseiller m'a reçu assez vite : « Bonjour. Qu'est-ce que je peux faire pour vous ? »"
  - "« Bonjour. Je voudrais retirer de l'argent, s'il vous plaît. Le distributeur de dehors ne fonctionne pas. Pourriez-vous m'aider ? J'ai une carte internationale. »"
  - "« Oui, nous pouvons le faire au guichê, avec une pièce d'identité. Vous voulez retirer combien ? »"
  - "« Deux cents euros, s'il vous plaît. Il y a des frais, dans mon cas ? »"
  - "« Oui, il y a des frais, plus élevés que pour un client de la banque. Ça fait trois euros. Ça vous va ? »"
  - "« Oui, ça me va. Et je peux aussi changer un peu d'argent, ou seulement retirer ? »"
  - "« Aujourd'hui, seulement retirer, ici. Pour le change, il faudrait aller à l'agence du centre, plus grande que celle-ci. »"
  - "« D'accord, je vais seulement retirer, alors. Voici ma carte et mon passeport. »"
  - "Il a vérifié les documents, puis il m'a demandé de taper mon code, un peu à l'écart. Ensuite, il m'a tendu les billets et un reçu."
  - "« Comptez-les, s'il vous plaît. Et gardez le reçu, au cas où. Le distributeur devrait marcher de nouveau cet après-midi. Vous pourrez y revenir, si vous en avez encore besoin. »"
  - "« Merci beaucoup. Je vais les compter… Oui, c'est bon. Bonne journée ! »"
  - "Je suis ressorti un peu soulagé. La démarche avait pris plus de temps qu'un simple distributeur, mais au moins, le problème était réglé."

