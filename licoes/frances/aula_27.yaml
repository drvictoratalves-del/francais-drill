pronuncia:
  - fr: "Bonjour. Vous avez rendez-vous ?"
    pt: "Bom dia. O senhor tem hora marcada?"
    dica: "'Rendez-vous' termina com /u/ sem 'z' nem 's' (/ʁɑ̃.de.vu/)."
  - fr: "Je voudrais voir un médecin, s'il vous plaît, pour un mal de gorge."
    pt: "Eu gostaria de consultar um médico, por favor, por uma dor de garganta."
    dica: "'Médecin' tem o 'e' medial bem curto e nasal /ɛ̃/ no final (/med.sɛ̃/)."
  - fr: "Pourriez-vous me prendre aujourd'hui ?"
    pt: "Poderiam me atender hoje?"
    dica: "'Aujourd'hui' tem /ɥi/ no fim, sem pronunciar o 'd' (/o.ʒuʁ.dɥi/)."
  - fr: "Le docteur peut vous recevoir dans une demi-heure."
    pt: "O doutor pode atendê-lo em meia hora."
    dica: "Em 'dans une', faça a liaison /z/ (/dɑ̃.zyn/)."
  - fr: "Depuis quelques jours, pas de fièvre, mais une toux."
    pt: "Há alguns dias, sem febre, mas com tosse."
    dica: "'Toux' soa /tu/ (sem 'x'); 'depuis' termina em /ɥi/ sem 's'."
  - fr: "Il valait mieux me reposer."
    pt: "Era melhor eu descansar."
    dica: "'Mieux' fecha em /ø/ sem 'x' (/mjø/)."
  - fr: "Je vais vous donner une ordonnance, pour la pharmacie."
    pt: "Vou lhe dar uma receita, para a farmácia."
    dica: "'Ordonnance' termina em /ɑ̃s/ (/ɔʁ.dɔ.nɑ̃s/)."
  - fr: "Je n'avais pas tout compris du premier coup."
    pt: "Eu não tinha entendido tudo de primeira."
    dica: "'Coup' soa /ku/, com 'p' totalmente mudo."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je voudrais voir un médecin, s'il vous plaît, pour un mal de gorge."
        pt: "Eu gostaria de consultar um médico, por favor, por uma dor de garganta."
      - fr: "Pourriez-vous me prendre aujourd'hui ?"
        pt: "Poderiam me atender hoje?"
      - fr: "Depuis quelques jours, pas de fièvre, mais une toux."
        pt: "Há alguns dias, sem febre, mas com tosse."
      - fr: "Je vais aller à la pharmacie tout de suite, et je vais rester au calme."
        pt: "Vou à farmácia agora mesmo e vou ficar em repouso."
      - fr: "Vous pourriez répéter la dernière phrase, s'il vous plaît ?"
        pt: "Poderia repetir a última frase, por favor?"

  - tipo: semaforo
    itens:
      - errado: "Je suis avec un mal de gorge."
        certo: "J'ai mal à la gorge."
        nota_pt: "Para expressar dor no corpo, usa-se avoir mal à + parte do corpo (j'ai mal à la gorge)."
      - errado: "Depuis quand vous avez mal ?"
        certo: "Depuis quand avez-vous mal ?"
        nota_pt: "Em perguntas formais ou com inversão, o verbo vem antes do sujeito ou usa-se est-ce que."
      - errado: "Je vais rester calme cet après-midi."
        certo: "Je vais rester au calme cet après-midi."
        nota_pt: "Para dizer 'ficar em repouso / num lugar tranquilo', a expressão é rester au calme."
      - errado: "Il a dit que je devais me reposer."
        certo: "Il m'a dit qu'il valait mieux me reposer."
        nota_pt: "Dire à quelqu'un pede o pronome indireto antes do verbo (il m'a dit)."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Vous avez rendez-vous ?"
        resposta: "Bonjour, madame. Non, pas encore. Je voudrais voir un médecin pour un mal de gorge."
      - pergunta: "Vous avez une pièce d'identité ?"
        resposta: "Oui, voici mon passeport. Je vais attendre, alors. Merci beaucoup."
      - pergunta: "Depuis quand vous avez mal, et est-ce que vous avez de la fièvre ?"
        resposta: "Depuis quelques jours. Pas de fièvre, mais une toux."
      - pergunta: "Revenez si vous ne vous sentez pas mieux. Bon rétablissement."
        resposta: "D'accord. Je vais aller à la pharmacie tout de suite. Merci, docteur."

fala_livre:
  enunciado: "Você está com dor de garganta há dois dias e vai a um consultório sem hora marcada. Peça atendimento na recepção, explique há quanto tempo sente desconforto e peça para repetir se não entender alguma orientação."
  passos:
    - "Na recepção, diga que não tem hora marcada e pergunte se podem atendê-lo hoje."
    - "Explique de forma simples desde quando está com dor de garganta e se tem febre."
    - "Confirme que vai à farmácia e descansar em casa, e peça repetição se precisar."
  criterio: "Pedido de encaixe polido, relato cotidiano claro e confirmação das orientações."
  duracao_alvo_s: 60
