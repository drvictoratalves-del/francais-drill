id: "aula-27"
titulo: "Aula 27 — No médico — uma consulta simples"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "5 · Situações Complexas e Balanço (24–30)"
tipo: "aula"
ordem: 27
foco: "Consulta médica simples: agendar e relatar mal-estar cotidiano"
notion_url: "https://app.notion.com/p/42205941420581ad953ee458465719c0"

cena:
  - "Une consultation simple chez le médecin."
  - "Après deux jours, ma gorge n'allait pas vraiment mieux, et je me fatiguais plus vite qu'avant. La pharmacienne m'avait dit de voir un médecin si ça continuait. Ce matin, je suis donc allé dans un petit cabinet, près de la mairie."
  - "À l'accueil, une secrétaire m'a demandé : « Bonjour. Vous avez rendez-vous ? »"
  - "« Bonjour, madame. Non, pas encore. Je voudrais voir un médecin, s'il vous plaît, pour un mal de gorge. Pourriez-vous me prendre aujourd'hui ? »"
  - "« Je vais regarder… Oui, le docteur peut vous recevoir dans une demi-heure, si vous restez ici. Vous avez une pièce d'identité ? »"
  - "« Oui, voici mon passeport. Je vais attendre, alors. Merci beaucoup. »"
  - "J'ai attendu dans une salle calme, plus petite que celle d'un hôpital. Ensuite, le médecin m'a fait entrer et m'a demandé depuis quand j'avais mal, et si j'avais de la fièvre. Je lui ai expliqué, simplement : depuis quelques jours, pas de fièvre, mais une toux, et un sommeil un peu moins bon. Il m'a examiné sans se presser, puis il m'a dit que ce n'était pas inquiétant, mais qu'il valait mieux me reposer."
  - "« Je vais vous donner une ordonnance, pour la pharmacie. Revenez si, dans quelques jours, vous ne vous sentez pas mieux, ou si la fièvre apparaît. En attendant, buvez beaucoup d'eau, et évitez de trop parler si la gorge vous fait mal. »"
  - "« D'accord. Je vais aller à la pharmacie tout de suite, et je vais rester au calme cet après-midi. Merci, docteur. »"
  - "« Je vous en prie. Bon rétablissement. »"
  - "Je suis ressorti plus tranquille qu'en arrivant. Je n'avais pas tout compris du premier coup, alors j'ai demandé au médecin de répéter la dernière phrase, et il l'a fait clairement. Sur le chemin, j'ai envoyé un message à Camille : je devais reporter notre café."

