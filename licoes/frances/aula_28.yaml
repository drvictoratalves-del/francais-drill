id: "aula-28"
titulo: "Aula 28 — No escritório de turismo"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "5 · Situações Complexas e Balanço (24–30)"
tipo: "aula"
ordem: 28
foco: "Escritório de turismo: passeio de um dia e horários"
notion_url: "https://app.notion.com/p/4220594142058130b586e05e66bcac4c"

cena:
  - "À l'office de tourisme, pour préparer une excursion."
  - "Avant de quitter la ville, je voulais encore voir une chose ou deux, hors du centre. Ce matin, je suis entré à l'office de tourisme, sur la place principale."
  - "Une conseillère m'a souri : « Bonjour. Vous cherchez une information, ou un billet ? »"
  - "« Bonjour, madame. Je cherche plutôt un conseil. Je voudrais faire une petite excursion, demain, pas trop loin. Pourriez-vous me proposer quelque chose de bien, en une journée, sans voiture ? »"
  - "« Oui, bien sûr. Il y a un beau village, un peu plus au sud, à quarante minutes en train. Il est plus calme que le centre, et il y a un château qu'on peut visiter l'après-midi. Voici un dépliant. Les horaires du train y sont aussi. »"
  - "« Merci. Le château est ouvert tous les jours ? C'est plus intéressant le matin, ou l'après-midi ? »"
  - "« Tous les jours, sauf le mardi. L'après-midi, il y a parfois une visite guidée, un peu plus complète que la visite libre. Vous pouvez réserver ici, si vous voulez. »"
  - "« Je vais y réfléchir, et je vais d'abord regarder les trains. Vous en avez encore, des dépliants en français ? »"
  - "« J'en ai encore. Tenez, je vous en donne un deuxième. »"
  - "« Parfait. Et pour revenir le soir, le dernier train part à quelle heure ? »"
  - "« À dix-neuf heures dix. Il ne faut pas le rater : après, il n'y en a plus. »"
  - "« D'accord. Je vais prendre celui de neuf heures, et revenir avec le dernier. Merci beaucoup. Vous m'avez bien aidé. »"
  - "« Je vous en prie. Bonne excursion ! »"
  - "J'ai rangé les dépliants dans mon sac. Dehors, j'ai comparé les horaires. Le plan était plus clair qu'une recherche trop rapide sur le téléphone : j'avais une idée, et un train."

vocabulario:
  - fr: "l'office de tourisme"
    pt: "o posto de informações turísticas"
  - fr: "une excursion"
    pt: "uma excursão / passeio"
  - fr: "hors du centre"
    pt: "fora do centro"
  - fr: "un village"
    pt: "um vilarejo"
  - fr: "un château"
    pt: "um castelo"
  - fr: "un dépliant"
    pt: "um folheto"
  - fr: "sauf le mardi"
    pt: "exceto às terças"
  - fr: "une visite libre"
    pt: "uma visita livre (sem guia)"
  - fr: "y réfléchir"
    pt: "pensar a respeito"
  - fr: "rater"
    pt: "perder (trem, ônibus)"
  - fr: "un deuxième"
    pt: "um segundo"
  - fr: "le dernier"
    pt: "o último"

pronuncia:
  - fr: "Je voudrais faire une petite excursion, demain, pas trop loin."
    pt: "Eu gostaria de fazer um pequeno passeio, amanhã, não muito longe."
    dica: "'Loin' tem som nasal /lwɛ̃/ (/lwɛ̃/)."
  - fr: "Il y a un beau village, un peu plus au sud."
    pt: "Há um belo vilarejo, um pouco mais ao sul."
    dica: "Em 'sud', pronuncia-se o 'd' final (/syd/)."
  - fr: "Voici un dépliant. Les horaires du train y sont aussi."
    pt: "Aqui está um folheto. Os horários do trem também estão nele."
    dica: "Em 'dépliant', o 't' final é mudo (/de.pli.jɑ̃/)."
  - fr: "Le château est ouvert tous les jours ?"
    pt: "O castelo fica aberto todos os dias?"
    dica: "'Château' termina em /o/ longo (/ʃa.to/); em 'tous les jours', 'tous' perde o 's' (/tu le ʒuʁ/)."
  - fr: "Je vais y réfléchir, et je vais d'abord regarder les trains."
    pt: "Vou pensar nisso e primeiro vou olhar os trens."
    dica: "Pronuncie o 'r' final de 'réfléchir' (/ʁe.fle.ʃiʁ/)."
  - fr: "Vous en avez encore, des dépliants en français ?"
    pt: "A senhora ainda tem folhetos em francês?"
    dica: "Liaisons em 'Vous en avez' (/vu.zɑ̃.na.ve/)."
  - fr: "À dix-neuf heures dix. Il ne faut pas le rater."
    pt: "Às dezenove e dez. Não dá para perdê-lo."
    dica: "Em 'dix-neuf heures', o 'x' vira /z/ e o 'f' vira /v/ (/diz.nœ.vœʁ/)."
  - fr: "Vous m'avez bien aidé."
    pt: "A senhora me ajudou muito."
    dica: "Ligue 'bien aidé' com /n/ suave (/bjɛ̃.ne.de/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Pourriez-vous me proposer quelque chose de bien, en une journée, sans voiture ?"
        pt: "Poderia me sugerir algo bom, para um dia, sem carro?"
      - fr: "Le château est ouvert tous les jours ?"
        pt: "O castelo fica aberto todos os dias?"
      - fr: "Je vais y réfléchir, et je vais d'abord regarder les trains."
        pt: "Vou pensar nisso e primeiro vou olhar os trens."
      - fr: "Et pour revenir le soir, le dernier train part à quelle heure ?"
        pt: "E para voltar à noite, o último trem parte a que horas?"
      - fr: "Je vais prendre celui de neuf heures, et revenir avec le dernier."
        pt: "Vou pegar o das nove e voltar com o último."

  - tipo: semaforo
    itens:
      - errado: "Je vais réfléchir à ça."
        certo: "Je vais y réfléchir."
        nota_pt: "Com réfléchir à quelque chose, o pronome y substitui à ça antes do verbo."
      - errado: "Je ne veux pas perdre le dernier train."
        certo: "Il ne faut pas le rater."
        nota_pt: "Para perder um transporte (trem, ônibus), o verbo idiomático é rater (não perdre)."
      - errado: "Vous avez encore des dépliants ?"
        certo: "Vous en avez encore, des dépliants en français ?"
        nota_pt: "Quando encore retoma um substantivo contável já citado, usa-se en antes do verbo."
      - errado: "Après, il n'y a pas plus."
        certo: "Après, il n'y en a plus."
        nota_pt: "Com quantidade negada de algo já mencionado, usa-se en: il n'y en a plus."

  - tipo: producao
    itens:
      - pergunta: "Bonjour. Vous cherchez une information, ou un billet ?"
        resposta: "Bonjour, madame. Je cherche plutôt un conseil pour une petite excursion demain, sans voiture."
      - pergunta: "Voici un dépliant. Les horaires du train y sont aussi."
        resposta: "Merci. Le château est ouvert tous les jours ? C'est plus intéressant le matin, ou l'après-midi ?"
      - pergunta: "Vous pouvez réserver ici, si vous voulez."
        resposta: "Je vais y réfléchir, et je vais d'abord regarder les trains."
      - pergunta: "Le dernier train part à dix-neuf heures dix."
        resposta: "D'accord. Je vais prendre celui de neuf heures, et revenir avec le dernier. Merci beaucoup."

fala_livre:
  enunciado: "Você entrou no posto de turismo para planejar um passeio de um dia sem carro. Peça uma sugestão, pergunte os dias de abertura da atração, peça outro folheto e confirme o horário do último trem de volta."
  passos:
    - "Peça uma sugestão de passeio de um dia sem carro (« en une journée, sans voiture »)."
    - "Pergunte quando o lugar abre e se há visita guiada à tarde."
    - "Peça um folheto extra, confirme o último trem de volta e agradeça."
  criterio: "Uso de y réfléchir, rater le train e perguntas claras de horário."
  duracao_alvo_s: 60
