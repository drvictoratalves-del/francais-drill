id: "aula-29"
titulo: "Aula 29 — Uma visita guiada"
nivel: "A2 → A2+"
velocidade: "-10%"
bloco: "5 · Situações Complexas e Balanço (24–30)"
tipo: "aula"
ordem: 29
foco: "Visita guiada: acompanhar explicações, pedir repetição e comparar"
notion_url: "https://app.notion.com/p/422059414205813c8c51df1e7092a3cd"

cena:
  - "Une visite guidée dans le vieux quartier."
  - "Le lendemain, j'ai choisi la visite guidée de l'après-midi, dans le vieux quartier. Nous étions un petit groupe, moins nombreux que dans un musée, et le guide parlait clairement, un peu plus lentement que dans la rue. Il nous a d'abord donné un plan, puis nous sommes partis à pied, depuis l'église."
  - "« Si vous avez une question, n'hésitez pas. On va d'abord voir la place, ensuite une cour intérieure, et enfin le bord de la rivière. Ce n'est pas plus long qu'une heure et demie. »"
  - "Sur la place, il nous a montré une façade plus ancienne que les autres, et il nous a expliqué pourquoi les fenêtres y étaient si hautes. Je n'ai pas tout saisi du premier coup, alors je lui ai demandé : « Pardon, vous pourriez répéter cette partie, s'il vous plaît ? Un peu plus lentement. »"
  - "« Bien sûr. Ces maisons, on les a construites au dix-septième siècle. Les habitants y rangeaient la marchandise au rez-de-chaussée, et ils habitaient au-dessus. »"
  - "Ensuite, nous sommes entrés dans une petite cour. Il y faisait plus frais, et le bruit de la ville y était presque absent. Une femme du groupe a pris des photos, et le guide lui a dit qu'elle pouvait en prendre, mais sans flash. J'en ai pris quelques-unes, moi aussi, pour m'en souvenir plus tard."
  - "Au bord de l'eau, nous nous sommes arrêtés. Le guide nous a comparé deux ponts : l'un, plus vieux, encore utilisé ; l'autre, plus récent, plus large. Il nous a demandé ce que nous en pensions. J'ai répondu, simplement, que le plus vieux me paraissait plus beau."
  - "À la fin, il nous a remerciés et nous a indiqué un café, juste derrière nous. J'y suis resté un quart d'heure, avec mon plan. J'avais mieux compris le quartier qu'en marchant tout seul, et j'avais même appris quelques mots nouveaux."

