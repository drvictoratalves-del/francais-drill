pronuncia:
  - fr: "Si vous avez une question, n'hésitez pas."
    pt: "Se tiverem uma pergunta, não hesitem."
    dica: "Liaison /z/ em 'n'hésitez' (/ne.zi.te/)."
  - fr: "Ce n'est pas plus long qu'une heure et demie."
    pt: "Não dura mais do que uma hora e meia."
    dica: "'Long' termina em nasal /ɔ̃/ sem pronunciar o 'g' (/lɔ̃/)."
  - fr: "Pardon, vous pourriez répéter cette partie, s'il vous plaît ?"
    pt: "Perdão, poderia repetir essa parte, por favor?"
    dica: "'Partie' termina em /i/ longo (/paʁ.ti/)."
  - fr: "Ces maisons, on les a construites au dix-septième siècle."
    pt: "Estas casas foram construídas no século dezessete."
    dica: "'Construites' pronuncia o 't' antes do 'e' (/kɔ̃s.tʁɥit/)."
  - fr: "Les habitants y rangeaient la marchandise au rez-de-chaussée."
    pt: "Os moradores guardavam a mercadoria no térreo."
    dica: "'Rez-de-chaussée' soa /ʁed.ʃo.se/ (o 'z' de 'rez' é mudo)."
  - fr: "J'en ai pris quelques-unes, moi aussi, pour m'en souvenir plus tard."
    pt: "Tirei algumas, eu também, para lembrar depois."
    dica: "Liaison /z/ em 'quelques-unes' (/kɛl.kə.zyn/)."
  - fr: "Le plus vieux me paraissait plus beau."
    pt: "A mais antiga me parecia mais bonita."
    dica: "'Vieux' tem /ø/ fechado sem 'x' (/vjø/)."
  - fr: "J'avais mieux compris le quartier qu'en marchant tout seul."
    pt: "Eu tinha entendido melhor o bairro do que andando sozinho."
    dica: "Note o particípio 'compris' sem 's' audível (/kɔ̃.pʁi/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Pardon, vous pourriez répéter cette partie, s'il vous plaît ? Un peu plus lentement."
        pt: "Perdão, poderia repetir essa parte, por favor? Um pouco mais devagar."
      - fr: "On va d'abord voir la place, ensuite une cour intérieure, et enfin le bord de la rivière."
        pt: "Vamos ver primeiro a praça, depois um pátio interno e, por fim, a beira do rio."
      - fr: "J'en ai pris quelques-unes, moi aussi, pour m'en souvenir plus tard."
        pt: "Tirei algumas, eu também, para lembrar disso depois."
      - fr: "J'ai répondu que le plus vieux me paraissait plus beau."
        pt: "Respondi que a mais antiga me parecia mais bonita."
      - fr: "J'avais mieux compris le quartier qu'en marchant tout seul."
        pt: "Eu tinha entendido melhor o bairro do que andando sozinho."

  - tipo: semaforo
    itens:
      - errado: "J'ai pris quelques photos pour souvenir."
        certo: "J'en ai pris quelques-unes pour m'en souvenir."
        nota_pt: "O verbo lembrar-se é pronominal (se souvenir de) e usa en para retomar 'das fotos/disso'."
      - errado: "Nous avons arrêté au bord de l'eau."
        certo: "Nous nous sommes arrêtés au bord de l'eau."
        nota_pt: "Parar (a si mesmo) é s'arrêter, conjugado com être no passé composé."
      - errado: "Le guide nous a demandé qu'est-ce que nous pensions."
        certo: "Il nous a demandé ce que nous en pensions."
        nota_pt: "Na pergunta indireta, qu'est-ce que vira ce que (nunca qu'est-ce que)."
      - errado: "J'avais plus bien compris le quartier."
        certo: "J'avais mieux compris le quartier."
        nota_pt: "O comparativo de bien é sempre mieux (nunca plus bien)."

  - tipo: producao
    itens:
      - pergunta: "Si vous avez une question, n'hésitez pas."
        resposta: "Pardon, vous pourriez répéter cette partie, s'il vous plaît ? Un peu plus lentement."
      - pergunta: "On peut prendre des photos ici ?"
        resposta: "Oui, on peut en prendre, mais sans flash."
      - pergunta: "Qu'est-ce que vous pensez de ces deux ponts ?"
        resposta: "Le plus vieux me paraît plus beau."
      - pergunta: "La visite vous a plu ?"
        resposta: "Oui, beaucoup. J'ai mieux compris le quartier qu'en marchant tout seul."

fala_livre:
  enunciado: "Conte como foi uma visita guiada que você fez pelo bairro histórico. Explique o trajeto, diga que pediu para o guia repetir uma explicação, mencione que tirou algumas fotos e compare dois lugares vistos no passeio."
  passos:
    - "Descreva o início da visita guiada e os lugares do trajeto (« d'abord… ensuite… enfin… »)."
    - "Conte que não entendeu algo de primeira e pediu para repetir mais devagar."
    - "Compare dois pontos do passeio e diga o que achou mais bonito (« me paraissait plus beau »)."
  criterio: "Uso correto de ce que, mieux que, se souvenir e pedido de repetição."
  duracao_alvo_s: 60
