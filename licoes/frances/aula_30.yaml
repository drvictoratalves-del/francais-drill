pronuncia:
  - fr: "Alors, vous en pensez quoi, de cette semaine ?"
    pt: "Então, o que você acha desta semana?"
    dica: "Liaison /z/ em 'vous en' (/vu.zɑ̃/); 'pensez' fecha em /e/."
  - fr: "J'en pense beaucoup de bien."
    pt: "Acho muito boa / tenho ótima impressão."
    dica: "'Beaucoup' termina em /u/ sem 'p' (/bo.ku/)."
  - fr: "Ce n'était pas toujours facile, mais j'ai toujours trouvé quelqu'un pour m'aider."
    pt: "Nem sempre foi fácil, mas sempre encontrei alguém para me ajudar."
    dica: "'Quelqu'un' tem /œ̃/ ou /ɛ̃/ nasal no fim (/kɛl.kœ̃/)."
  - fr: "La ville m'a l'air plus petite maintenant."
    pt: "A cidade me parece menor agora."
    dica: "Mantenha 'maintenant' fluido (/mɛ̃t.nɑ̃/)."
  - fr: "Oui, j'aimerais y revenir, et un peu plus longtemps."
    pt: "Sim, eu gostaria de voltar aqui, e por um pouco mais de tempo."
    dica: "'Longtemps' perde o 'g', o 'p' e o 's' finais (/lɔ̃.tɑ̃/)."
  - fr: "Vous pourriez m'écrire, de temps en temps ?"
    pt: "Você poderia me escrever, de vez em quando?"
    dica: "Liaison /z/ entre 'temps' e 'en': /də.tɑ̃.zɑ̃.tɑ̃/."
  - fr: "Envoyez-moi un message quand vous serez arrivé."
    pt: "Mande-me uma mensagem quando tiver chegado."
    dica: "'Envoyez' tem /ɑ̃.vwa.je/ suave."
  - fr: "Je me sentais enfin capable de raconter un voyage en français."
    pt: "Eu me sentia finalmente capaz de contar uma viagem em francês."
    dica: "'Enfant' e 'enfin' usam /ɑ̃/ + /fɛ̃/ (/ɑ̃.fɛ̃/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "J'en pense beaucoup de bien."
        pt: "Tenho uma ótima impressão disso."
      - fr: "Ce n'était pas toujours facile, mais j'ai toujours trouvé quelqu'un pour m'aider."
        pt: "Nem sempre foi fácil, mas sempre encontrei alguém para me ajudar."
      - fr: "La ville m'a l'air plus petite maintenant, parce que je la connais mieux."
        pt: "A cidade me parece menor agora, porque eu a conheço melhor."
      - fr: "Oui, j'aimerais y revenir, et un peu plus longtemps."
        pt: "Sim, eu gostaria de voltar aqui, e por um pouco mais de tempo."
      - fr: "Vous pourriez m'écrire, de temps en temps ?"
        pt: "Você poderia me escrever, de vez em quando?"

  - tipo: semaforo
    itens:
      - errado: "Vous pensez quoi de cette semaine ?"
        certo: "Vous en pensez quoi, de cette semaine ?"
        nota_pt: "Com a deslocação da pergunta no final (de cette semaine), o pronome en antecipa a ideia antes do verbo."
      - errado: "Je suis allé au marché, au musée, à la gare, et j'ai attendu le bus pendant la grève."
        certo: "J'ai attendu un bus pendant une grève, et j'ai changé de chambre."
        nota_pt: "Use artigo indefinido un/une ao mencionar um episódio específico pela primeira vez."
      - errado: "J'aime revenir ici plus longtemps."
        certo: "Oui, j'aimerais y revenir, et un peu plus longtemps."
        nota_pt: "Para desejo futuro polido usa-se o condicional j'aimerais + pronome y."
      - errado: "Nous allons garder le contact."
        certo: "On gardera le contact."
        nota_pt: "O futuro simples (gardera) soa natural para promessa de manter contato."

  - tipo: producao
    itens:
      - pergunta: "Alors, vous en pensez quoi, de cette semaine ?"
        resposta: "J'en pense beaucoup de bien. Ce n'était pas toujours facile, mais j'ai toujours trouvé quelqu'un pour m'aider."
      - pergunta: "Et ce que vous avez préféré ?"
        resposta: "Le dîner avec vous et Thomas, et aussi la visite guidée."
      - pergunta: "Vous y reviendrez ?"
        resposta: "Oui, j'aimerais y revenir, et un peu plus longtemps. Vous pourriez m'écrire, de temps en temps ?"
      - pergunta: "Envoyez-moi un message quand vous serez arrivé, et on gardera le contact."
        resposta: "Merci, Camille. Et merci pour tous ces jours. À bientôt, j'espère."

fala_livre:
  enunciado: "Faça um balanço oral da sua semana de viagem. Conte como foi no começo e como ficou depois, cite um momento preferido, um imprevisto que resolveu, e diga o que gostaria de fazer numa próxima viagem."
  passos:
    - "Avalie a semana (« J'en pense beaucoup de bien ») comparando o início com o final."
    - "Cite um momento marcante ou favorito e um imprevisto que conseguiu resolver."
    - "Fale dos planos futuros com condicional (« j'aimerais y revenir ») e despeça-se."
  criterio: "Passé composé, imparfait, condicional e expressão natural de balanço."
  duracao_alvo_s: 60
