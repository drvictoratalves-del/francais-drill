notion_url: "https://app.notion.com/p/422059414205814eab24ec14c4d1c60c"

cena:
  - "Le bilan d'une belle semaine."
  - "Le dernier soir, avant de préparer ma valise, je me suis assis à mon bureau d'hôtel, et j'ai pensé à la semaine. Elle avait été plus pleine que je ne l'avais imaginée. J'ai écrit quelques phrases, puis Camille m'a appelé pour me dire au revoir."
  - "« Alors, vous en pensez quoi, de cette semaine ? »"
  - "« J'en pense beaucoup de bien. Au début, je demandais souvent de répéter, et je restais un peu trop près de l'hôtel. Ensuite, je suis allé au marché, au musée, à la gare, même à l'aéroport. J'ai perdu mon sac un matin, j'ai attendu un bus pendant une grève, et j'ai changé de chambre. Ce n'était pas toujours facile, mais j'ai toujours trouvé quelqu'un pour m'aider. »"
  - "« Et ce que vous avez préféré ? »"
  - "« Le dîner avec vous et Thomas, je crois, et aussi la visite guidée. C'était plus vivant que de lire un guide tout seul. La ville m'a l'air plus petite maintenant, parce que je la connais mieux. Au début, elle me paraissait plus grande. »"
  - "« Vous y reviendrez ? »"
  - "« Oui, j'aimerais y revenir, et un peu plus longtemps. La prochaine fois, je voudrais revoir Lyon, et le village du dépliant, s'il fait beau. Je vais d'abord rentrer, raconter ça à ma famille, et continuer à pratiquer. Vous pourriez m'écrire, de temps en temps ? »"
  - "« Avec plaisir. Envoyez-moi un message quand vous serez arrivé, et on gardera le contact. Bon voyage, Victor. »"
  - "« Merci, Camille. Et merci pour tous ces jours. À bientôt, j'espère. »"
  - "Après l'appel, j'ai refermé mon carnet. J'avais encore une valise à fermer, et un train à prendre le lendemain matin. Mais je me sentais enfin capable de raconter un voyage en français : ce que j'avais fait, ce que je n'avais pas compris tout de suite, et ce que je voudrais refaire, plus tard, un peu mieux."

