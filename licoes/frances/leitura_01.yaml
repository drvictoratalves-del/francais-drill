id: "leitura-01"
titulo: "Une journée en ville — leitura em 30 linhas"
nivel: "A1 → A2"
velocidade: "-10%"
bloco: "Leituras de Imersão"
tipo: "leitura"
ordem: 41
foco: "Escuta longa contínua (30 frases), microditado, pronome en e reconto no passado/futuro"
notion_url: "https://app.notion.com/p/42205941420581d983edf7600f1b7881"

cena:
  - "Je m'appelle Julien et je viens du Brésil."
  - "Cette semaine, je passe quelques jours dans une ville française."
  - "Je parle un peu français, mais je cherche parfois mes mots."
  - "Ce matin, je quitte mon hôtel après le petit déjeuner."
  - "À la réception, je demande un plan du quartier."
  - "La réceptionniste me montre un marché près de la gare."
  - "Je lui demande si je peux y aller à pied."
  - "Elle me répond que le trajet prend environ dix minutes."
  - "Avant de partir, je vérifie le chemin avec elle."
  - "Dans la rue, je cherche un café pour faire une petite pause."
  - "Je trouve une table libre près de la fenêtre."
  - "Le serveur arrive et me demande ce que je voudrais boire."
  - "Je commande un café au lait et un verre d'eau."
  - "Il parle un peu vite, alors je lui demande de répéter."
  - "Il reformule sa question plus lentement et je comprends."
  - "Après le café, je continue ma promenade jusqu'au marché."
  - "Les commerçants proposent des fruits, du pain et du fromage."
  - "Je demande le prix des pommes et j'en achète deux."
  - "Une vendeuse me conseille aussi une spécialité de la région."
  - "Je la remercie, puis je lui pose une question sur le quartier."
  - "Elle me parle d'un petit parc derrière la mairie."
  - "Je décide d'y aller avant le déjeuner."
  - "Dans le parc, je m'assieds sur un banc et je regarde mon plan."
  - "Une personne me demande si la place à côté de moi est libre."
  - "Nous parlons un peu de la ville et de nos voyages."
  - "Je ne comprends pas tous les mots, mais je peux poser des questions."
  - "Hier, j'ai visité un musée et j'ai pris quelques photos."
  - "Demain, je vais découvrir un autre quartier."
  - "Ce soir, je vais noter les expressions que j'ai utilisées."
  - "Je fais encore des erreurs, mais je réussis à me faire comprendre."

vocabulario:
  - fr: "je cherche mes mots"
    pt: "procuro as palavras"
  - fr: "le quartier"
    pt: "o bairro"
  - fr: "le trajet"
    pt: "o trajeto"
  - fr: "elle me répond que…"
    pt: "ela me responde que…"
  - fr: "il reformule"
    pt: "ele reformula / diz de outra maneira"
  - fr: "j'en achète deux"
    pt: "compro duas (en retoma as maçãs)"
  - fr: "la mairie"
    pt: "a prefeitura"
  - fr: "je m'assieds"
    pt: "eu me sento"
  - fr: "un banc"
    pt: "um banco (de parque)"
  - fr: "je réussis à me faire comprendre"
    pt: "consigo me fazer entender"

pronuncia:
  - fr: "Je parle un peu français, mais je cherche parfois mes mots."
    pt: "Falo um pouco de francês, mas às vezes procuro as palavras."
    dica: "Em 'un peu', lábios projetados (/ø/); 'parfois' e 'mots' terminam sem pronunciar o 's'."
  - fr: "Je lui demande si je peux y aller à pied."
    pt: "Pergunto a ela se posso ir lá a pé."
    dica: "Mantenha 'lui' em uma sílaba fluida (/lɥi/) e 'peux' com /ø/ fechado."
  - fr: "Elle me répond que le trajet prend environ dix minutes."
    pt: "Ela me responde que o trajeto leva cerca de dez minutos."
    dica: "'Trajet' termina em /ɛ/ sem 't'; 'dix minutes' reduz o 'x' antes de consoante (/di mi.nyt/)."
  - fr: "Je commande un café au lait et un verre d'eau."
    pt: "Peço um café com leite e um copo d'água."
    dica: "Ligue 'verre d'eau' suavemente (/vɛʁ do/); 'eau' é uma vogal só (/o/)."
  - fr: "Il parle un peu vite, alors je lui demande de répéter."
    pt: "Ele fala um pouco rápido, então peço a ele para repetir."
    dica: "Em 'alors', o 's' final é mudo (/a.lɔʁ/)."
  - fr: "Les commerçants proposent des fruits, du pain et du fromage."
    pt: "Os comerciantes oferecem frutas, pão e queijo."
    dica: "Atenção ao /y/ de 'fruits' (/fʁɥi/) e 'du' (/dy/), diferente do /u/."
  - fr: "Je demande le prix des pommes et j'en achète deux."
    pt: "Pergunto o preço das maçãs e compro duas."
    dica: "Liaison obrigatória em 'j'en achète' (/ʒɑ̃.na.ʃɛt/) e 'prix' sem 'x' (/pʁi/)."
  - fr: "Dans le parc, je m'assieds sur un banc et je regarde mon plan."
    pt: "No parque, sento-me num banco e olho o meu mapa."
    dica: "'M'assieds' soa /ma.sje/ (o 'ds' final é mudo) e 'banc' soa /bɑ̃/ (sem 'c')."
  - fr: "Hier, j'ai visité un musée et j'ai pris quelques photos."
    pt: "Ontem, visitei um museu e tirei algumas fotos."
    dica: "Pronuncie o 'r' final de 'hier' (/jɛʁ/) e o /y/ de 'musée' (/my.ze/)."
  - fr: "Je fais encore des erreurs, mais je réussis à me faire comprendre."
    pt: "Ainda cometo erros, mas consigo me fazer entender."
    dica: "Liaison em 'des erreurs' (/de.zɛ.ʁœʁ/) e /y/ bem marcado em 'réussis' (/ʁe.y.si/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Je lui demande si je peux y aller à pied."
        pt: "Pergunto a ela se posso ir lá a pé."
      - fr: "Il parle un peu vite, alors je lui demande de répéter."
        pt: "Ele fala um pouco rápido, então peço a ele para repetir."
      - fr: "Je demande le prix des pommes et j'en achète deux."
        pt: "Pergunto o preço das maçãs e compro duas."
      - fr: "Hier, j'ai visité un musée et j'ai pris quelques photos."
        pt: "Ontem, visitei um museu e tirei algumas fotos."
      - fr: "Je fais encore des erreurs, mais je réussis à me faire comprendre."
        pt: "Ainda cometo erros, mas consigo me fazer entender."

  - tipo: semaforo
    itens:
      - errado: "Je demande le prix des pommes et j'achète deux."
        certo: "Je demande le prix des pommes et j'en achète deux."
        nota_pt: "Em francês, um número sem o substantivo depois pede o pronome en antes do verbo."
      - errado: "Je peux aller là-bas en pied."
        certo: "Je peux y aller à pied."
        nota_pt: "Y retoma o lugar mencionado antes, e a pé é sempre à pied."
      - errado: "Je réussis me faire comprendre."
        certo: "Je réussis à me faire comprendre."
        nota_pt: "O verbo réussir exige a preposição à antes de outro verbo no infinitivo."

  - tipo: producao
    itens:
      - pergunta: "Où se trouve le marché ?"
        resposta: "Le marché est près de la gare."
      - pergunta: "Comment Julien veut-il aller au marché ?"
        resposta: "Il veut y aller à pied."
      - pergunta: "Pourquoi demande-t-il au serveur de répéter ?"
        resposta: "Parce que le serveur parle un peu vite."
      - pergunta: "Qu'est-ce qu'il a fait hier ?"
        resposta: "Hier, il a visité un musée et il a pris quelques photos."
      - pergunta: "Quel est son plan pour demain ?"
        resposta: "Demain, il va découvrir un autre quartier."

fala_livre:
  enunciado: "Reconte o dia de Julien sem olhar o texto, primeiro usando cinco pontos-chave e depois trocando três acontecimentos por escolhas suas."
  passos:
    - "Comece situando o hotel, o mapa do bairro e a ida a pé ao café e ao mercado."
    - "Conte o momento em que pediu para o garçom repetir mais devagar e o que comprou."
    - "Feche misturando passado (hier, j'ai…) e futuro próximo (demain, je vais…)."
  criterio: "Reconto encadeado com pelo menos um trecho no passado e um plano no futuro próximo."
  duracao_alvo_s: 75
