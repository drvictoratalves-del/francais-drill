id: "leitura-02"
titulo: "Un week-end à Lyon — glossário e verbos"
nivel: "A1 → A2"
velocidade: "-10%"
bloco: "Leituras de Imersão"
tipo: "leitura"
ordem: 42
foco: "Narrativa de fim de semana: passé composé (avoir/être) e imparfait"
notion_url: "https://app.notion.com/p/40c05941420581639887f2fcb9ba5fa8"

cena:
  - "Un week-end à Lyon."
  - "Je m'appelle Paul. J'ai quarante ans et j'habite à Paris. Je suis médecin. Je travaille beaucoup, alors le week-end, j'aime voyager. Le mois dernier, je suis allé à Lyon avec ma femme, Claire."
  - "Vendredi soir, nous avons pris le train à la gare de Lyon, à Paris. Le voyage dure deux heures. Dans le train, Claire a lu un livre et moi, j'ai regardé le paysage. Il y avait des champs, des vaches et des petits villages. C'était très calme."
  - "Nous sommes arrivés à Lyon à vingt et une heures. Il faisait un peu froid. Nous avons pris un taxi pour aller à l'hôtel. L'hôtel était petit mais très joli, près de la rivière. À la réception, une dame très gentille nous a dit : « Bonsoir ! Vous avez une réservation ? » J'ai répondu : « Oui, au nom de Martin, pour deux nuits. » Elle a dit : « Parfait. Votre chambre est au troisième étage. Le petit-déjeuner est servi de sept heures à dix heures. » « Merci beaucoup. Il y a un ascenseur ? » « Oui, à gauche, monsieur. »"
  - "Samedi matin, nous avons pris le petit-déjeuner à l'hôtel : du café, du pain, du beurre, de la confiture et des croissants. Les croissants étaient délicieux ! Ensuite, nous sommes sortis pour visiter la ville."
  - "D'abord, nous sommes allés dans la vieille ville. Les rues sont étroites et les maisons sont très anciennes. Nous avons marché pendant deux heures. Après, nous avons pris un petit train pour monter sur la colline. En haut, il y a une grande basilique. La vue sur la ville est magnifique. Claire a pris beaucoup de photos."
  - "À midi, nous avions très faim. Nous avons cherché un restaurant typique. À Lyon, on appelle ça un « bouchon ». Le serveur nous a demandé : « Vous êtes combien ? » « Nous sommes deux. » « Une table près de la fenêtre, ça vous va ? » « Oui, très bien, merci. » J'ai commandé une salade lyonnaise et Claire a choisi le poisson. Comme boisson, nous avons pris une carafe d'eau et un verre de vin rouge. Comme dessert, nous avons partagé une tarte aux pralines. C'est une spécialité de Lyon. Elle est rose et très sucrée. À la fin, j'ai demandé : « L'addition, s'il vous plaît. » Nous avons payé par carte."
  - "L'après-midi, il a commencé à pleuvoir. Nous n'avions pas de parapluie ! Alors, nous sommes entrés dans un musée. C'était une bonne idée. Le musée était grand et intéressant. Nous sommes restés là jusqu'à dix-sept heures. Quand nous sommes sortis, il ne pleuvait plus."
  - "Le soir, nous étions fatigués. Nous avons mangé une pizza dans un petit restaurant italien, et nous sommes rentrés à l'hôtel tôt."
  - "Dimanche, nous avons eu un petit problème. Le matin, à la gare, nous avons regardé le grand écran : notre train avait une heure de retard. Claire n'était pas contente. J'ai demandé à un employé : « Excusez-moi, le train pour Paris a du retard ? » « Oui, monsieur, une heure. Il y a un problème technique. » « D'accord. Il part de quel quai ? » « Du quai numéro cinq. » Nous avons attendu dans un café de la gare. J'ai bu un chocolat chaud et Claire a pris un thé. Finalement, le train est parti à onze heures et demie."
  - "Nous sommes arrivés à Paris en début d'après-midi. C'était un très bon week-end. Lyon est une belle ville, avec une très bonne cuisine. La prochaine fois, je voudrais visiter Marseille, au bord de la mer. Et vous ? Quelle ville française vous voulez visiter ?"

