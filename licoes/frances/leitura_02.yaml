pronuncia:
  - fr: "Le mois dernier, je suis allé à Lyon avec ma femme, Claire."
    pt: "No mês passado, fui a Lyon com minha esposa, Claire."
    dica: "'Mois' soa /mwa/ sem 's'; 'dernier' fecha em /e/ sem 'r' (/dɛʁ.nje/)."
  - fr: "Il y avait des champs, des vaches et des petits villages."
    pt: "Havia campos, vacas e pequenos vilarejos."
    dica: "'Champs' tem nasal /ɑ̃/ sem pronunciar 'ps' (/ʃɑ̃/)."
  - fr: "Nous sommes arrivés à Lyon à vingt et une heures."
    pt: "Chegamos a Lyon às vinte e uma horas."
    dica: "Liaison /z/ em 'arrivés à' (/a.ʁi.ve.za/)."
  - fr: "Votre chambre est au troisième étage."
    pt: "O quarto de vocês fica no terceiro andar."
    dica: "Liaison /m/ → /z/ em 'troisième étage' (/tʁwa.zjɛ.me.taʒ/)."
  - fr: "Ensuite, nous sommes sortis pour visiter la ville."
    pt: "Depois, saímos para visitar a cidade."
    dica: "'Ville' pronuncia o 'l' claro (/vil/), nunca /vij/."
  - fr: "À midi, nous avions très faim."
    pt: "Ao meio-dia, estávamos com muita fome."
    dica: "'Faim' tem som nasal /fɛ̃/ sem pronunciar o 'm'."
  - fr: "Quand nous sommes sortis, il ne pleuvait plus."
    pt: "Quando saímos, não chovia mais."
    dica: "Em 'quand nous', o 'd' final é mudo (/kɑ̃ nu/)."
  - fr: "Il part de quel quai ? Du quai numéro cinq."
    pt: "Ele sai de qual plataforma? Da plataforma número cinco."
    dica: "'Quai' soa /ke/; em 'cinq' isolado no fim da frase, o 'q' soa (/sɛ̃k/)."

blocos:
  - tipo: decomposicao
    itens:
      - fr: "Le mois dernier, je suis allé à Lyon avec ma femme, Claire."
        pt: "No mês passado, fui a Lyon com minha esposa, Claire."
      - fr: "Nous sommes arrivés à Lyon à vingt et une heures."
        pt: "Chegamos a Lyon às vinte e uma horas."
      - fr: "Une table près de la fenêtre, ça vous va ?"
        pt: "Uma mesa perto da janela, está bom para vocês?"
      - fr: "Quand nous sommes sortis, il ne pleuvait plus."
        pt: "Quando saímos, não chovia mais."
      - fr: "La prochaine fois, je voudrais visiter Marseille, au bord de la mer."
        pt: "Da próxima vez, eu gostaria de visitar Marselha, à beira-mar."

  - tipo: semaforo
    itens:
      - errado: "Nous avons allé à Lyon."
        certo: "Nous sommes allés à Lyon."
        nota_pt: "Aller usa sempre être no passé composé e concorda com nous no plural (allés)."
      - errado: "Il était un peu froid."
        certo: "Il faisait un peu froid."
        nota_pt: "Para temperatura e clima no passado, usa-se il faisait (imparfait de faire)."
      - errado: "Nous avons resté au musée."
        certo: "Nous sommes restés là jusqu'à dix-sept heures."
        nota_pt: "Rester também faz o passé composé com être + concordância no plural."
      - errado: "Le train a retard."
        certo: "Notre train avait une heure de retard."
        nota_pt: "Em francês, estar atrasado é avoir du retard (ou avoir une heure de retard)."

  - tipo: producao
    itens:
      - pergunta: "Vous avez une réservation ?"
        resposta: "Oui, au nom de Martin, pour deux nuits."
      - pergunta: "Une table près de la fenêtre, ça vous va ?"
        resposta: "Oui, très bien, merci."
      - pergunta: "Excusez-moi, le train pour Paris a du retard ?"
        resposta: "Oui, monsieur, une heure. Il part du quai numéro cinq."
      - pergunta: "Et vous ? Quelle ville française vous voulez visiter ?"
        resposta: "La prochaine fois, je voudrais visiter Marseille, au bord de la mer."

fala_livre:
  enunciado: "Reconte o fim de semana em Lyon em francês (45–90 s): diga como foi a viagem de trem, o hotel, o almoço num bouchon, a chuva à tarde e o atraso do trem na volta."
  passos:
    - "Apresente a viagem de ida e o hotel misturando passé composé (ações) e imparfait (cenário)."
    - "Descreva o passeio na vieille ville e o almoço típico em Lyon."
    - "Conte o imprevisto da chuva ou do atraso na volta e diga qual cidade gostaria de visitar depois."
  criterio: "Uso equilibrado de passé composé (avoir/être) e imparfait na narrativa."
  duracao_alvo_s: 90
